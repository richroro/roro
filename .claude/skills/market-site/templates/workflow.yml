name: Update {{SITE_DIR}} data

on:
  schedule:
    - cron: "5 * * * *" # 매시 5분에 실행 (필요시 빈도 조절)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch news & stock data
        run: python scripts/update_{{SITE_DIR}}_data.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- {{SITE_DIR}}/data.json; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add {{SITE_DIR}}/data.json
          git commit -m "chore: update {{SITE_DIR}} data [skip ci]"
          git push

<title>Roro Arcade</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* One committed visual world: an arcade cabinet screen. Painted explicitly so it holds
     on either host ground rather than borrowing the viewer's theme. */
  :root {
    --ground: #0E1116;
    --panel: #161C27;
    --panel-hi: #1D2532;
    --edge: #2A3444;
    --ink: #ECF1F8;
    --dim: #8695AC;          /* neutral pulled toward the marquee amber */
    --marquee: #F2A33C;
    --marquee-soft: #F2A33C33;
    --dodge: #2FB8A6;
    --rush: #8CC04A;
    --strike: #4A8FE0;
    --display: "Bungee", "Arial Black", Impact, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    padding-inline: 16px;
    padding-block: 20px 28px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .shell { width: 100%; max-width: 940px; display: flex; flex-direction: column; gap: 22px; }

  /* ---- marquee ---- */
  .marquee { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .bulbs { display: flex; gap: 9px; }
  .bulbs i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--marquee); opacity: 0.35;
    animation: chase 2.4s linear infinite;
  }
  .bulbs i:nth-child(2) { animation-delay: 0.3s; }
  .bulbs i:nth-child(3) { animation-delay: 0.6s; }
  .bulbs i:nth-child(4) { animation-delay: 0.9s; }
  .bulbs i:nth-child(5) { animation-delay: 1.2s; }
  .bulbs i:nth-child(6) { animation-delay: 1.5s; }
  .bulbs i:nth-child(7) { animation-delay: 1.8s; }
  .bulbs i:nth-child(8) { animation-delay: 2.1s; }
  @keyframes chase { 0%, 70% { opacity: 0.3; } 12% { opacity: 1; box-shadow: 0 0 10px var(--marquee); } }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-size: clamp(1.7rem, 7vw, 2.6rem);
    font-weight: 400;
    letter-spacing: 0.04em;
    color: var(--marquee);
    text-wrap: balance;
    text-shadow: 0 0 22px var(--marquee-soft);
  }
  .sub { margin: 0; font-size: 0.82rem; color: var(--dim); letter-spacing: 0.14em; text-transform: uppercase; }

  /* ---- the three cabinets ---- */
  .rack { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 760px) { .rack { grid-template-columns: repeat(3, 1fr); } }

  .cab {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 14px;
    align-items: center;
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 14px;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
  }
  @media (min-width: 760px) { .cab { grid-template-columns: 1fr; align-items: stretch; } }
  .cab:hover, .cab:focus-visible { background: var(--panel-hi); border-color: var(--tint); transform: translateY(-2px); }
  .cab:focus-visible { outline: 2px solid var(--marquee); outline-offset: 3px; }
  .cab:active { transform: translateY(0); }

  .shot {
    width: 96px; aspect-ratio: 9 / 16; max-width: 100%;
    border-radius: 9px; overflow: hidden;
    background: #0B1020;
    border: 1px solid var(--edge);
    display: block;
  }
  @media (min-width: 760px) { .shot { width: 100%; aspect-ratio: 3 / 4; } }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }

  .meta { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .genre {
    font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--tint);
  }
  .name { font-size: 1.06rem; font-weight: 600; letter-spacing: -0.01em; }
  .en { font-family: var(--display); font-size: 0.64rem; font-weight: 400; color: var(--tint);
        letter-spacing: 0.06em; opacity: 0.85; }
  .blurb { font-size: 0.8rem; color: var(--dim); line-height: 1.45; }
  .record {
    font-family: var(--mono); font-size: 0.72rem; font-variant-numeric: tabular-nums;
    color: var(--ink); padding-top: 4px; border-top: 1px dashed var(--edge); margin-top: 3px;
  }
  .record .none { color: var(--dim); }

  .foot { font-size: 0.74rem; color: var(--dim); text-align: center; line-height: 1.6; }
  .foot kbd {
    font-family: var(--mono); font-size: 0.68rem; padding: 1px 5px;
    border: 1px solid var(--edge); border-radius: 4px; background: var(--panel);
  }

  /* ---- a game, full bleed ---- */
  #play[hidden] { display: none !important; }
  #play {
    position: fixed; inset: 0; z-index: 20;
    background: var(--ground);
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .bar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-bottom: 1px solid var(--edge); background: var(--panel);
  }
  .back {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 13px; border-radius: 9px;
    border: 1px solid var(--edge); background: var(--panel-hi); color: var(--ink);
    font: 600 0.82rem var(--body); cursor: pointer;
  }
  .back:hover { border-color: var(--marquee); }
  .back:focus-visible { outline: 2px solid var(--marquee); outline-offset: 2px; }
  .playing { font-family: var(--display); font-size: 0.86rem; font-weight: 400; color: var(--marquee); }
  #frame { flex: 1 1 auto; width: 100%; border: 0; display: block; min-height: 0; }

  @media (prefers-reduced-motion: reduce) {
    .bulbs i { animation: none; opacity: 0.55; }
    .cab { transition: none; }
    .cab:hover, .cab:focus-visible { transform: none; }
  }
</style>

<div class="shell">
  <div class="marquee">
    <div class="bulbs" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <h1>RORO ARCADE</h1>
    <p class="sub">게임 3종 · 설치 없이 바로</p>
  </div>

  <div class="rack" id="rack"></div>

  <p class="foot">
    기록은 이 브라우저에만 저장됩니다 · 게임 중 <kbd>Esc</kbd> 를 누르면 목록으로 돌아옵니다<br>
    안드로이드 APK는 GitHub 릴리스에서 게임별로 따로 받을 수 있습니다
  </p>
</div>

<div id="play" hidden>
  <div class="bar">
    <button class="back" id="back" type="button">← 목록</button>
    <span class="playing" id="playing"></span>
  </div>
  <iframe id="frame" title="게임 화면" allow="autoplay"></iframe>
</div>

<script>
  const GAMES = [
    {
      id: 'skydodge', file: 'sky-dodge.html', tint: 'var(--dodge)',
      name: '스카이 닷지', en: 'SKY DODGE', genre: '피하기',
      blurb: '떨어지는 블록을 좌우로 피하면서 별을 줍는다. 한 손으로 끝나는 게임.',
      shot: '__SHOT_SKYDODGE__',
      record: () => { const v = read('skydodge.best'); return v ? `최고 ${(+v).toLocaleString()}점` : null; },
    },
    {
      id: 'villainrush', file: 'crowd-rush.html', tint: 'var(--rush)',
      name: '빌런 러시', en: 'VILLAIN RUSH', genre: '러너 슈팅',
      blurb: '동료를 모아 달리며 게이트를 쏴 머릿수를 불리고, 스테이지 끝의 현실 빌런을 상대한다.',
      shot: '__SHOT_VILLAINRUSH__',
      record: () => { const v = read('goblinhunters.bestLevel'); return v && +v > 0 ? `최고 ${v} 스테이지` : null; },
    },
    {
      id: 'skystrike', file: 'sky-strike.html', tint: 'var(--strike)',
      name: '스카이 스트라이크', en: 'SKY STRIKE', genre: '슈팅',
      blurb: '적기 12종, 아이템 14종. 스테이지를 깰 때마다 강화를 하나씩 골라 기체를 키운다. AI 버튼을 누르면 알아서 날아간다.',
      shot: '__SHOT_SKYSTRIKE__',
      record: () => {
        const lv = read('skystrike.best'), sc = read('skystrike.bestScore');
        if (!lv && !sc) return null;
        const bits = [];
        if (lv && +lv > 0) bits.push(`최고 ${lv} 스테이지`);
        if (sc && +sc > 0) bits.push(`${(+sc).toLocaleString()}점`);
        return bits.join(' · ') || null;
      },
    },
  ];

  function read(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  const rack = document.getElementById('rack');
  const play = document.getElementById('play');
  const frame = document.getElementById('frame');
  const playing = document.getElementById('playing');

  function paint() {
    rack.textContent = '';
    for (const g of GAMES) {
      const rec = g.record();
      const cab = document.createElement('button');
      cab.type = 'button';
      cab.className = 'cab';
      cab.style.setProperty('--tint', g.tint);
      cab.setAttribute('aria-label', `${g.name} 플레이`);
      cab.innerHTML =
        `<span class="shot"><img src="${g.shot}" alt="${g.name} 플레이 화면" loading="eager" decoding="async"></span>` +
        `<span class="meta">` +
          `<span class="genre">${g.genre}</span>` +
          `<span class="name">${g.name}</span>` +
          `<span class="en">${g.en}</span>` +
          `<span class="blurb">${g.blurb}</span>` +
          `<span class="record">${rec ? rec : '<span class="none">아직 기록 없음</span>'}</span>` +
        `</span>`;
      cab.addEventListener('click', () => open(g));
      rack.appendChild(cab);
    }
  }

  function open(g) {
    playing.textContent = g.name;
    frame.src = g.file;
    play.hidden = false;
    document.body.style.overflow = 'hidden';
    frame.focus();
  }

  function close() {
    play.hidden = true;
    frame.src = 'about:blank';       // stop the game's loop and audio
    document.body.style.overflow = '';
    paint();                         // a fresh run may have set a new record
  }

  document.getElementById('back').addEventListener('click', close);
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !play.hidden) { e.preventDefault(); close(); }
  });

  paint();
</script>

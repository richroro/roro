<title>Villain Rush</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root {
    --ground: #0B1020;
    --panel: #151C33;
    --line: #2A3560;
    --text: #F8FAFC;
    --muted: #9AA6C8;
    --ally: #14B8A6;
    --enemy: #84CC16;
    --gold: #FACC15;
    --display: "Lilita One", "Arial Black", Impact, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--text); font-family: var(--body);
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  header { width: 100%; max-width: 420px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.35rem; letter-spacing: 0.02em; white-space: nowrap; }
  .tag { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .stage { width: 100%; max-width: 420px; flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; }
  canvas {
    display: block; max-width: 100%; max-height: 100%; aspect-ratio: 9 / 16; border-radius: 18px;
    border: 1px solid var(--line); background: #BFE3FF; touch-action: none; user-select: none; -webkit-user-select: none; outline: none;
  }
  canvas:focus-visible { box-shadow: 0 0 0 3px var(--gold); }
  .hints { width: 100%; max-width: 420px; display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 0.8rem; color: var(--muted); justify-content: space-between; }
  #mute { margin-left: 8px; font-size: 1rem; line-height: 1; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); cursor: pointer; vertical-align: middle; }
  #mute:focus-visible { outline: 2px solid var(--gold); }
  kbd { font-family: var(--body); font-weight: 600; font-size: 0.75rem; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--text); }
</style>

<header>
  <h1>Villain Rush</h1>
  <span class="tag">직장인 생존기 · 브라우저 버전 <button id="mute" type="button" aria-label="소리 켜기/끄기" title="소리 (M)">🔊</button></span>
</header>
<div class="stage">
  <canvas id="game" tabindex="0" aria-label="Goblin Hunters 게임 화면. 좌우 드래그 또는 방향키로 군단을 조작합니다."></canvas>
</div>
<div class="hints">
  <span>드래그 또는 <kbd>←</kbd> <kbd>→</kbd> 로 이동 · 탭/스페이스로 시작 · <kbd>M</kbd> 소리</span>
  <span>동료를 모아 자동 사격 · 게이트를 쏘면 숫자 상승 · 아이템: ⚡연사 🛡방어막 ✚증원 💣폭탄</span>
</div>

<script>
(function () {
  // ---------- CrowdWorld: pure simulation (mirrors android-game/crowdrush CrowdWorld.kt) ----------
  const C = {
    LANE_HALF: 1.0, PLAYER_BASE_RADIUS: 0.12, PLAYER_RADIUS_GROWTH: 0.018, PLAYER_MAX_RADIUS: 0.42,
    BASE_SPEED: 4.4, SPEED_PER_LEVEL: 0.28, MAX_SPEED: 8.5,
    BASE_LENGTH: 132, LENGTH_PER_LEVEL: 10,
    BASE_GATES: 5, GATES_PER_LEVEL: 1, MAX_GATES: 12,
    BASE_ENEMIES: 2, ENEMIES_PER_TWO_LEVELS: 1, MAX_ENEMIES: 8,
    ENEMY_HALF_WIDTH: 0.36, BOSS_FACTOR: 0.6, START_COUNT: 1,
    MAX_CREW: 99999, MAX_GATE_VALUE: 999, MAX_MUL_VALUE: 9,
    MAX_FRAME_DT: 0.05, STRAFE_GAIN: 2.4,
    // shooting
    MAX_SHOOTERS: 40, SHOTS_PER_SHOOTER: 1.2, BULLET_SPEED: 28, BULLET_RANGE: 48,
    GATE_HITS_PER_STEP: 3, MUL_HITS_PER_STEP: 20, DIV_HITS_TO_FLIP: 15,
    BOSS_SHOOT_FACTOR: 0.5, ENEMY_SHOOT_FACTOR: 0.10,
    ENEMY_GATE_CLEARANCE: 7, LANE_MIN_Z: 24, ENEMY_MARCH_SPEED: 0.7, ENEMY_MARCH_RANGE: 30, MIN_ENEMY: 2,
    // items
    ITEM_RADIUS: 0.22, BASE_ITEMS: 2, ITEMS_PER_TWO_LEVELS: 1, MAX_ITEMS: 5, ITEM_CLEARANCE: 5,
    RAPID_SECONDS: 6, RAPID_MULT: 2, REINFORCE_RATIO: 0.3, REINFORCE_MIN: 3, BOMB_RANGE: 40, BOMB_BOSS_RATIO: 0.1,
    // barricades ("벽") and the mid-stage mini villain
    BARRICADE_HALF: 0.5, BARRICADE_HP_FACTOR: 0.32, BARRICADE_SHOT_FACTOR: 0.1, MIN_BARRICADE_HP: 3,
    WALL_MIN_CLEARANCE: 3.5, ELITE_MULT: 1.7, ELITE_AT: 0.6,
    // monster
    MONSTER_KINDS: 4, MONSTER_MARCH_RANGE: 30, MONSTER_MARCH_SPEED: 0.45,
  };
  // Each stage is a small everyday-villain story. The monster at the end of the road is the villain.
  const STAGES = [
    {
      place: '월요일 오전 9시 · 사무실', villain: '김부장', tag: '왕년엔 말이야',
      story: '주간회의 5분 전.\n부장님이 내 기획안을 들고 오시더니\n"이거 내가 말했던 거잖아?" 라고 하신다.',
      mob: '갑자기 잡힌 회의',
      clear: '부장님, 다음 주 휴가 가신다고 합니다.',
      fail: '내 기획안은 부장님 이름으로 올라갔다.',
    },
    {
      place: '10년 만의 동창회 · 호텔 뷔페', villain: '황금수저', tag: '재벌집 사위',
      story: '"야 난 그냥 쉬어~\n장인어른이 건물 하나 주셔서."\n오늘만 벌써 세 번째로 차 키를 꺼낸다.',
      mob: '은근한 자랑',
      clear: '그가 2차를 쐈다. 오늘은 내가 이겼다.',
      fail: '집에 오는 길에 전세 계약서를 다시 읽었다.',
    },
    {
      place: '추석 당일 · 큰집 거실', villain: '잔소리 이모', tag: '30년째 같은 질문',
      story: '전을 채 삼키기도 전에 시작된다.\n"취직은? 결혼은?\n옆집 애는 벌써 둘째라던데."',
      mob: '잔소리',
      clear: '이모가 드라마 보러 가셨다.\n지금이 기회다.',
      fail: '설날 예고편이 벌써 떴다. "그때 보자."',
    },
    {
      place: '이사 첫날 밤 11시 · 새 아파트', villain: '층간소음 마왕', tag: '윗집',
      story: '분명 조용한 동네라고 했는데.\n천장에서 드리블 소리가 들린다.\n심지어 리듬까지 탄다.',
      mob: '쿵쿵',
      clear: '윗집이 매트를 깔았다.\n마침내 평화가 왔다.',
      fail: '새벽 3시. 나는 천장을 보며 눈을 떴다.',
    },
  ];
  // How each stage is laid out. This is what stops every stage feeling like the same run:
  // the office throws meetings (gates) at you, the reunion puts up walls of bragging,
  // the family dinner comes in waves of nagging, the flat is fast and full of walls.
  const PROFILES = [
    { gates: 1.35, enemies: 0.5, walls: 0, items: 1.0, speed: 1.0, mini: '과장님' },
    { gates: 0.8, enemies: 0.5, walls: 2, items: 1.2, speed: 1.0, mini: '동창회 총무' },
    { gates: 0.7, enemies: 1.7, walls: 1, items: 1.0, speed: 0.95, mini: '큰어머니' },
    { gates: 1.0, enemies: 0.8, walls: 3, items: 1.3, speed: 1.15, mini: '관리사무소장' },
  ];
  const profileOf = (level) => PROFILES[(level - 1) % PROFILES.length];
  const stageOf = (level) => STAGES[(level - 1) % STAGES.length];
  const seasonOf = (level) => Math.floor((level - 1) / STAGES.length) + 1;
  const MONSTER_NAMES = STAGES.map(s => s.villain);
  const ITEM = { RAPID: { glyph: '⚡', color: '#F59E0B', name: '연사' }, SHIELD: { glyph: '🛡', color: '#22D3EE', name: '방어막' }, REINFORCE: { glyph: '✚', color: '#22C55E', name: '증원' }, BOMB: { glyph: '💣', color: '#A855F7', name: '폭탄' } };
  function pickItemKind(r) { const v = r(); return v < 0.3 ? 'RAPID' : v < 0.6 ? 'REINFORCE' : v < 0.85 ? 'SHIELD' : 'BOMB'; }
  const State = { READY: 'READY', RUNNING: 'RUNNING', LEVEL_CLEAR: 'LEVEL_CLEAR', GAME_OVER: 'GAME_OVER' };

  // Deterministic PRNG so the level generator matches across ports (mulberry32).
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  // Clamped to MAX_CREW: unclamped, a good run compounds past a billion in a dozen levels.
  const applyOp = (count, op, v) => op === 'ADD' ? Math.min(C.MAX_CREW, count + v) : op === 'MUL' ? Math.min(C.MAX_CREW, count * v) : op === 'SUB' ? Math.max(0, count - v) : Math.max(0, Math.floor(count / v));
  const opLabel = (op, v) => op === 'ADD' ? '+' + v : op === 'MUL' ? '×' + v : op === 'SUB' ? '−' + v : '÷' + v;
  const isGood = (op) => op === 'ADD' || op === 'MUL';
  const fireRate = (count) => Math.min(count, C.MAX_SHOOTERS) * C.SHOTS_PER_SHOOTER; // bullets per second
  // A bullet hitting a gate side improves it: +N grows, −N shrinks and flips to +1, ÷2 flips to +1 after enough hits.
  function hitGateSide(side) { // returns true when the displayed value changed
    side.hits++;
    if (side.op === 'ADD') { if (side.hits % C.GATE_HITS_PER_STEP === 0 && side.v < C.MAX_GATE_VALUE) { side.v++; return true; } }
    else if (side.op === 'MUL') { if (side.hits % C.MUL_HITS_PER_STEP === 0 && side.v < C.MAX_MUL_VALUE) { side.v++; return true; } }
    else if (side.op === 'SUB') { if (side.hits % C.GATE_HITS_PER_STEP === 0) { side.v--; if (side.v <= 0) { side.op = 'ADD'; side.v = 1; side.hits = 0; } return true; } }
    else if (side.hits >= C.DIV_HITS_TO_FLIP) { side.op = 'ADD'; side.v = 1; side.hits = 0; return true; }
    return false;
  }

  class CrowdWorld {
    constructor(seed) { this.seed = seed || 1; this.level = 1; this.bestLevel = 0; this.state = State.READY; this.count = C.START_COUNT; this.playerX = 0; this.z = 0; this.gates = []; this.enemies = []; this.boss = null; this.length = 0; this.speed = 0; this.message = ''; this.flash = 0; this.bullets = []; this.fireAccumulator = 0; this.shotRng = rng(seed || 1); this.kills = 0; this.events = []; this.items = []; this.walls = []; this.rapidTimer = 0; this.shield = false; }
    get playerRadius() { return Math.min(C.PLAYER_MAX_RADIUS, C.PLAYER_BASE_RADIUS + C.PLAYER_RADIUS_GROWTH * Math.sqrt(this.count)); }
    startLevel(level) {
      this.level = level; const r = rng(this.seed * 7919 + level * 104729);
      this.length = C.BASE_LENGTH + C.LENGTH_PER_LEVEL * (level - 1);
      this.speed = Math.min(C.MAX_SPEED, C.BASE_SPEED + C.SPEED_PER_LEVEL * (level - 1));
      this.count = C.START_COUNT; this.playerX = 0; this.z = 0; this.flash = 0; this.message = ''; this.bullets = []; this.fireAccumulator = 0; this.kills = 0; this.events = []; this.items = []; this.walls = []; this.rapidTimer = 0; this.shield = false;
      const prof = profileOf(level);
      this.speed *= prof.speed;
      const nGates = Math.max(3, Math.round(Math.min(C.MAX_GATES, C.BASE_GATES + C.GATES_PER_LEVEL * (level - 1)) * prof.gates));
      const spacing = (this.length - 20) / nGates;
      this.gates = []; let best = C.START_COUNT;
      for (let i = 0; i < nGates; i++) {
        const z = 14 + spacing * i + r() * spacing * 0.3;
        const goodOp = r() < 0.35 && best >= 4 ? 'MUL' : 'ADD';
        const goodV = goodOp === 'MUL' ? (r() < 0.75 ? 2 : 3) : Math.min(C.MAX_GATE_VALUE, 2 + Math.floor(r() * (4 + level * 2 + best * 0.4)));
        let otherOp, otherV;
        const roll = r();
        if (roll < 0.4) { otherOp = 'ADD'; otherV = Math.min(C.MAX_GATE_VALUE, Math.max(1, Math.floor(goodV * (0.3 + r() * 0.4)))); }
        else if (roll < 0.7) { otherOp = 'SUB'; otherV = Math.min(C.MAX_GATE_VALUE, 1 + Math.floor(r() * Math.max(2, best * 0.3))); }
        else { otherOp = 'DIV'; otherV = 2; }
        const goodLeft = r() < 0.5;
        const left = goodLeft ? { op: goodOp, v: goodV, hits: 0 } : { op: otherOp, v: otherV, hits: 0 };
        const right = goodLeft ? { op: otherOp, v: otherV, hits: 0 } : { op: goodOp, v: goodV, hits: 0 };
        this.gates.push({ z, left, right, used: false });
        best = Math.max(applyOp(best, left.op, left.v), applyOp(best, right.op, right.v));
      }
      const nEnemies = Math.max(1, Math.round(Math.min(C.MAX_ENEMIES, C.BASE_ENEMIES + Math.floor((level - 1) / 2) * C.ENEMIES_PER_TWO_LEVELS) * prof.enemies));
      this.enemies = [];
      // Squads are spread evenly along the lane (one per zone), kept clear of gates, alternate
      // sides, and grow with how far along the lane they stand.
      const zoneStart = 40, zoneEnd = this.length - 22, zoneLen = (zoneEnd - zoneStart) / nEnemies;
      const clearOfGates = (z) => z >= C.LANE_MIN_Z && z <= this.length - 12 && this.gates.every(g => Math.abs(g.z - z) >= C.ENEMY_GATE_CLEARANCE);
      for (let i = 0; i < nEnemies; i++) {
        const preferred = Math.min(this.length - 12, Math.max(C.LANE_MIN_Z, zoneStart + zoneLen * (i + 0.35 + r() * 0.3)));
        // Walk outwards from the preferred spot until the squad stands clear of every gate.
        let z = NaN;
        for (let off = 0; off <= zoneLen + C.ENEMY_GATE_CLEARANCE && Number.isNaN(z); off += 1) {
          if (clearOfGates(preferred + off)) z = preferred + off; else if (clearOfGates(preferred - off)) z = preferred - off;
        }
        if (Number.isNaN(z)) continue;
        const progress = z / this.length;
        const expected = this.expectedCountAt(z);
        const shotsInRange = fireRate(expected) * (C.BULLET_RANGE / this.speed);
        const n = Math.max(C.MIN_ENEMY, Math.floor(expected * (0.2 + 0.3 * progress) + shotsInRange * C.ENEMY_SHOOT_FACTOR));
        const x = (i % 2 === 0 ? -1 : 1) * (0.25 + r() * 0.4);
        this.enemies.push({ z, x, n, max: n, alive: true, elite: false, step: 0 });
      }
      // One squad becomes the stage's mini villain: bigger, named, harder to walk past.
      if (this.enemies.length) {
        let best_i = 0, bestD = Infinity;
        for (let i = 0; i < this.enemies.length; i++) {
          const d = Math.abs(this.enemies[i].z - this.length * C.ELITE_AT);
          if (d < bestD) { bestD = d; best_i = i; }
        }
        const e = this.enemies[best_i];
        e.elite = true; e.name = prof.mini;
        e.n = Math.max(C.MIN_ENEMY + 1, Math.floor(e.n * C.ELITE_MULT)); e.max = e.n;
      }
      // Barricades: a wall across one half of the lane. Shoot it down or steer through the gap;
      // walking into whatever is left costs that many people.
      const nWalls = prof.walls;
      this.walls = [];
      if (nWalls > 0) {
        const wzStart = 34, wzEnd = this.length - 16, wzLen = (wzEnd - wzStart) / nWalls;
        // Gates can be dense enough that no spot is "far" from all of them, so take the roomiest
        // spot in the zone rather than the first one past a fixed clearance.
        const gapAt = (z) => {
          let gap = Infinity;
          for (const g of this.gates) gap = Math.min(gap, Math.abs(g.z - z));
          for (const e of this.enemies) gap = Math.min(gap, Math.abs(e.z - z));
          for (const wl of this.walls) gap = Math.min(gap, Math.abs(wl.z - z));
          return gap;
        };
        for (let i = 0; i < nWalls; i++) {
          const lo = Math.max(30, wzStart + wzLen * i), hi = Math.min(this.length - 14, wzStart + wzLen * (i + 1));
          let z = NaN, bestGap = -1;
          for (let cand = lo; cand <= hi; cand += 0.5) {
            const gap = gapAt(cand);
            if (gap > bestGap) { bestGap = gap; z = cand; }
          }
          if (Number.isNaN(z) || bestGap < C.WALL_MIN_CLEARANCE) continue;
          const expected = this.expectedCountAt(z);
          const shots = fireRate(expected) * (C.BULLET_RANGE / this.speed);
          const hp = Math.max(C.MIN_BARRICADE_HP, Math.floor(expected * C.BARRICADE_HP_FACTOR + shots * C.BARRICADE_SHOT_FACTOR));
          const side = r() < 0.5 ? -1 : 1;
          this.walls.push({ z, x: side * (1 - C.BARRICADE_HALF), half: C.BARRICADE_HALF, hp, max: hp, alive: true });
        }
      }
      // Items: one per zone, clear of gates and squads, random kind.
      const nItems = Math.min(C.MAX_ITEMS, C.BASE_ITEMS + Math.floor((level - 1) / 2) * C.ITEMS_PER_TWO_LEVELS);
      this.items = [];
      const izStart = 20, izEnd = this.length - 16, izLen = (izEnd - izStart) / nItems;
      const clear = (z) => z >= 16 && z <= this.length - 10 && this.gates.every(g => Math.abs(g.z - z) >= C.ITEM_CLEARANCE) && this.enemies.every(e => Math.abs(e.z - z) >= C.ITEM_CLEARANCE) && this.walls.every(b => Math.abs(b.z - z) >= C.ITEM_CLEARANCE);
      for (let i = 0; i < nItems; i++) {
        const preferred = Math.min(this.length - 10, Math.max(16, izStart + izLen * (i + 0.2 + r() * 0.6)));
        // Walk outwards from the preferred spot until the item is clear of every gate and squad.
        let z = NaN;
        for (let off = 0; off <= izLen && Number.isNaN(z); off += 1) {
          if (clear(preferred + off)) z = preferred + off; else if (clear(preferred - off)) z = preferred - off;
        }
        const x = -0.6 + r() * 1.2, kind = pickItemKind(r);
        if (!Number.isNaN(z)) this.items.push({ z, x, kind, alive: true });
      }
      // The boss is sized so that a best-path army wins even while shooting only half its shots on target.
      const bossShots = fireRate(best) * (C.BULLET_RANGE / this.speed);
      this.boss = { z: this.length, n: Math.max(3, Math.floor(best * C.BOSS_FACTOR + bossShots * C.BOSS_SHOOT_FACTOR)), alive: true, max: 0, kind: (level - 1) % C.MONSTER_KINDS, roared: false, marching: false };
      this.boss.max = this.boss.n;
      this.state = State.RUNNING;
    }
    // Best-path count after all gates before z (used to size enemies fairly).
    expectedCountAt(z) {
      let c = C.START_COUNT;
      for (const g of this.gates) if (g.z < z) c = Math.max(applyOp(c, g.left.op, g.left.v), applyOp(c, g.right.op, g.right.v));
      return c;
    }
    start() { this.startLevel(1); }
    nextLevel() { this.startLevel(this.level + 1); }
    movePlayerBy(dx) { const lim = C.LANE_HALF - this.playerRadius; this.playerX = Math.min(lim, Math.max(-lim, this.playerX + dx)); }
    update(dtSeconds) {
      if (this.state !== State.RUNNING) return;
      const dt = Math.min(C.MAX_FRAME_DT, Math.max(0, dtSeconds));
      const prevZ = this.z; this.z += this.speed * dt; this.flash = Math.max(0, this.flash - dt);
      this.rapidTimer = Math.max(0, this.rapidTimer - dt);
      for (const it of this.items) {
        if (it.alive && it.z > prevZ && it.z <= this.z && Math.abs(it.x - this.playerX) < C.ITEM_RADIUS + this.playerRadius) { it.alive = false; this.applyItem(it); }
      }
      for (const e of this.enemies) {
        // Squads notice you and start moving: they creep at the edge of their range and build up
        // to a walk, instead of snapping from perfectly still to full speed.
        const d = e.z - this.z;
        if (e.alive && d > 0 && d < C.ENEMY_MARCH_RANGE) {
          const t = 1 - d / C.ENEMY_MARCH_RANGE;
          const ease = t * t * (3 - 2 * t);
          e.z -= C.ENEMY_MARCH_SPEED * ease * dt;
          e.step = ease;
        } else if (d > 0) e.step = 0;   // still up the road, has not noticed you yet
        // A squad you have already walked past keeps walking as it leaves the frame; zeroing step
        // here froze the whole block mid-stride the instant it drew level with your own crowd.
      }
      { // the monster roars and stomps toward the rangers once they are in range
        const b = this.boss, d = b.z - this.z;
        if (b.alive && d > 0 && d < C.MONSTER_MARCH_RANGE) {
          if (!b.roared) { b.roared = true; this.events.push({ t: 'ROAR', x: 0, z: b.z, kind: b.kind }); }
          const t = 1 - d / C.MONSTER_MARCH_RANGE;
          b.step = t * t * (3 - 2 * t);
          b.z -= C.MONSTER_MARCH_SPEED * b.step * dt; b.marching = b.step > 0.08;
        } else { b.marching = false; b.step = 0; }
      }
      this.updateShooting(dt);
      for (const g of this.gates) {
        if (!g.used && g.z > prevZ && g.z <= this.z) {
          g.used = true; const side = this.playerX < 0 ? g.left : g.right;
          if (!isGood(side.op) && this.shield) { this.shield = false; this.events.push({ t: 'SHIELD_USED', x: this.playerX, z: g.z }); continue; }
          this.count = applyOp(this.count, side.op, side.v); this.flash = 0.25; this.lastGate = { side, good: isGood(side.op) };
          this.events.push({ t: isGood(side.op) ? 'GATE_GOOD' : 'GATE_BAD', x: this.playerX, z: g.z, label: opLabel(side.op, side.v) });
          if (this.count <= 0) { this.state = State.GAME_OVER; this.message = '버틸 사람이 하나도 남지 않았다'; this.events.push({ t: 'OVER' }); return; }
        }
      }
      for (const b of this.walls) {
        if (b.alive && b.z > prevZ && b.z <= this.z && Math.abs(b.x - this.playerX) < b.half + this.playerRadius) {
          if (this.shield) { this.shield = false; b.alive = false; this.events.push({ t: 'SHIELD_USED', x: b.x, z: b.z }); continue; }
          b.alive = false; this.count -= b.hp; this.flash = 0.25; this.lastGate = { good: false };
          this.events.push({ t: 'WALL_CONTACT', x: b.x, z: b.z, n: b.hp });
          if (this.count <= 0) { this.count = 0; this.state = State.GAME_OVER; this.message = `벽에 %d명이 갈렸다`.replace('%d', b.hp); this.events.push({ t: 'OVER' }); return; }
        }
      }
      for (const e of this.enemies) {
        if (e.alive && e.z > prevZ && e.z <= this.z && Math.abs(e.x - this.playerX) < C.ENEMY_HALF_WIDTH + this.playerRadius) {
          if (this.shield) { this.shield = false; e.alive = false; this.kills += e.n; this.events.push({ t: 'SHIELD_USED', x: e.x, z: e.z }); continue; }
          e.alive = false; this.count -= e.n; this.flash = 0.25;
          this.events.push({ t: 'CONTACT', x: e.x, z: e.z, n: e.n });
          if (this.count <= 0) { this.count = 0; this.state = State.GAME_OVER; this.message = `${stageOf(this.level).mob} ${e.n}개에 파묻혔다`; this.events.push({ t: 'OVER' }); return; }
        }

        else { this.count = 0; this.state = State.GAME_OVER; this.message = `${MONSTER_NAMES[this.boss.kind]}에게 졌다 (HP ${b} 남음)`; this.events.push({ t: 'OVER' }); }

    applyItem(it) {
      this.events.push({ t: 'ITEM', kind: it.kind, x: it.x, z: it.z });
      if (it.kind === 'RAPID') this.rapidTimer = C.RAPID_SECONDS;
      else if (it.kind === 'SHIELD') this.shield = true;
      else if (it.kind === 'REINFORCE') this.count = Math.min(C.MAX_CREW, this.count + Math.max(C.REINFORCE_MIN, Math.floor(this.count * C.REINFORCE_RATIO)));
      else if (it.kind === 'BOMB') {

        for (const wl of this.walls) if (wl.alive && wl.z - this.z < C.BOMB_RANGE) { wl.alive = false; this.kills += wl.hp; wl.hp = 0; this.events.push({ t: 'HIT_WALL', x: wl.x, z: wl.z, killed: true }); }
        if (this.boss.alive && this.boss.z - this.z < C.BOMB_RANGE) { const dmg = Math.floor(this.boss.max * C.BOMB_BOSS_RATIO); this.boss.n = Math.max(0, this.boss.n - dmg); this.kills += dmg; if (this.boss.n === 0) this.boss.alive = false; }

    updateShooting(dt) {

      this.fireAccumulator += fireRate(this.count) * (this.rapidTimer > 0 ? C.RAPID_MULT : 1) * dt;
      while (this.fireAccumulator >= 1) {

            const side = b.x < 0 ? g.left : g.right; const stepped = hitGateSide(side); b.alive = false;
            this.events.push({ t: 'HIT_GATE', x: b.x, z: g.z, good: isGood(side.op), stepped, label: opLabel(side.op, side.v) });

          }
        }
        if (!b.alive) continue;
        for (const wl of this.walls) {
          if (wl.alive && wl.z > prevBz && wl.z <= b.z && Math.abs(wl.x - b.x) < wl.half) {
            wl.hp--; b.alive = false; this.kills++;
            if (wl.hp <= 0) { wl.hp = 0; wl.alive = false; }
            this.events.push({ t: 'HIT_WALL', x: b.x, z: wl.z, killed: !wl.alive });
            break;
          }
        }
        if (!b.alive) continue;
        for (const e of this.enemies) {
          if (e.alive && e.z > prevBz && e.z <= b.z && Math.abs(e.x - b.x) < C.ENEMY_HALF_WIDTH) {
            e.n--; b.alive = false; this.kills++;
            if (e.n <= 0) e.alive = false;
            this.events.push({ t: 'HIT_ENEMY', x: b.x, z: e.z, killed: !e.alive });
            break;
          }
        }
        if (!b.alive) continue;
        if (this.boss.alive && this.boss.z > prevBz && this.boss.z <= b.z) {
          this.boss.n--; b.alive = false; this.kills++;
          if (this.boss.n <= 0) { this.boss.n = 0; this.boss.alive = false; }
          this.events.push({ t: 'HIT_BOSS', x: b.x, z: this.boss.z, killed: !this.boss.alive });
        }
      }
      this.bullets = this.bullets.filter(b => b.alive);
    }
  }

  // ---------- Audio: everything is synthesized with Web Audio, no sound files ----------
  const audio = { ctx: null, muted: false, last: {}, noise: null };
  try { audio.muted = localStorage.getItem('goblinhunters.muted') === '1'; } catch (e) {}
  const muteBtn = document.getElementById('mute');
  function renderMute() { muteBtn.textContent = audio.muted ? '🔇' : '🔊'; muteBtn.setAttribute('aria-pressed', audio.muted ? 'true' : 'false'); }
  function toggleMute() { audio.muted = !audio.muted; try { localStorage.setItem('goblinhunters.muted', audio.muted ? '1' : '0'); } catch (e) {} renderMute(); if (!audio.muted) play('ding'); }
  muteBtn.addEventListener('click', toggleMute); renderMute();
  function ac() {
    if (!audio.ctx) { try { audio.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (audio.ctx.state === 'suspended') audio.ctx.resume();

  }
  function noiseBuffer(c) {
    if (!audio.noise) { audio.noise = c.createBuffer(1, Math.floor(c.sampleRate * 0.15), c.sampleRate); const d = audio.noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }

  }
  function tone(c, at, freq, dur, vol, type) {
    const o = c.createOscillator(); o.type = type; o.frequency.value = freq;

    o.connect(g).connect(c.destination); o.start(at); o.stop(at + dur + 0.02);
  }
  function play(kind) {
    if (audio.muted) return; const c = ac(); if (!c) return; const now = c.currentTime;
    const gate = (key, min) => { if (now - (audio.last[key] || 0) < min) return false; audio.last[key] = now; return true; };
    switch (kind) {
      case 'shot': {
        if (!gate('shot', 0.07)) return;
        const src = c.createBufferSource(); src.buffer = noiseBuffer(c);
        const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1500 + Math.random() * 900;
        const g = c.createGain(); g.gain.setValueAtTime(0.35, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        src.connect(f).connect(g).connect(c.destination); src.start(now); src.stop(now + 0.1);
        const o = c.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(160, now); o.frequency.exponentialRampToValueAtTime(50, now + 0.08);
        const g2 = c.createGain(); g2.gain.setValueAtTime(0.35, now); g2.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        o.connect(g2).connect(c.destination); o.start(now); o.stop(now + 0.1);
        break;
      }
      case 'hit': if (gate('hit', 0.05)) tone(c, now, 1200 + Math.random() * 500, 0.035, 0.15, 'square'); break;
      case 'ding': if (gate('ding', 0.08)) { tone(c, now, 880, 0.16, 0.25, 'sine'); tone(c, now, 1760, 0.12, 0.1, 'sine'); } break;
      case 'buzz': if (gate('buzz', 0.15)) tone(c, now, 150, 0.22, 0.3, 'square'); break;
      case 'pickup': tone(c, now, 659.25, 0.09, 0.25, 'triangle'); tone(c, now + 0.09, 1046.5, 0.2, 0.25, 'triangle'); break;
      case 'boom': {
        const src = c.createBufferSource(); src.buffer = noiseBuffer(c); src.loop = true;
        const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(400, now); f.frequency.exponentialRampToValueAtTime(60, now + 0.5);
        const g = c.createGain(); g.gain.setValueAtTime(0.6, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        src.connect(f).connect(g).connect(c.destination); src.start(now); src.stop(now + 0.65);
        break;
      }
      case 'roar': {
        const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(95, now); o.frequency.exponentialRampToValueAtTime(60, now + 0.7);
        const lfo = c.createOscillator(); lfo.frequency.value = 9; const lg = c.createGain(); lg.gain.value = 6; lfo.connect(lg).connect(o.frequency); lfo.start(now); lfo.stop(now + 0.8);
        const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500;
        const g = c.createGain(); g.gain.setValueAtTime(0.001, now); g.gain.exponentialRampToValueAtTime(0.5, now + 0.05); g.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        o.connect(f).connect(g).connect(c.destination); o.start(now); o.stop(now + 0.85);
        const n = c.createBufferSource(); n.buffer = noiseBuffer(c); n.loop = true; const nf = c.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 300;
        const ng = c.createGain(); ng.gain.setValueAtTime(0.3, now); ng.gain.exponentialRampToValueAtTime(0.001, now + 0.7); n.connect(nf).connect(ng).connect(c.destination); n.start(now); n.stop(now + 0.75);
        break;
      }
      case 'clear': [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(c, now + i * 0.14, f, i < 3 ? 0.16 : 0.5, 0.25, 'triangle')); break;
      case 'over': {
        const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(440, now); o.frequency.exponentialRampToValueAtTime(110, now + 0.7);
        const g = c.createGain(); g.gain.setValueAtTime(0.2, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        o.connect(g).connect(c.destination); o.start(now); o.stop(now + 0.85);
        break;
      }
    }
  }

  // ---------- Visual effects (particles, floating numbers, muzzle flash) ----------
  const fx = { particles: [], texts: [], muzzle: 0, muzzleX: 0, monsterHit: 0, shake: 0, flash: 0, flashColor: '#FDE68A' };
  function screenFlash(color, strength) { fx.flash = strength; fx.flashColor = color; }
  function sparks(x, z, n, color, spread) {
    for (let i = 0; i < n; i++) {
      fx.particles.push({ x: x + (Math.random() - 0.5) * spread, z, dy: 0.04, vy: 0.08 + Math.random() * 0.14, vx: (Math.random() - 0.5) * 0.9, vz: (Math.random() - 0.3) * 4, life: 0.35 + Math.random() * 0.2, max: 0.5, color, size: 0.008 + Math.random() * 0.006 });
    }
  }
  function floatText(text, x, z, color) {
    fx.texts.push({ text, x, z, life: 0.8, max: 0.8, color, near: Math.abs(z - world.z) < 1.5 });
  }
  function handleEvent(ev) {
    switch (ev.t) {
      case 'SHOT': fx.muzzle = 0.06; fx.muzzleX = ev.x; play('shot'); break;
      case 'HIT_GATE': sparks(ev.x, ev.z, 3, ev.good ? '#FDE68A' : '#C4B5FD', 0.05); if (ev.stepped) { floatText(ev.label, ev.x < 0 ? -0.5 : 0.5, ev.z, ev.good ? '#FDE047' : '#C4B5FD'); play('ding'); } else play('hit'); break;
      case 'HIT_ENEMY': sparks(ev.x, ev.z, ev.killed ? 10 : 3, '#BEF264', 0.15); play(ev.killed ? 'ding' : 'hit'); break;
      case 'HIT_WALL': sparks(ev.x, ev.z, ev.killed ? 22 : 3, '#D6BFA0', 0.25); if (ev.killed) { screenFlash('#FDE68A', 0.25); fx.shake = 0.25; play('boom'); } else play('hit'); break;
      case 'WALL_CONTACT': floatText('-' + ev.n, ev.x, ev.z, '#FCA5A5'); sparks(ev.x, ev.z, 20, '#D6BFA0', 0.5); screenFlash('#F87171', 0.35); fx.shake = 0.3; play('buzz'); break;
      case 'HIT_BOSS': fx.monsterHit = 0.08; sparks(ev.x, ev.z, ev.killed ? 30 : 3, '#BEF264', 0.3); if (ev.killed) { fx.shake = 0.5; screenFlash('#FFFFFF', 0.5); } play(ev.killed ? 'boom' : 'hit'); break;
      case 'ROAR': floatText(MONSTER_NAMES[ev.kind] + ' 출현!', 0, ev.z, '#FCA5A5'); fx.shake = 0.5; play('roar'); break;
      case 'GATE_GOOD': floatText(ev.label, ev.x, ev.z, '#FDE047'); sparks(ev.x, ev.z, 18, '#FDE68A', 0.5); screenFlash('#FDE68A', 0.22); play('ding'); break;
      case 'GATE_BAD': floatText(ev.label, ev.x, ev.z, '#C4B5FD'); sparks(ev.x, ev.z, 10, '#C4B5FD', 0.4); screenFlash('#A78BFA', 0.3); play('buzz'); break;
      case 'CONTACT': floatText('-' + ev.n + ' ' + stageOf(world.level).mob, ev.x, ev.z, '#FCA5A5'); sparks(ev.x, ev.z, 18, '#BEF264', 0.5); screenFlash('#F87171', 0.3); fx.shake = 0.25; play('buzz'); break;
      case 'ITEM': { const info = ITEM[ev.kind]; floatText(info.glyph + ' ' + info.name, ev.x, ev.z, info.color); sparks(ev.x, ev.z, 12, info.color, 0.3); play(ev.kind === 'BOMB' ? 'boom' : 'pickup'); break; }
      case 'SHIELD_USED': floatText('🛡 방어!', ev.x, ev.z, '#22D3EE'); sparks(ev.x, ev.z, 16, '#22D3EE', 0.5); play('pickup'); break;
      case 'CLEAR': play('clear'); break;
      case 'OVER': play('over'); break;
    }
  }
  function updateFx(dt) {
    fx.muzzle = Math.max(0, fx.muzzle - dt); fx.monsterHit = Math.max(0, fx.monsterHit - dt); fx.shake = Math.max(0, fx.shake - dt); fx.flash = Math.max(0, fx.flash - dt * 2.2);
    for (const p of fx.particles) { p.life -= dt; p.x += p.vx * dt; p.z += p.vz * dt; p.dy += p.vy * dt; p.vy -= 0.5 * dt; }
    fx.particles = fx.particles.filter(p => p.life > 0);
    for (const t of fx.texts) t.life -= dt;
    fx.texts = fx.texts.filter(t => t.life > 0);
  }
  function drawFx() {
    const w = canvas._w;
    for (const p of fx.particles) {
      const d = p.z - world.z; if (d < -4 || d > 60) continue; const pr = proj(d);
      ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(sx(p.x, pr.f), pr.y - p.dy * w * pr.f * 2.2, Math.max(1.5, p.size * w * pr.f * 2), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const t of fx.texts) {
      const d = t.z - world.z;
      if (!t.near && (d < -4 || d > 60)) continue;
      const k = 1 - t.life / t.max; ctx.globalAlpha = Math.min(1, t.life / 0.3);
      if (t.near) {
        // Gate takes, contacts and pickups all happen ON the camera. Projected, they landed inside
        // the count plate in the very frame it flashes and swells, and the two outlined texts
        // smeared together. Run these up the screen from above the plate.
        label(t.text, sx(t.x, proj(0).f), playerLabelTopY - w * 0.04 - w * 0.11 * k, w * 0.06, t.color, '#0F172A');
      } else {
        const pr = proj(d);
        label(t.text, sx(t.x, pr.f), pr.y - w * (0.12 + k * 0.12) * pr.f - w * 0.02, Math.max(10, w * 0.07 * pr.f), t.color, '#0F172A');
      }
    }
    ctx.globalAlpha = 1;
    if (fx.muzzle > 0) {
      const pr = proj(0), unit = unitPx(1);
      const mx = sx(fx.muzzleX, pr.f), my = pr.y - unit * 2.2;
      const r = w * 0.03 * (0.6 + fx.muzzle / 0.06);
      const grd = ctx.createRadialGradient(mx, my, 0, mx, my, r); grd.addColorStop(0, 'rgba(255,255,220,0.95)'); grd.addColorStop(0.4, 'rgba(253,224,71,0.8)'); grd.addColorStop(1, 'rgba(249,115,22,0)');
      ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(mx, my, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ---------- Rendering ----------
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  // Sprites drawn in-house by android-game/tools/generate_sprites.py (colleagues from behind,
  // the stage's small stuff facing us, and the stage's villain).
  const WALK_FRAMES = 8, BOSS_FRAMES = 6;
  const SPRITES = { ally: Array.from({length: WALK_FRAMES}, () => new Image()), mobs: [], bosses: [] };
  for (let i = 0; i < 4; i++) {
    SPRITES.mobs.push(Array.from({length: WALK_FRAMES}, () => new Image()));

    ctx.fillStyle = '#FFFBEB'; ctx.fillRect(x - bw * 0.2, y - bh, bw * 0.4, bh * 0.55);
  }

  function draw() {
    const w = canvas._w, h = canvas._h;
    ctx.save();
    if (fx.shake > 0) ctx.translate((Math.random() - 0.5) * fx.shake * w * 0.03, (Math.random() - 0.5) * fx.shake * w * 0.03);
    drawLane();
    const items = [];
    for (const g of world.gates) items.push({ d: g.z - world.z, draw: () => drawGate(g, g.z - world.z) });
    for (const e of world.enemies) {
      if (!e.alive) continue;
      const d = e.z - world.z;
      if (d >= 60) continue;
      // A squad is a block metres deep, not a point: culling it on its front rank wiped out the
      // three dozen figures still standing in front of the camera.
      const depth = crowdDepth(drawnCount(e.max, e.max), C.ENEMY_HALF_WIDTH * (e.elite ? 1.6 : 1));
      if (d <= -4 - depth) continue;
      // once the front rank is behind us the rear rank decides what this paints over
      items.push({ d: d < 0 ? Math.min(d + depth, 59.5) : d, draw: () => drawEnemy(e, d, runTime) });
    }
    if (world.boss && world.boss.alive) items.push({ d: world.boss.z - world.z, draw: () => drawMonster(world.boss, world.boss.z - world.z, runTime) });
    for (const wl of world.walls) if (wl.alive) items.push({ d: wl.z - world.z, draw: () => drawWall(wl, wl.z - world.z) });
    for (const it of world.items) if (it.alive) items.push({ d: it.z - world.z, draw: () => drawItem(it, it.z - world.z, runTime) });
    for (const b of world.bullets) items.push({ d: b.z - world.z, draw: () => drawBullet(b, b.z - world.z) });
    items.filter(i => i.d > -4 && i.d < 60).sort((a, b) => b.d - a.d).forEach(i => i.draw());
    // player crowd
    const p = proj(0), unit = unitPx(1);
    const drawn = drawnCount(world.count, world.count);
    const px = sx(world.playerX, p.f);
    drawCrowd({
      x: world.playerX, z: world.z, drawn, slots: drawn, grid: false,
      frames: SPRITES.ally, time: runTime, stepRate: 1,
      tint: world.flash > 0 && world.lastGate && !world.lastGate.good,
    });
    const pop = world.flash > 0 ? 1 + world.flash * 0.7 : 1;
    // Float the count above the crowd's real silhouette. Pinned to a nominal figure at dz=0 it
    // sank deeper into your own ranks the more people you had - backwards from what it says.
    const labelY = Math.max(canvas._h * 0.55, lastCrowdTopY - w * 0.11 * pop * 0.35);
    label(String(world.count), px, labelY, w * 0.11 * pop, world.flash > 0 ? '#FACC15' : '#FFFFFF', '#0B5E56');
    playerLabelTopY = labelY - w * 0.11 * pop * 0.5;
        drawFx();
    if (fx.flash > 0) { ctx.globalAlpha = Math.min(0.55, fx.flash); ctx.fillStyle = fx.flashColor; ctx.fillRect(-w, -h, w * 3, h * 3); ctx.globalAlpha = 1; }
    ctx.restore();
    // HUD
    label(`LEVEL ${world.level}`, w * 0.18, h * 0.06, w * 0.055, '#FFFFFF', '#0F172A');
    label(`최고 ${Math.max(bestLevel, world.bestLevel)}`, w * 0.82, h * 0.06, w * 0.045, '#FFFFFF', '#0F172A');
    let px2 = w * 0.05;
    if (world.rapidTimer > 0) { const pw = w * 0.22; ctx.fillStyle = 'rgba(15,23,42,0.4)'; ctx.fillRect(px2, h * 0.09, pw, h * 0.03); ctx.fillStyle = '#F59E0B'; ctx.fillRect(px2, h * 0.09, pw * (world.rapidTimer / C.RAPID_SECONDS), h * 0.03); label('⚡ 연사', px2 + pw / 2, h * 0.105, w * 0.035, '#FFFFFF', '#0F172A'); px2 += pw + w * 0.02; }
    if (world.shield) { ctx.fillStyle = 'rgba(15,23,42,0.4)'; ctx.fillRect(px2, h * 0.09, w * 0.16, h * 0.03); label('🛡 방어막', px2 + w * 0.08, h * 0.105, w * 0.035, '#FFFFFF', '#0F172A'); }
    if (world.state === State.RUNNING || world.state === State.LEVEL_CLEAR || world.state === State.GAME_OVER) {
      const pr = Math.min(1, world.z / Math.max(1, world.length));
      ctx.fillStyle = 'rgba(15,23,42,0.35)'; ctx.fillRect(w * 0.3, h * 0.045, w * 0.4, h * 0.018);
      ctx.fillStyle = '#FACC15'; ctx.fillRect(w * 0.3, h * 0.045, w * 0.4 * pr, h * 0.018);
    }
    // overlays
    let pre = null, title = null, body = null, accent = null;
    const st = stageOf(world.level), season = seasonOf(world.level);
    const stageTag = `STAGE ${world.level}` + (season > 1 ? ` · 시즌 ${season}` : '') + ` · ${st.place}`;
    if (world.state === State.READY) {
      const pr = profileOf(world.level);
      const bits = [];
      if (pr.gates >= 1.2) bits.push('게이트 러시');
      if (pr.enemies >= 1.2) bits.push(`${st.mob} 파도`);
      if (pr.walls >= 2) bits.push('벽 구간');
      if (pr.speed > 1.05) bits.push('빠른 진행');
      bits.push(`중간 빌런 ${pr.mini}`);
      pre = stageTag; title = `${st.villain} 등장`;
      body = st.story + '\n\n오늘의 코스 · ' + bits.join(' · ');
      accent = '탭해서 시작';
    }
    else if (world.state === State.LEVEL_CLEAR) {
      const next = stageOf(world.level + 1);
      pre = `STAGE ${world.level} 클리어`; title = `${st.villain} 격파!`;
      body = `${st.clear}\n\n남은 동료 ${world.count} · 처치 ${world.kills}\n다음 상대 ${next.villain} · ${next.tag}`;
      accent = '탭해서 다음 스테이지';
    } else if (world.state === State.GAME_OVER) {
      pre = stageTag; title = 'GAME OVER';
      body = `${world.message}\n${st.fail}`;
      accent = '탭해서 다시 하기';
    }
    if (title) {
      ctx.fillStyle = 'rgba(15,23,42,0.72)'; ctx.fillRect(0, 0, w, h);
      let y = h * 0.3;
      if (pre) { label(pre, w / 2, y, w * 0.042, '#FDE68A', '#0F172A'); y += w * 0.09; }
      label(title, w / 2, y, w * 0.1, '#FFFFFF', '#0B5E56');
      y += w * 0.1;
      ctx.font = `600 ${w * 0.044}px "IBM Plex Sans", sans-serif`; ctx.fillStyle = '#E2E8F0'; ctx.textAlign = 'center';
      for (const line of body.split('\n')) { ctx.fillText(line, w / 2, y); y += w * 0.062; }
      label(accent, w / 2, y + w * 0.06, w * 0.06, '#FACC15', '#78350F');
    }
  }

  function frame(now) {
    const dt = lastTime ? (now - lastTime) / 1000 : 0; lastTime = now; runTime += dt;
    if (keyDir !== 0 && world.state === State.RUNNING) world.movePlayerBy(keyDir * C.STRAFE_GAIN * Math.min(dt, C.MAX_FRAME_DT));
    const before = world.state; world.update(dt);
    for (const ev of world.events) handleEvent(ev); world.events.length = 0;
    updateFx(dt);
    if (before === State.RUNNING && world.state !== State.RUNNING) {
      if (world.bestLevel > bestLevel) { bestLevel = world.bestLevel; try { localStorage.setItem('goblinhunters.bestLevel', String(bestLevel)); } catch (e) {} }
      if (navigator.vibrate) { try { navigator.vibrate(world.state === State.GAME_OVER ? 80 : 30); } catch (e) {} }
    }
    draw(); requestAnimationFrame(frame);
  }
  function tap() {
    if (world.state === State.READY || world.state === State.GAME_OVER) world.start();
    else if (world.state === State.LEVEL_CLEAR) world.nextLevel();
  }
  canvas.addEventListener('pointerdown', (ev) => { canvas.focus({ preventScroll: true }); canvas.setPointerCapture(ev.pointerId); lastPointerX = ev.clientX; ac(); tap(); });
  canvas.addEventListener('pointermove', (ev) => { if (lastPointerX === null) return; if (world.state === State.RUNNING) world.movePlayerBy((ev.clientX - lastPointerX) / (canvas._w * VIEW.LANE_HALF_PX)); lastPointerX = ev.clientX; });
  const release = () => { lastPointerX = null; };
  canvas.addEventListener('pointerup', release); canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowLeft') { keyDir = -1; ev.preventDefault(); } else if (ev.key === 'ArrowRight') { keyDir = 1; ev.preventDefault(); }
    else if (ev.key === ' ' || ev.key === 'Enter') { ac(); tap(); ev.preventDefault(); }
    else if (ev.key === 'm' || ev.key === 'M') toggleMute();
  });
  canvas.addEventListener('keyup', (ev) => { if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') keyDir = 0; });
  document.addEventListener('visibilitychange', () => { if (document.hidden) lastTime = 0; });
  window.addEventListener('resize', resize);

  function start(saved) { if (saved && typeof saved.bestLevel === 'number' && saved.bestLevel > bestLevel) bestLevel = saved.bestLevel; resize(); requestAnimationFrame(frame); }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ bestLevel }));
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>

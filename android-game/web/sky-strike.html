<title>Sky Strike</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root {
    --ground: #070D1A; --panel: #101A30; --line: #2A3560; --text: #F8FAFC; --muted: #94A6C8;
    --gold: #FACC15;
    --display: "Lilita One", "Arial Black", Impact, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--text); font-family: var(--body);
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  header { width: 100%; max-width: 420px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.35rem; letter-spacing: 0.02em; white-space: nowrap; }
  .tag { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .stage { width: 100%; max-width: 420px; flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; }
  canvas {
    display: block; max-width: 100%; max-height: 100%; aspect-ratio: 9 / 16; border-radius: 18px;
    border: 1px solid var(--line); background: #0B2545; touch-action: none; user-select: none; -webkit-user-select: none; outline: none;
  }
  canvas:focus-visible { box-shadow: 0 0 0 3px var(--gold); }
  .hints { width: 100%; max-width: 420px; display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 0.8rem; color: var(--muted); justify-content: space-between; }
  #mute { margin-left: 8px; font-size: 1rem; line-height: 1; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); cursor: pointer; vertical-align: middle; }
  kbd { font-family: var(--body); font-weight: 600; font-size: 0.75rem; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--text); }
</style>

<header>
  <h1>Sky Strike</h1>
  <span class="tag">스카이 스트라이크 <button id="mute" type="button" aria-label="소리 켜기/끄기" title="소리 (M)">🔊</button></span>
</header>
<div class="stage">
  <canvas id="game" tabindex="0" aria-label="스카이 스트라이크 게임 화면. 왼쪽 아래 조종 영역을 끌어 상하좌우로 비행하고 자동으로 사격합니다."></canvas>
</div>
<div class="hints">
  <span>왼쪽 아래 <b>조종 영역</b>을 끌거나 <kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> 로 상하좌우 비행 · 탭/스페이스로 시작 · <kbd>B</kbd> 폭탄 · <kbd>M</kbd> 소리</span>
  <span>자동 사격 · 아이템: ✦확산 ⚡연사 🛡방어막 💣폭탄 ✚수리</span>
</div>

<script>
(function () {
  // ---------- SkyWorld: pure simulation (mirrors skystrike/SkyWorld.kt) ----------
  const C = {
    PLAYER_Y: 0.86, PLAYER_Y_MIN: 0.50, PLAYER_Y_MAX: 0.94,
    PLAYER_LIMIT: 0.88, PLAYER_HALF_X: 0.055, PLAYER_HALF_Y: 0.045,
    ENEMY_HALF: 0.062, BOSS_HALF: 0.2, SHOT_HALF: 0.012, ITEM_HALF: 0.05,
    MAX_HP: 5, START_BOMBS: 2, MAX_BOMBS: 5, MAX_SPREAD: 5,
    RAM_DAMAGE: 1, SHOT_DAMAGE: 1, MERCY_SECONDS: 1.1, FLASH_SECONDS: 0.3,
    BASE_FIRE_RATE: 9, RAPID_MULT: 1.9, RAPID_SECONDS: 7, SHOT_SPEED: 1.9, ENEMY_SHOT_SPEED: 0.72,
    WAVE_GAP: 2.1, ITEM_CHANCE: 0.13, ITEM_FALL_SPEED: 0.26, ITEM_SCORE: 30,
    COMBO_WINDOW: 2.3, COMBO_STEP: 3, MAX_COMBO_MULT: 8,
    RUSH_FORMATIONS: 3, RUSH_SPEED: 1.35, RUSH_STACK: 0.46,
    BOSS_PHASE_2: 0.62, BOSS_PHASE_3: 0.30, BOSS_RAGE_SECONDS: 0.9,
    BOSS_PHASE_SWEEP: [1, 1.45, 1.9], BOSS_PHASE_REACH: [1, 1.08, 1.15], BOSS_PHASE_GAP: [1, 0.74, 0.56],
    BOSS_AIMED_SPEED: 0.95, BOSS_SPIRAL_ARMS: 5, BOSS_SPIN_STEP: 0.7,
    CLEAR_BONUS: 250, BOSS_SCORE: 500,
    BOSS_KINDS: 4, BOSS_BASE_HP: 70, BOSS_STATION_Y: 0.2, BOSS_ENTRY_SPEED: 0.22,
    BOSS_SWEEP_RATE: 0.9, BOSS_SWEEP_X: 0.5, BOSS_SALVO_GAP: 1.15, BOSS_FAN: 1.5, BOMB_BOSS_RATIO: 0.16,
    BOSS_DEATH_SECONDS: 2.6, BOSS_BREAKS: 11, BOSS_BREAK_GAP: 0.16, BOSS_AFTERGLOW: 0.8,
    BOSS_SINK: 0.085, BOSS_DRIFT: 0.075, BOSS_ROLL: 0.34,
    MAX_FRAME_DT: 0.05, TAU: 6.2831855,
    GUST_RATE: 0.55, GUST_STRENGTH: 0.30,
    FLARE_GAP: 1.5, FLARE_RISE: 0.2, FLARE_LIFE: 4.6, FLARE_HALF: 0.055,
  };
  const KIND = ['DRONE', 'WEAVER', 'GUNNER', 'DIVER'];
  const PROFILES = [
    // The coast road: clean shapes, plenty of warning, nothing but the aircraft to read.
    { waves: 22, mix: ['DRONE', 'DRONE', 'WEAVER'], fireRate: 0.8, speed: 0.30, bossHp: 1.0,
      formations: ['LINE', 'VEE'], hazard: 'NONE', entryY: -0.12 },
    // Thunderhead pass: flown inside the weather, which pushes you off your line.
    { waves: 26, mix: ['WEAVER', 'DRONE', 'DIVER'], fireRate: 1.0, speed: 0.34, bossHp: 1.15,
      formations: ['TRAIL', 'LINE'], hazard: 'GUSTS', entryY: -0.12 },
    // The ember fields: the ground burns, and the fire reaches the altitude you are at.
    { waves: 30, mix: ['GUNNER', 'WEAVER', 'DRONE'], fireRate: 1.25, speed: 0.32, bossHp: 1.3,
      formations: ['ARC', 'SPLIT'], hazard: 'FLAK', entryY: -0.12 },
    // The long night: they are on you before you see them.
    { waves: 34, mix: ['DIVER', 'GUNNER', 'WEAVER', 'DRONE'], fireRate: 1.4, speed: 0.40, bossHp: 1.5,
      formations: ['SPLIT', 'TRAIL', 'VEE'], hazard: 'DARK', entryY: -0.03 },
  ];
  const STAGES = [
    { place: '해안 항로', raider: '강철 갈매기', tag: '새벽부터 저 위를 돌고 있다',
      story: '새벽 초계. 아래 수송선단이 이번 주에만\n두 번 엄호를 요청했고, 두 번 다 아무도 안 왔다.\n오늘은 당신이 왔다.',
      clear: '선단이 항구에 닿았다. 누군가 손을 흔들었다.' },
    { place: '뇌운 고개', raider: '폭풍우를 부르는 자', tag: '제 날씨를 몰고 다닌다',
      story: '밤사이 전선이 고개를 삼키고 이동했다.\n관제는 우회하라지만, 관제는 여기 없다.',
      clear: '고개가 열렸다. 나머지는 날씨가 가져가라지.' },
    { place: '잿불 평원', raider: '잿불의 여왕', tag: '가져가지 못할 것은 태운다',
      story: '발밑은 이미 전부 타고 있다.\n불을 지른 게 아직 상공에 있고,\n아직 안 끝났다.',
      clear: '불길은 이제 알아서 사그라든다.' },
    { place: '긴 밤', raider: '긴 그림자', tag: '본 사람 중에 착륙한 사람이 없다',
      story: '수평선도, 지면도, 두 번째 기회도 없다.\n계기판과, 당신 엔진 소리를 기다리는\n무언가뿐이다.',
      clear: '결국 새벽이 왔다. 당신은 아직 날고 있다.' },
  ];
  const ITEM_LABEL = { SPREAD: '확산', RAPID: '연사', SHIELD: '방어막', BOMB: '폭탄', REPAIR: '수리' };
  const profileOf = l => PROFILES[(l - 1) % PROFILES.length];
  const stageOf = l => STAGES[(l - 1) % STAGES.length];
  const State = { READY: 'READY', RUNNING: 'RUNNING', LEVEL_CLEAR: 'LEVEL_CLEAR', GAME_OVER: 'GAME_OVER' };

  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const scoreFor = k => ({ DRONE: 10, WEAVER: 15, GUNNER: 25, DIVER: 20 }[k]);

  class SkyWorld {
    constructor(seed) {
      this.seed = seed || 1; this.level = 1; this.bestLevel = 0; this.state = State.READY;
      this.score = 0; this.kills = 0; this.playerX = 0; this.playerY = C.PLAYER_Y;
      this.hp = C.MAX_HP; this.bombs = C.START_BOMBS;
      this.shield = false; this.rapidTimer = 0; this.spread = 1; this.mercy = 0; this.flash = 0;
      this.combo = 0; this.comboTimer = 0; this.bestCombo = 0;
      this.enemies = []; this.shots = []; this.items = []; this.flares = []; this.boss = null;
      this.events = []; this.gust = 0;
    }
    startLevel(level) {
      this.level = level;
      this.r = rng(this.seed * 7919 + level * 104729);
      this.sr = rng(this.seed * 31 + level * 17);
      const p = profileOf(level);
      this.enemies = []; this.shots = []; this.items = []; this.flares = []; this.events = []; this.boss = null;
      this.playerX = 0; this.playerY = C.PLAYER_Y;
      this.hp = C.MAX_HP; this.bombs = C.START_BOMBS; this.shield = false;
      this.rapidTimer = 0; this.spread = 1; this.mercy = 0; this.flash = 0;
      this.combo = 0; this.comboTimer = 0; this.bestCombo = 0;
      this.fireAcc = 0; this.elapsed = 0; this.waveIndex = 0; this.totalWaves = p.waves; this.nextWaveAt = 0.8;
      // one scripted surge halfway through, so the stage is not a metronome all the way down
      this.rushAt = Math.floor(p.waves / 2); this.rushDone = false;
      this.gust = 0; this.nextFlareAt = C.FLARE_GAP;
      this.state = State.RUNNING;
    }
    start() { this.startLevel(1); }
    nextLevel() { this.startLevel(this.level + 1); }
    movePlayerBy(dx, dy = 0) {
      this.playerX = Math.max(-C.PLAYER_LIMIT, Math.min(C.PLAYER_LIMIT, this.playerX + dx));
      this.playerY = Math.max(C.PLAYER_Y_MIN, Math.min(C.PLAYER_Y_MAX, this.playerY + dy));
    }

    useBomb() {
      if (this.state !== State.RUNNING || this.bombs <= 0) return false;
      this.bombs--;
      this.events.push({ t: 'BOMB', x: this.playerX, y: this.playerY });
      for (const e of this.enemies) {
        if (!e.alive) continue;
        e.alive = false;
        this.awardKill(e.kind, e.x, e.y);
      }
      for (const s of this.shots) if (!s.fromPlayer) s.alive = false;
      if (this.boss && this.boss.alive) this.damageBoss(this.boss, Math.max(1, Math.floor(this.boss.max * C.BOMB_BOSS_RATIO)));
      return true;
    }

    update(dtSeconds) {
      if (this.state !== State.RUNNING) return;
      const dt = Math.min(C.MAX_FRAME_DT, Math.max(0, dtSeconds));
      this.elapsed += dt;
      this.flash = Math.max(0, this.flash - dt);
      this.mercy = Math.max(0, this.mercy - dt);
      this.rapidTimer = Math.max(0, this.rapidTimer - dt);
      this.updateHazard(dt);
      this.updateCombo(dt);
      this.spawnWaves();
      this.updateEnemies(dt);
      this.updateBoss(dt);
      this.updateFire(dt);
      this.updateShots(dt);
      this.updateItems(dt);
      this.checkEnd();
    }

    /** The place itself, acting on you: the pass blows you sideways, the fields burn upward. */
    updateHazard(dt) {
      const p = profileOf(this.level);
      this.gust = p.hazard === 'GUSTS' ? Math.sin(this.elapsed * C.GUST_RATE) * C.GUST_STRENGTH : 0;
      if (this.gust !== 0) this.movePlayerBy(this.gust * dt);

      if (p.hazard === 'FLAK') {
        this.nextFlareAt -= dt;
        if (this.nextFlareAt <= 0) {
          this.nextFlareAt = C.FLARE_GAP * (0.7 + this.r() * 0.7);
          this.flares.push({ x: -0.8 + this.r() * 1.6, y: 1.05, life: C.FLARE_LIFE,
            max: C.FLARE_LIFE, phase: this.r() * C.TAU });
        }
      }
      for (let i = this.flares.length - 1; i >= 0; i--) {
        const f = this.flares[i];
        f.life -= dt; f.y -= C.FLARE_RISE * dt;
        if (f.life <= 0 || f.y < -0.2) { this.flares.splice(i, 1); continue; }
        // only the body of the column bites, not its fading tail
        if (f.life > C.FLARE_LIFE * 0.25 && this.hitsPlayer(f.x, f.y, C.FLARE_HALF)) {
          this.hurt(C.RAM_DAMAGE, f.x, f.y);
          if (this.state !== State.RUNNING) return;
        }
      }
    }

    /** What a kill is worth right now: one more step of the chain for every COMBO_STEP kills. */
    comboMultiplier() { return Math.min(C.MAX_COMBO_MULT, 1 + Math.floor(this.combo / C.COMBO_STEP)); }

    /** Banks a kill, extends the chain, and pays out at the chain's rate. */
    awardKill(kind, x, y) {
      this.kills++;
      this.combo++;
      this.comboTimer = C.COMBO_WINDOW;
      this.bestCombo = Math.max(this.bestCombo, this.combo);
      const mult = this.comboMultiplier();
      this.score += scoreFor(kind) * mult;
      this.events.push({ t: 'KILL_ENEMY', x, y, value: mult });
      // the chain announces itself only when it actually steps up
      if (this.combo % C.COMBO_STEP === 0 && mult <= C.MAX_COMBO_MULT) {
        this.events.push({ t: 'COMBO_UP', x, y, value: mult });
      }
    }

    updateCombo(dt) {
      if (this.combo === 0) return;
      this.comboTimer = Math.max(0, this.comboTimer - dt);
      if (this.comboTimer > 0) return;
      const lost = this.combo;
      this.combo = 0;
      if (lost >= C.COMBO_STEP) {
        this.events.push({ t: 'COMBO_LOST', x: this.playerX, y: this.playerY, value: lost });
      }
    }

    spawnWaves() {
      if (this.waveIndex >= this.totalWaves || this.elapsed < this.nextWaveAt) return;
      const p = profileOf(this.level);
      // Halfway down the stage everything arrives at once: three formations of different kinds,
      // a third faster, stacked back to back. It is the one place a chain can really run, and
      // the one place the stage stops feeling like a metronome.
      if (!this.rushDone && this.waveIndex >= this.rushAt) {
        this.rushDone = true;
        for (let i = 0; i < C.RUSH_FORMATIONS; i++) {
          this.spawnFormation(p,
            p.mix[Math.floor(this.r() * p.mix.length) % p.mix.length],
            p.formations[Math.floor(this.r() * p.formations.length) % p.formations.length],
            3 + Math.floor(this.r() * 3),
            -0.5 + this.r() * 1.0,
            p.speed * C.RUSH_SPEED,
            i * C.RUSH_STACK);
        }
        this.waveIndex++;
        this.nextWaveAt = this.elapsed + C.WAVE_GAP * 1.6;
        this.events.push({ t: 'RUSH' });
        return;
      }
      this.spawnFormation(p,
        p.mix[Math.floor(this.r() * p.mix.length) % p.mix.length],
        p.formations[Math.floor(this.r() * p.formations.length) % p.formations.length],
        3 + Math.floor(this.r() * 4),
        -0.62 + this.r() * 1.24,
        p.speed * (0.85 + this.r() * 0.3),
        0);
      this.waveIndex++;
      this.nextWaveAt = this.elapsed + C.WAVE_GAP * (0.8 + this.r() * 0.5);
    }

    /** Lays one formation of `n` aircraft out along the top of the screen. */
    spawnFormation(p, kind, formation, n, baseX, speed, extraLead) {
      const hpEach = 1 + Math.floor((this.level - 1) / 3) + (kind === 'GUNNER' ? 1 : 0);
      for (let i = 0; i < n; i++) {
        const t = n === 1 ? 0.5 : i / (n - 1);
        let spreadX, lead;
        if (formation === 'LINE') { spreadX = (t - 0.5) * 0.72; lead = 0; }
        else if (formation === 'VEE') { spreadX = (t - 0.5) * 0.8; lead = Math.abs(t - 0.5) * 0.34; }
        else if (formation === 'ARC') { spreadX = (t - 0.5) * 0.9; lead = (0.5 - Math.abs(t - 0.5)) * 0.42; }
        else if (formation === 'TRAIL') { spreadX = 0; lead = t * 0.5; }
        else { const side = t < 0.5 ? -1 : 1; spreadX = side * (0.26 + Math.abs(t - 0.5) * 0.7); lead = Math.abs(t - 0.5) * 0.3; }
        const homeX = Math.max(-0.86, Math.min(0.86, baseX + spreadX));
        this.enemies.push({ x: homeX, y: p.entryY - lead - extraLead, kind, hp: hpEach, max: hpEach,
          homeX, phase: this.r() * C.TAU, speed, alive: true, cooldown: 0, bank: 0, lastX: homeX });
      }
    }

    updateEnemies(dt) {
      const p = profileOf(this.level);
      for (let i = this.enemies.length - 1; i >= 0; i--) {
        const e = this.enemies[i];
        if (!e.alive) { this.enemies.splice(i, 1); continue; }
        e.lastX = e.x;
        if (e.kind === 'DRONE') e.y += e.speed * dt;
        else if (e.kind === 'WEAVER') { e.y += e.speed * 0.92 * dt; e.x = e.homeX + Math.sin(this.elapsed * 2.4 + e.phase) * 0.22; }
        else if (e.kind === 'GUNNER') { e.y += e.speed * 0.62 * dt; e.x = e.homeX + Math.sin(this.elapsed * 1.1 + e.phase) * 0.08; }
        else e.y += e.speed * (1 + (e.y + 0.2) * 1.6) * dt;
        e.bank = Math.max(-1, Math.min(1, (e.x - e.lastX) / Math.max(1e-4, dt) * 0.9));
        if (e.kind === 'GUNNER' || e.kind === 'WEAVER') {
          e.cooldown -= dt;
          if (e.cooldown <= 0 && e.y > 0.04 && e.y < this.playerY - 0.08) {
            e.cooldown = Math.max(0.55, 1.5 - this.level * 0.04) / p.fireRate * (0.7 + this.sr() * 0.7);
            const vx = e.kind === 'GUNNER' ? Math.max(-0.5, Math.min(0.5, (this.playerX - e.x) * 0.55)) : 0;
            this.shots.push({ x: e.x, y: e.y + 0.04, vx, vy: C.ENEMY_SHOT_SPEED, fromPlayer: false, alive: true, damage: 1 });
            this.events.push({ t: 'ENEMY_SHOT', x: e.x, y: e.y });
          }
        }
        if (e.y > 1.12) { this.enemies.splice(i, 1); continue; }
        if (this.hitsPlayer(e.x, e.y, C.ENEMY_HALF)) {
          this.enemies.splice(i, 1);
          this.hurt(C.RAM_DAMAGE, e.x, e.y);
          if (this.state !== State.RUNNING) return;
        }
      }
    }

    spawnBoss() {
      const p = profileOf(this.level);
      const hp = Math.max(30, Math.floor(C.BOSS_BASE_HP * p.bossHp * (1 + (this.level - 1) * 0.45)));
      this.boss = { kind: (this.level - 1) % C.BOSS_KINDS, x: 0, y: -0.25, hp, max: hp, alive: true,
        engaged: false, bank: 0, salvo: 0, sweep: 0,
        dying: 0, roll: 0, driftX: 0, nextBreakAt: 0, breaks: 0, finished: false,
        phase: 0, rage: 0, spin: 0 };
      this.events.push({ t: 'BOSS_IN', x: 0, y: 0 });
    }

    updateBoss(dt) {
      const b = this.boss;
      if (!b) return;
      if (!b.alive) { this.updateWreck(b, dt); return; }
      const lastX = b.x;
      if (!b.engaged) {
        b.y = Math.min(C.BOSS_STATION_Y, b.y + C.BOSS_ENTRY_SPEED * dt);
        if (b.y >= C.BOSS_STATION_Y - 1e-4) b.engaged = true;
      } else {
        b.rage = Math.max(0, b.rage - dt);
        // each phase sweeps faster and wider, and leans on the salvo harder
        b.sweep += dt * C.BOSS_PHASE_SWEEP[b.phase];
        b.x = Math.sin(b.sweep * C.BOSS_SWEEP_RATE) * C.BOSS_SWEEP_X * C.BOSS_PHASE_REACH[b.phase];
        b.salvo -= dt;
        if (b.salvo <= 0) {
          b.salvo = Math.max(0.32, (C.BOSS_SALVO_GAP - this.level * 0.03) * C.BOSS_PHASE_GAP[b.phase]);
          this.fireBossSalvo(b);
        }
      }
      b.bank = Math.max(-1, Math.min(1, (b.x - lastX) / Math.max(1e-4, dt) * 1.4));
      if (this.hitsPlayer(b.x, b.y, C.BOSS_HALF)) this.hurt(C.RAM_DAMAGE, b.x, b.y);
    }

    fireBossSalvo(b) {
      // Phase 2 turns the fan into a slow spiral, so the gap you slip through keeps moving.
      if (b.phase >= 2) {
        b.spin += C.BOSS_SPIN_STEP;
        for (let i = 0; i < C.BOSS_SPIRAL_ARMS; i++) {
          const ang = b.spin + i * (C.TAU / C.BOSS_SPIRAL_ARMS);
          this.shots.push({ x: b.x, y: b.y + 0.08, vx: Math.sin(ang) * C.ENEMY_SHOT_SPEED,
            vy: Math.abs(Math.cos(ang)) * C.ENEMY_SHOT_SPEED, fromPlayer: false, alive: true, damage: 1 });
        }
        this.events.push({ t: 'ENEMY_SHOT', x: b.x, y: b.y });
        return;
      }
      // A fan the player has to slip between, widening with the stage.
      const arms = 3 + Math.min(4, this.level - 1);
      for (let i = 0; i < arms; i++) {
        const t = arms === 1 ? 0.5 : i / (arms - 1);
        const ang = (t - 0.5) * C.BOSS_FAN;
        this.shots.push({ x: b.x, y: b.y + 0.08, vx: Math.sin(ang) * C.ENEMY_SHOT_SPEED,
          vy: Math.cos(ang) * C.ENEMY_SHOT_SPEED, fromPlayer: false, alive: true, damage: 1 });
      }
      // From phase 1 it also picks you out of the fan and puts one straight at you.
      if (b.phase >= 1) {
        const dx = this.playerX - b.x, dy = Math.max(0.15, this.playerY - b.y);
        const len = Math.hypot(dx, dy);
        this.shots.push({ x: b.x, y: b.y + 0.08, vx: dx / len * C.BOSS_AIMED_SPEED,
          vy: dy / len * C.BOSS_AIMED_SPEED, fromPlayer: false, alive: true, damage: 1 });
      }
      this.events.push({ t: 'ENEMY_SHOT', x: b.x, y: b.y });
    }

    damageBoss(b, amount) {
      b.hp = Math.max(0, b.hp - amount);
      if (b.hp > 0) {
        // it changes its mind twice on the way down
        const left = b.hp / Math.max(1, b.max);
        const want = left <= C.BOSS_PHASE_3 ? 2 : left <= C.BOSS_PHASE_2 ? 1 : 0;
        if (want > b.phase) {
          b.phase = want;
          b.rage = C.BOSS_RAGE_SECONDS;
          b.salvo = Math.max(b.salvo, C.BOSS_RAGE_SECONDS * 0.7);   // one beat to read the change
          this.events.push({ t: 'BOSS_PHASE', x: b.x, y: b.y, value: b.phase });
        }
        return;
      }
      b.alive = false; this.kills++; this.score += C.BOSS_SCORE * this.level;
      // it stops flying here: nose over, roll, and slide out of its own wake
      b.dying = C.BOSS_DEATH_SECONDS;
      b.driftX = b.x >= 0 ? -C.BOSS_DRIFT : C.BOSS_DRIFT;
      b.nextBreakAt = C.BOSS_DEATH_SECONDS - C.BOSS_BREAK_GAP * 0.35;
      b.breaks = 0;
      b.finished = false;
      // the sky clears with it: nothing already in the air may still kill you now
      for (const s of this.shots) if (!s.fromPlayer) s.alive = false;
      this.events.push({ t: 'BOSS_DOWN', x: b.x, y: b.y });
    }

    /**
     * The wreck. It falls, rolls, and lets go of a run of explosions that walk along the hull
     * rather than piling up in one place, and only then does the stage end.
     */
    updateWreck(b, dt) {
      if (b.dying <= 0) return;
      b.dying = Math.max(0, b.dying - dt);
      b.y += C.BOSS_SINK * dt;
      b.x += b.driftX * dt;
      b.roll += C.BOSS_ROLL * dt;
      while (b.breaks < C.BOSS_BREAKS && b.dying <= b.nextBreakAt) {
        b.breaks++;
        b.nextBreakAt -= C.BOSS_BREAK_GAP;
        const ox = (this.r() - 0.5) * C.BOSS_HALF * 1.6;
        const oy = (this.r() - 0.5) * C.BOSS_HALF * 0.9;
        this.events.push({ t: 'BOSS_BREAK', x: b.x + ox, y: b.y + oy,
          value: Math.floor((b.breaks * 100) / C.BOSS_BREAKS) });
      }
      // The last blast takes the hull with it, and then the sky gets a beat to itself before
      // the clear panel comes up -- otherwise the finale is a frame long and you miss it.
      if (b.dying <= C.BOSS_AFTERGLOW && !b.finished) {
        b.finished = true;
        this.events.push({ t: 'KILL_BOSS', x: b.x, y: b.y });
      }
    }

    updateFire(dt) {
      const rate = C.BASE_FIRE_RATE * (this.rapidTimer > 0 ? C.RAPID_MULT : 1);
      this.fireAcc += rate * dt;
      while (this.fireAcc >= 1) {
        this.fireAcc -= 1;
        for (let i = 0; i < this.spread; i++) {
          const off = this.spread === 1 ? 0 : (i / (this.spread - 1) - 0.5);
          this.shots.push({ x: this.playerX + off * 0.09, y: this.playerY - 0.05, vx: off * 0.35,
            vy: -C.SHOT_SPEED, fromPlayer: true, alive: true, damage: 1 });
        }
        this.events.push({ t: 'SHOT', x: this.playerX, y: this.playerY - 0.05 });
      }
    }

    hitsPlayer(x, y, half) {
      return this.mercy <= 0 && Math.abs(y - this.playerY) < half + C.PLAYER_HALF_Y && Math.abs(x - this.playerX) < half + C.PLAYER_HALF_X;
    }

    hurt(amount, x, y) {
      if (this.mercy > 0) return;
      // while the raider is coming apart the stage is over; nothing left flying may take it back
      const b = this.boss;
      if (b && !b.alive && b.dying > 0) return;
      if (this.shield) {
        this.shield = false; this.mercy = C.MERCY_SECONDS;
        this.events.push({ t: 'SHIELD_USED', x, y });
        return;
      }
      // the chain is the price of being hit, and it hurts more than the hit point does
      if (this.combo >= C.COMBO_STEP) this.events.push({ t: 'COMBO_LOST', x, y, value: this.combo });
      this.combo = 0; this.comboTimer = 0;
      this.hp -= amount; this.flash = C.FLASH_SECONDS; this.mercy = C.MERCY_SECONDS;
      this.spread = Math.max(1, this.spread - 1);
      this.events.push({ t: 'HIT_PLAYER', x, y });
      if (this.hp <= 0) {
        this.hp = 0; this.state = State.GAME_OVER;
        this.bestLevel = Math.max(this.bestLevel, this.level - 1);
        this.events.push({ t: 'OVER' });
      }
    }

    updateShots(dt) {
      for (let i = this.shots.length - 1; i >= 0; i--) {
        const s = this.shots[i];
        if (!s.alive) { this.shots.splice(i, 1); continue; }
        s.x += s.vx * dt; s.y += s.vy * dt;
        if (s.y < -0.15 || s.y > 1.15 || Math.abs(s.x) > 1.2) { this.shots.splice(i, 1); continue; }
        if (s.fromPlayer) {
          let spent = false;
          for (const e of this.enemies) {
            if (!e.alive) continue;
            if (Math.abs(e.x - s.x) < C.ENEMY_HALF && Math.abs(e.y - s.y) < C.ENEMY_HALF) {
              e.hp -= s.damage; spent = true;
              if (e.hp <= 0) {
                e.alive = false;
                this.awardKill(e.kind, e.x, e.y);
                this.maybeDrop(e.x, e.y);
              } else this.events.push({ t: 'HIT_ENEMY', x: s.x, y: s.y });
              break;
            }
          }
          const b = this.boss;
          if (!spent && b && b.alive && Math.abs(b.x - s.x) < C.BOSS_HALF && Math.abs(b.y - s.y) < C.BOSS_HALF) {
            spent = true; this.damageBoss(b, s.damage);
            if (b.alive) this.events.push({ t: 'HIT_BOSS', x: s.x, y: s.y });
          }
          if (spent) this.shots.splice(i, 1);
        } else if (this.hitsPlayer(s.x, s.y, C.SHOT_HALF)) {
          this.shots.splice(i, 1);
          this.hurt(C.SHOT_DAMAGE, s.x, s.y);
          if (this.state !== State.RUNNING) return;
        }
      }
    }

    maybeDrop(x, y) {
      if (this.r() >= C.ITEM_CHANCE) return;
      const roll = this.r();
      const kind = roll < 0.26 ? 'SPREAD' : roll < 0.5 ? 'RAPID' : roll < 0.72 ? 'SHIELD' : roll < 0.88 ? 'REPAIR' : 'BOMB';
      this.items.push({ x, y, kind, alive: true });
    }

    updateItems(dt) {
      for (let i = this.items.length - 1; i >= 0; i--) {
        const it = this.items[i];
        it.y += C.ITEM_FALL_SPEED * dt;
        if (it.y > 1.1) { this.items.splice(i, 1); continue; }
        if (Math.abs(it.y - this.playerY) < C.ITEM_HALF + C.PLAYER_HALF_Y && Math.abs(it.x - this.playerX) < C.ITEM_HALF + C.PLAYER_HALF_X) {
          this.items.splice(i, 1);
          if (it.kind === 'SPREAD') this.spread = Math.min(C.MAX_SPREAD, this.spread + 1);
          else if (it.kind === 'RAPID') this.rapidTimer = C.RAPID_SECONDS;
          else if (it.kind === 'SHIELD') this.shield = true;
          else if (it.kind === 'BOMB') this.bombs = Math.min(C.MAX_BOMBS, this.bombs + 1);
          else this.hp = Math.min(C.MAX_HP, this.hp + 1);
          this.score += C.ITEM_SCORE;
          this.events.push({ t: 'PICKUP', x: it.x, y: it.y, kind: it.kind });
        }
      }
    }

    checkEnd() {
      const b = this.boss;
      if (!b) {
        if (this.waveIndex >= this.totalWaves && !this.enemies.some(e => e.alive)) this.spawnBoss();
        return;
      }
      if (!b.alive) {
        if (b.dying > 0) return;
        this.state = State.LEVEL_CLEAR;
        this.bestLevel = Math.max(this.bestLevel, this.level);
        this.score += C.CLEAR_BONUS * this.level;
        this.events.push({ t: 'CLEAR' });
      }
    }
  }

  // ---------- Audio: synthesized with Web Audio, no files ----------
  const audio = { ctx: null, muted: false, last: {}, noise: null };
  try { audio.muted = localStorage.getItem('skystrike.muted') === '1'; } catch (e) {}
  const muteBtn = document.getElementById('mute');
  function renderMute() { muteBtn.textContent = audio.muted ? '🔇' : '🔊'; muteBtn.setAttribute('aria-pressed', audio.muted ? 'true' : 'false'); }
  function toggleMute() { audio.muted = !audio.muted; try { localStorage.setItem('skystrike.muted', audio.muted ? '1' : '0'); } catch (e) {} renderMute(); }
  muteBtn.addEventListener('click', toggleMute); renderMute();
  function ac() {
    if (!audio.ctx) { try { audio.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (audio.ctx.state === 'suspended') audio.ctx.resume();
    return audio.ctx;
  }
  function noiseBuffer(c) {
    if (!audio.noise) { audio.noise = c.createBuffer(1, Math.floor(c.sampleRate * 0.2), c.sampleRate); const d = audio.noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    return audio.noise;
  }
  function tone(c, at, freq, dur, vol, type) {
    const o = c.createOscillator(); o.type = type; o.frequency.value = freq;
    const g = c.createGain(); g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
    o.connect(g).connect(c.destination); o.start(at); o.stop(at + dur + 0.02);
  }
  function play(kind, pitch) {
    if (audio.muted) return; const c = ac(); if (!c) return; const now = c.currentTime;
    const P = Math.max(0.5, Math.min(2, pitch || 1));
    const gate = (key, min) => { if (now - (audio.last[key] || 0) < min) return false; audio.last[key] = now; return true; };
    switch (kind) {
      case 'shot': {
        if (!gate('shot', 0.045)) return;
        const o = c.createOscillator(); o.type = 'square';
        o.frequency.setValueAtTime(900 + Math.random() * 200, now);
        o.frequency.exponentialRampToValueAtTime(260, now + 0.06);
        const g = c.createGain(); g.gain.setValueAtTime(0.13, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        o.connect(g).connect(c.destination); o.start(now); o.stop(now + 0.08);
        break;
      }
      case 'hit': if (gate('hit', 0.035)) tone(c, now, 1400 + Math.random() * 500, 0.03, 0.12, 'square'); break;
      case 'kill': {
        if (!gate('kill', 0.04)) return;
        const src = c.createBufferSource(); src.buffer = noiseBuffer(c);
        const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(1400 * P, now);
        f.frequency.exponentialRampToValueAtTime(300 * P, now + 0.2);
        const g = c.createGain(); g.gain.setValueAtTime(0.3, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        src.connect(f).connect(g).connect(c.destination); src.start(now); src.stop(now + 0.24);
        break;
      }
      case 'hurt': if (gate('hurt', 0.12)) { tone(c, now, 180, 0.25, 0.3, 'sawtooth'); tone(c, now, 90, 0.3, 0.25, 'square'); } break;
      case 'pickup': tone(c, now, 659.25 * P, 0.08, 0.22, 'triangle'); tone(c, now + 0.08, 987.77 * P, 0.18, 0.22, 'triangle'); break;
      case 'boom': {
        const src = c.createBufferSource(); src.buffer = noiseBuffer(c); src.loop = true;
        const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(600, now); f.frequency.exponentialRampToValueAtTime(60, now + 0.6);
        const g = c.createGain(); g.gain.setValueAtTime(0.65, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
        src.connect(f).connect(g).connect(c.destination); src.start(now); src.stop(now + 0.75);
        break;
      }
      case 'roar': {
        const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(70 * P, now); o.frequency.exponentialRampToValueAtTime(48 * P, now + 0.9);
        const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
        const g = c.createGain(); g.gain.setValueAtTime(0.001, now); g.gain.exponentialRampToValueAtTime(0.45, now + 0.08); g.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
        o.connect(f).connect(g).connect(c.destination); o.start(now); o.stop(now + 1.05);
        break;
      }
      case 'clear': [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(c, now + i * 0.13, f, i < 3 ? 0.15 : 0.5, 0.22, 'triangle')); break;
      case 'over': {
        const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(400, now); o.frequency.exponentialRampToValueAtTime(80, now + 0.8);
        const g = c.createGain(); g.gain.setValueAtTime(0.22, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
        o.connect(g).connect(c.destination); o.start(now); o.stop(now + 0.95);
        break;
      }
    }
  }

  // ---------- Effects ----------
  const fx = { particles: [], texts: [], muzzle: 0, shake: 0, flash: 0, flashColor: '#FDE68A', bomb: 0,
               comboPop: 0, banner: '', bannerTimer: 0 };
  function sparks(x, y, n, color, spread, size) {
    size = size || 0.006;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * C.TAU, v = spread * (0.3 + Math.random());
      fx.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 0.3 + Math.random() * 0.35, max: 0.65, color, size: size + Math.random() * size, drag: 2.4 });
    }
  }
  /** Chunks of hull: bigger than a spark, slower, and they keep going instead of stopping. */
  function debris(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * C.TAU, v = 0.18 + Math.random() * 0.3;
      fx.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.05,
        life: 0.8 + Math.random() * 0.7, max: 1.5, color: '#94A3B8',
        size: 0.014 + Math.random() * 0.014, drag: 0.5 });
    }
  }

  function floatText(text, x, y, color) { fx.texts.push({ text, x, y, life: 0.85, max: 0.85, color }); }
  function screenFlash(color, strength) { fx.flash = strength; fx.flashColor = color; }

  function handleEvent(ev) {
    switch (ev.t) {
      case 'SHOT': fx.muzzle = 0.055; play('shot'); break;
      case 'ENEMY_SHOT': play('hit'); break;
      case 'HIT_ENEMY': sparks(ev.x, ev.y, 3, '#FDE68A', 0.22); play('hit'); break;
      case 'KILL_ENEMY': {
        // a kill deeper into a chain throws more and rings higher
        const m = Math.max(1, Math.min(C.MAX_COMBO_MULT, ev.value || 1));
        sparks(ev.x, ev.y, 14 + m * 3, '#FDE68A', 0.5 + m * 0.04, 0.008);
        sparks(ev.x, ev.y, 8, '#94A3B8', 0.3, 0.012);
        fx.shake = Math.max(fx.shake, 0.08); play('kill', 1 + (m - 1) * 0.085); break;
      }
      case 'COMBO_UP':
        fx.comboPop = 1;
        floatText('x' + ev.value, ev.x, ev.y, '#FACC15');
        play('pickup', 1 + ev.value * 0.06); break;
      case 'COMBO_LOST':
        fx.comboPop = 0;
        floatText('연쇄 끊김', ev.x, ev.y - 0.06, '#94A3B8'); break;
      case 'RUSH':
        fx.banner = '편대 돌입!'; fx.bannerTimer = 1.5;
        fx.shake = Math.max(fx.shake, 0.25); play('roar', 1.35); break;
      case 'BOSS_PHASE':
        fx.banner = '분노'; fx.bannerTimer = 1.2;
        sparks(ev.x, ev.y, 26, '#FCA5A5', 0.7, 0.012);
        fx.shake = Math.max(fx.shake, 0.45); screenFlash('#F87171', 0.3);
        play('roar', 1 + ev.value * 0.14); break;
      case 'HIT_BOSS': sparks(ev.x, ev.y, 3, '#FDE68A', 0.25); play('hit'); break;
      case 'BOSS_DOWN':
        // the moment it stops being an enemy: everything holds still for a beat
        timeScale = HITSTOP_SCALE;
        sparks(ev.x, ev.y, 34, '#FDE68A', 0.75, 0.013);
        sparks(ev.x, ev.y, 14, '#94A3B8', 0.35, 0.022);
        fx.shake = 0.55; screenFlash('#FFFFFF', 0.38);
        play('boom'); break;
      case 'BOSS_BREAK': {
        // each blast walks a little further along the hull and hits a little harder
        const t = (ev.value || 0) / 100;
        sparks(ev.x, ev.y, 10 + Math.floor(t * 14), '#FDE68A', 0.45 + t * 0.35, 0.011);
        sparks(ev.x, ev.y, 6 + Math.floor(t * 8), '#94A3B8', 0.28 + t * 0.2, 0.02);
        debris(ev.x, ev.y, 3 + Math.floor(t * 4));
        fx.shake = Math.max(fx.shake, 0.16 + t * 0.16);
        screenFlash('#FFB454', 0.1 + t * 0.14);
        play('kill'); break;
      }
      case 'KILL_BOSS':
        sparks(ev.x, ev.y, 70, '#FDE68A', 1.1, 0.015);
        sparks(ev.x, ev.y, 36, '#94A3B8', 0.7, 0.022);
        debris(ev.x, ev.y, 16);
        fx.shake = 0.7; screenFlash('#FFFFFF', 0.55);
        floatText(stageOf(world.level).raider + ' 격추!', ev.x, ev.y, '#FACC15');
        play('boom'); break;
      case 'HIT_PLAYER':
        sparks(ev.x, ev.y, 22, '#FCA5A5', 0.55, 0.01);
        fx.shake = Math.max(fx.shake, 0.35); screenFlash('#F87171', 0.4); play('hurt'); break;
      case 'SHIELD_USED': sparks(ev.x, ev.y, 20, '#22D3EE', 0.5); floatText('방어막', ev.x, ev.y, '#22D3EE'); play('pickup'); break;
      case 'PICKUP': floatText(ITEM_LABEL[ev.kind], ev.x, ev.y, '#FACC15'); sparks(ev.x, ev.y, 12, '#FACC15', 0.35); play('pickup'); break;
      case 'BOMB': fx.bomb = 0.45; fx.shake = 0.5; screenFlash('#FFFFFF', 0.55); play('boom'); break;
      case 'BOSS_IN': floatText(stageOf(world.level).raider, 0, 0.3, '#FCA5A5'); fx.shake = 0.5; play('roar'); break;
      case 'CLEAR': play('clear'); break;
      case 'OVER': play('over'); break;
    }
  }

  let smokeTimer = 0;
  function updateWreckSmoke(dt) {
    const b = world.boss;
    // a steady trail off the wreck, so the gaps between blasts are not empty
    if (!b || b.alive || b.dying <= 0) { smokeTimer = 0; return; }
    smokeTimer -= dt;
    while (smokeTimer <= 0) {
      smokeTimer += 0.035;
      const px = b.x + (Math.random() - 0.5) * C.BOSS_HALF;
      const py = b.y + (Math.random() - 0.5) * C.BOSS_HALF * 0.6;
      sparks(px, py, 1, '#94A3B8', 0.12, 0.018);
      if (Math.random() < 0.45) sparks(px, py, 1, '#FFB454', 0.2, 0.009);
    }
  }

  function updatePad(dt) {
    pad.glow = onPad ? Math.min(1, pad.glow + dt * 6) : Math.max(0, pad.glow - dt * 3);
    pad.band = dragging ? Math.min(1, pad.band + dt * 4) : Math.max(0, pad.band - dt * 1.4);
    if (!onPad && pad.placed) {
      const e = Math.min(1, dt * 9);
      pad.knobX += ((pad.left + pad.right) / 2 - pad.knobX) * e;
      pad.knobY += ((pad.top + pad.bottom) / 2 - pad.knobY) * e;
    }
  }

  function updateFx(dt) {
    fx.muzzle = Math.max(0, fx.muzzle - dt);
    fx.shake = Math.max(0, fx.shake - dt);
    fx.bomb = Math.max(0, fx.bomb - dt);
    fx.comboPop = Math.max(0, fx.comboPop - dt * 2.4);
    fx.bannerTimer = Math.max(0, fx.bannerTimer - dt);
    for (const p of fx.particles) {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      const k = Math.max(0, 1 - p.drag * dt); p.vx *= k; p.vy *= k; p.vy += 0.35 * dt;
    }
    fx.particles = fx.particles.filter(p => p.life > 0);
    for (const t of fx.texts) t.life -= dt;
    fx.texts = fx.texts.filter(t => t.life > 0);
    for (const c of clouds) { c.y += SCROLL_SPEED * dt * (c.far ? 0.45 : 1); if (c.y > 1.25) c.y -= 1.6; }
    updateAmbient(dt);
    updateWreckSmoke(dt);
  }

  const sy = y => y * canvas._h;

  function label(text, x, y, size, fill, stroke) {
    ctx.font = `600 ${size}px "IBM Plex Sans", sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(2, size * 0.17);
    ctx.strokeStyle = stroke; ctx.strokeText(text, x, y + size * 0.35);
    ctx.fillStyle = fill; ctx.fillText(text, x, y + size * 0.35);
  }

  function banked(img, cx, cy, sw, sh, bank, alpha, lit) {
    if (!img.complete || !img.naturalWidth) return;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(bank * BANK_DEG * Math.PI / 180);
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    if (lit) ctx.filter = 'brightness(3.2)';
    ctx.drawImage(img, -sw / 2, -sh / 2, sw, sh);
    ctx.restore();
  }

  const hexA = (hex, a) => `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;

  function drawMotes(t) {
    const w = canvas._w;
    for (const m of motes) {
      const twinkle = 0.55 + 0.45 * Math.sin(runTime * 2.6 + m.phase);
      ctx.globalAlpha = twinkle * (t.ambient === 'EMBERS' ? 0.85 : 0.7);
      ctx.fillStyle = t.accent;
      ctx.beginPath(); ctx.arc(sx(m.x), sy(m.y), Math.max(1, m.r * w), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawSky() {
    const w = canvas._w, h = canvas._h, t = themeOf(world.level);
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, t.top); g.addColorStop(0.55, t.mid); g.addColorStop(1, t.low);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    // stars sit behind the weather; embers ride in front of it
    if (t.ambient === 'STARS') drawMotes(t);

    const lit = boltFlash * boltFlash;     // the bolt lights the cloud tops, not just the screen
    for (const c of clouds) {
      const base = c.far ? t.aFar : t.aNear;
      ctx.globalAlpha = Math.min(1, base + (1 - base) * lit * 0.75);
      ctx.fillStyle = c.far ? t.cloudFar : t.cloud;
      const r = c.r * w;
      ctx.beginPath(); ctx.ellipse(sx(c.x), sy(c.y), r, r * 0.32, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(sx(c.x) + r * 0.08, sy(c.y) - r * 0.15, r * 0.62, r * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (t.ambient === 'EMBERS') drawMotes(t);

    const s = ctx.createLinearGradient(0, h * t.groundFrom, 0, h);
    s.addColorStop(0, hexA(t.ground, 0)); s.addColorStop(1, t.ground);
    ctx.fillStyle = s; ctx.fillRect(0, h * t.groundFrom, w, h * (1 - t.groundFrom));

    if (boltFlash > 0) {
      ctx.globalAlpha = Math.min(1, 0.43 * lit);
      ctx.fillStyle = t.accent; ctx.fillRect(0, 0, w, h);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- the steering pad ----------
  // A thumb-sized area in the bottom corner you can fly from without your hand covering the
  // fighter. Dragging the plane directly still works; the pad just multiplies a short stroke.
  const PAD_GAIN = 1.55, PAD_KNOB = 0.055;
  const pad = { left: 0, top: 0, right: 0, bottom: 0, knobX: 0, knobY: 0, glow: 0, band: 0, placed: false };
  let padUsed = false;
  try { padUsed = localStorage.getItem('skystrike.padUsed') === '1'; } catch (e) {}
  window.__pad = pad;

  function layOutPad() {
    const w = canvas._w, h = canvas._h;
    const pw = w * 0.44, ph = Math.min(w * 0.30, h * 0.22);
    pad.left = w * 0.05; pad.bottom = h - w * 0.05;
    pad.top = pad.bottom - ph; pad.right = pad.left + pw;
    if (!pad.placed) {
      pad.placed = true;
      pad.knobX = (pad.left + pad.right) / 2;
      pad.knobY = (pad.top + pad.bottom) / 2;
    }
  }
  const padHit = (x, y) => x >= pad.left && x <= pad.right && y >= pad.top && y <= pad.bottom;
  function moveKnob(x, y) {
    const r = canvas._w * PAD_KNOB;
    pad.knobX = Math.max(pad.left + r, Math.min(pad.right - r, x));
    pad.knobY = Math.max(pad.top + r, Math.min(pad.bottom - r, y));
  }

  function drawControlPad() {
    const w = canvas._w;
    const round = w * 0.05, pw = pad.right - pad.left, ph = pad.bottom - pad.top;
    ctx.globalAlpha = 0.13 + 0.16 * pad.glow;
    ctx.fillStyle = '#101A30';
    ctx.beginPath(); ctx.roundRect(pad.left, pad.top, pw, ph, round); ctx.fill();
    ctx.globalAlpha = 0.25 + 0.43 * pad.glow;
    ctx.strokeStyle = '#3C5A8C'; ctx.lineWidth = Math.max(1.5, w * 0.004); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.roundRect(pad.left, pad.top, pw, ph, round); ctx.stroke();

    // four chevrons pointing out of the pad, so "forward and back too" reads at a glance
    const cx = (pad.left + pad.right) / 2, cy = (pad.top + pad.bottom) / 2;
    const tip = Math.min(pw, ph) * 0.40, v = w * 0.022;
    ctx.globalAlpha = 0.36 + 0.44 * pad.glow;
    ctx.lineWidth = Math.max(1.5, w * 0.006);
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - v, cy - tip + v); ctx.lineTo(cx, cy - tip); ctx.lineTo(cx + v, cy - tip + v);
    ctx.moveTo(cx - v, cy + tip - v); ctx.lineTo(cx, cy + tip); ctx.lineTo(cx + v, cy + tip - v);
    ctx.moveTo(cx - tip + v, cy - v); ctx.lineTo(cx - tip, cy); ctx.lineTo(cx - tip + v, cy + v);
    ctx.moveTo(cx + tip - v, cy - v); ctx.lineTo(cx + tip, cy); ctx.lineTo(cx + tip - v, cy + v);
    ctx.stroke();

    // the knob rides your thumb and springs back to the middle when you let go
    const kr = w * PAD_KNOB;
    ctx.globalAlpha = 0.37 + 0.43 * pad.glow;
    ctx.fillStyle = '#101A30';
    ctx.beginPath(); ctx.arc(pad.knobX, pad.knobY, kr, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.49 + 0.51 * pad.glow;
    ctx.lineWidth = Math.max(2, w * 0.006);
    ctx.beginPath(); ctx.arc(pad.knobX, pad.knobY, kr, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;

    // the words are for your first flight only; after that the chevrons say it
    if (!padUsed) label('조종 · 상하좌우 끌기', cx, pad.top - w * 0.03, w * 0.032, '#FACC15', '#0B1020');

    // the ceiling of the band, drawn only while you are actually steering into it
    if (pad.band > 0.01) {
      ctx.globalAlpha = 0.45 * pad.band;
      ctx.lineWidth = Math.max(1.5, w * 0.004);
      const y = sy(C.PLAYER_Y_MIN), dash = w * 0.028;
      ctx.beginPath();
      for (let x = w * 0.04; x < w * 0.96; x += dash * 2) {
        ctx.moveTo(x, y); ctx.lineTo(Math.min(x + dash, w * 0.96), y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';   // leave the context as we found it
  }

  function drawPlayer() {
    const w = canvas._w;
    const cx = sx(world.playerX), cy = sy(world.playerY);
    const sh = w * SIZE.player, sw = sh * 0.8;
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(cx, cy + sh * 0.37, sw * 0.34, sh * 0.07, 0, 0, Math.PI * 2); ctx.fill();
    const target = Math.max(-1, Math.min(1, (world.playerX - lastPlayerX) * 26));
    smoothBank += (target - smoothBank) * 0.25;
    const blink = world.mercy > 0 && (Math.floor(world.mercy * 14) & 1) === 0;
    if (!blink) banked(SPRITES.player[Math.floor(runTime * PROP_HZ) & 1], cx, cy, sw, sh, smoothBank);
    if (world.shield) {
      ctx.strokeStyle = '#22D3EE'; ctx.lineWidth = Math.max(2, w * 0.008);
      ctx.globalAlpha = 0.55 + 0.35 * Math.sin(runTime * 6);
      ctx.beginPath(); ctx.arc(cx, cy, sh * 0.62, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (fx.muzzle > 0) {
      const r = w * 0.035 * (0.5 + fx.muzzle / 0.055);
      const g = ctx.createRadialGradient(cx, cy - sh * 0.45, 0, cx, cy - sh * 0.45, r);
      g.addColorStop(0, 'rgba(255,255,220,0.95)'); g.addColorStop(0.45, 'rgba(253,224,71,0.75)'); g.addColorStop(1, 'rgba(249,115,22,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy - sh * 0.45, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  function draw() {
    fit();
    const w = canvas._w, h = canvas._h;
    runTime += 0;
    drawSky();
    layOutPad();
    if (world.state === State.RUNNING) drawControlPad();
    ctx.save();
    if (fx.shake > 0) ctx.translate((Math.random() - 0.5) * fx.shake * w * 0.04, (Math.random() - 0.5) * fx.shake * w * 0.04);

    for (const f of world.flares) {
      // a column of fire off the burning ground: hot core, ragged crown, smoke haze
      const fade = Math.max(0, Math.min(1, f.life / f.max)), grow = 1 - fade;
      const cx = sx(f.x), cy = sy(f.y);
      const rw = w * 0.075 * (0.55 + fade * 0.6);
      const rh = w * (0.13 + grow * 0.05) * (0.5 + fade * 0.7);
      const flick = 0.85 + 0.15 * Math.sin(runTime * 14 + f.phase);
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(1, rw * 2.1));
      g.addColorStop(0, 'rgba(255,138,43,0)'); g.addColorStop(0.55, 'rgba(255,138,43,0.2)'); g.addColorStop(1, 'rgba(255,138,43,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, Math.max(1, rw * 2.1), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.78 * fade; ctx.fillStyle = '#FFB454';
      ctx.beginPath(); ctx.ellipse(cx, cy - rh * 0.27, rw * flick, rh * 0.73, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.59 * fade; ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.ellipse(cx, cy - rh * 0.2, rw * 0.38 * flick, rh * 0.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    for (const it of world.items) {
      const img = SPRITES.pickups[it.kind];
      const s = w * SIZE.pickup * (1 + 0.06 * Math.sin(runTime * 5 + it.x * 8));
      if (img && img.complete && img.naturalWidth) ctx.drawImage(img, sx(it.x) - s / 2, sy(it.y) - s / 2, s, s);
    }
    for (const s of world.shots) {
      const r = w * (s.fromPlayer ? 0.009 : 0.013);
      const cx = sx(s.x), cy = sy(s.y);
      if (s.fromPlayer) {
        ctx.fillStyle = '#FFF0B8';
        ctx.beginPath(); ctx.roundRect(cx - r, cy - r * 2.6, r * 2, r * 5.2, r); ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.roundRect(cx - r * 0.42, cy - r * 2, r * 0.84, r * 4, r); ctx.fill();
      } else {
        ctx.fillStyle = '#FF8A4D'; ctx.beginPath(); ctx.arc(cx, cy, r * 1.25, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FFE0A8'; ctx.beginPath(); ctx.arc(cx, cy - r * 0.2, r * 0.55, 0, Math.PI * 2); ctx.fill();
      }
    }
    for (const e of world.enemies) {
      if (!e.alive) continue;
      const k = KIND.indexOf(e.kind);
      const sh = w * SIZE.foe, sw = sh * 0.8;
      const img = SPRITES.foes[k][(Math.floor(runTime * PROP_HZ) + k) & 1];
      // On the long night you hear them before you see them: they surface out of the dark.
      const dark = profileOf(world.level).hazard === 'DARK';
      const reveal = dark ? Math.max(0, Math.min(1, (e.y - 0.04) / 0.26)) : 1;
      if (reveal <= 0.02) continue;
      ctx.globalAlpha = reveal;
      if (e.hp < e.max) ctx.filter = 'brightness(1.5) saturate(1.4)';
      banked(img, sx(e.x), sy(e.y), sw, sh, e.bank);
      ctx.filter = 'none';
      ctx.globalAlpha = 1;
    }
    const b = world.boss;
    if (b && (b.alive || !b.finished)) {
      const img = SPRITES.raiders[b.kind][Math.floor(runTime * PROP_HZ) & 1];
      const sw = w * SIZE.raider, sh = sw * 0.8, bx = sx(b.x), by2 = sy(b.y);
      let barAlpha = 1;
      if (b.alive) {
        // it glows red for a beat each time it steps up a phase
        const raging = b.rage > 0 && (Math.floor(b.rage * 18) & 1) === 0;
        banked(img, bx, by2, sw, sh, b.bank * 0.5, 1, raging);
      } else {
        // Falling. It rolls over, lights up white at each blast, and burns out at the very end.
        const span = C.BOSS_DEATH_SECONDS - C.BOSS_AFTERGLOW;
        const gone = 1 - Math.max(0, Math.min(1, (b.dying - C.BOSS_AFTERGLOW) / span));
        const roll = Math.sin(b.roll * C.TAU) * (0.35 + gone * 0.65);
        const lit = (Math.floor(b.dying * 26) & 1) === 0 && gone < 0.88;
        const fade = 1 - Math.max(0, Math.min(1, (gone - 0.8) / 0.2));
        banked(img, bx, by2, sw * (1 - gone * 0.06), sh, roll, fade, lit);
        // it trails fire the whole way down
        const glow = Math.max(1, w * 0.11 * (0.6 + Math.sin(runTime * 19) * 0.25) * (1 - gone * 0.4));
        const g = ctx.createRadialGradient(bx, by2, 0, bx, by2, glow);
        g.addColorStop(0, 'rgba(255,241,196,0.8)');
        g.addColorStop(0.5, 'rgba(249,115,22,0.53)');
        g.addColorStop(1, 'rgba(249,115,22,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by2, glow, 0, Math.PI * 2); ctx.fill();
        barAlpha = 1 - Math.max(0, Math.min(1, gone / 0.25));   // the bar gets out of the way
      }
      if (barAlpha > 0) {
        ctx.globalAlpha = barAlpha;
        const bw = w * 0.76, bh = w * 0.035, by = h * 0.075;
        ctx.fillStyle = '#6B1D1D';
        ctx.beginPath(); ctx.roundRect((w - bw) / 2 - 2, by - 2, bw + 4, bh + 4, bh); ctx.fill();
        if (b.hp > 0) {
          ctx.fillStyle = '#F87171';
          ctx.beginPath(); ctx.roundRect((w - bw) / 2, by, bw * (b.hp / Math.max(1, b.max)), bh, bh); ctx.fill();
          // ticks where it changes its mind, so the fight reads as three rounds
          ctx.strokeStyle = '#3C5A8C'; ctx.lineWidth = Math.max(1.5, w * 0.004);
          ctx.beginPath();
          for (const mark of [C.BOSS_PHASE_2, C.BOSS_PHASE_3]) {
            const mx = (w - bw) / 2 + bw * mark;
            ctx.moveTo(mx, by); ctx.lineTo(mx, by + bh);
          }
          ctx.stroke();
        }
        label(stageOf(world.level).raider, w / 2, by + bh / 2, w * 0.042, '#FFFFFF', '#0B1020');
        ctx.globalAlpha = 1;
      }
    }
    if (world.state === State.RUNNING || world.state === State.LEVEL_CLEAR) drawPlayer();

    for (const p of fx.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), Math.max(1.5, p.size * w), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const t of fx.texts) {
      const k = 1 - t.life / t.max;
      ctx.globalAlpha = Math.min(1, t.life / 0.3);
      label(t.text, sx(t.x), sy(t.y) - w * 0.12 * k, w * 0.055, t.color, '#0B1020');
    }
    ctx.globalAlpha = 1;
    if (fx.bomb > 0) {
      const r = w * (1 - fx.bomb / 0.45) * 1.4;
      const g = ctx.createRadialGradient(sx(world.playerX), sy(world.playerY), 0, sx(world.playerX), sy(world.playerY), Math.max(1, r));
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.8, 'rgba(255,255,255,0.4)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx(world.playerX), sy(world.playerY), Math.max(1, r), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    if (fx.flash > 0) { ctx.globalAlpha = Math.min(0.55, fx.flash); ctx.fillStyle = fx.flashColor; ctx.fillRect(0, 0, w, h); ctx.globalAlpha = 1; }
    drawHud();
    lastPlayerX = world.playerX;
  }

  function drawHud() {
    const w = canvas._w, h = canvas._h;
    label(String(world.score), w * 0.5, h * 0.03 + w * 0.04, w * 0.075, '#FFFFFF', '#0B1020');
    const season = Math.floor((world.level - 1) / STAGES.length) + 1;
    const stageText = season > 1 ? `${world.level} 스테이지 · ${season} 회차` : `${world.level} 스테이지`;
    label(stageText, w * 0.17, h * 0.03 + w * 0.035, w * 0.045, '#FFFFFF', '#0B1020');
    label(`최고 ${Math.max(best, world.bestLevel)}`, w * 0.84, h * 0.03 + w * 0.035, w * 0.04, '#FFFFFF', '#0B1020');

    // hit points up under the stage name: the bottom band is the steering area now, and a
    // thumb resting on the pad must not cover your own health
    const pip = w * 0.032, gap = pip * 0.6;
    // clear of the raider's health bar, which hangs at h * 0.075 during a boss
    let px = w * 0.06; const py = h * 0.075 + w * 0.075;
    for (let i = 0; i < C.MAX_HP; i++) {
      ctx.fillStyle = i < world.hp ? (world.hp <= 2 ? '#F87171' : '#34D399') : '#27354F';
      ctx.beginPath(); ctx.roundRect(px, py - pip / 2, pip, pip, pip * 0.3); ctx.fill();
      px += pip + gap;
    }
    drawCombo(py + pip * 1.8);
    if (world.rapidTimer > 0) label('연사', w * 0.06 + (C.MAX_HP * pip + (C.MAX_HP - 1) * gap) / 2, py + pip * 4.4, w * 0.035, '#FACC15', '#0B1020');

    const r = w * 0.085, bx = w - r - w * 0.05, by = h - r - w * 0.06;
    ctx.globalAlpha = world.bombs > 0 ? 0.9 : 0.43;
    ctx.fillStyle = '#101A30'; ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#3C5A8C'; ctx.lineWidth = Math.max(2, w * 0.006);
    ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.stroke();
    const bomb = SPRITES.pickups.BOMB;
    if (bomb && bomb.complete && bomb.naturalWidth) {
      ctx.globalAlpha = world.bombs > 0 ? 1 : 0.35;
      ctx.drawImage(bomb, bx - r * 0.55, by - r * 0.62, r * 1.1, r * 1.1);
      ctx.globalAlpha = 1;
    }
    label(String(world.bombs), bx, by + r * 0.72, w * 0.042, '#FFFFFF', '#0B1020');
    drawBanner();
    if (world.state !== State.RUNNING) drawOverlay();
  }

  /**
   * The chain. It only shows once it is actually paying -- below that it would be noise -- and
   * the bar under it is the window you have left to land the next kill.
   */
  function drawCombo(y) {
    const w = canvas._w;
    const mult = world.comboMultiplier();
    if (world.combo < C.COMBO_STEP || mult < 2) return;
    const left = Math.max(0, Math.min(1, world.comboTimer / C.COMBO_WINDOW));
    const x = w * 0.06;
    const size = w * (0.052 + fx.comboPop * 0.022);
    label('x' + mult, x + size * 0.45, y + size, size, '#FACC15', '#0B1020');
    label('연쇄', x + size * 1.55, y + size * 0.97, w * 0.028, '#FFFFFF', '#0B1020');
    const bw = w * 0.17, bh = w * 0.012, by = y + size * 1.25;
    ctx.fillStyle = '#27354F';
    ctx.beginPath(); ctx.roundRect(x, by, bw, bh, bh); ctx.fill();
    ctx.fillStyle = left < 0.3 ? '#F87171' : '#FACC15';
    ctx.beginPath(); ctx.roundRect(x, by, bw * left, bh, bh); ctx.fill();
  }

  /** A line across the middle of the sky for the moments that deserve one. */
  function drawBanner() {
    if (fx.bannerTimer <= 0 || !fx.banner) return;
    const w = canvas._w, h = canvas._h;
    const k = Math.max(0, Math.min(1, fx.bannerTimer / 0.35));   // eases out at the end
    ctx.globalAlpha = k;
    label(fx.banner, w / 2, h * 0.36 - (1 - k) * w * 0.05, w * 0.072, '#FACC15', '#0B1020');
    ctx.globalAlpha = 1;
  }

  function drawOverlay() {
    const w = canvas._w, h = canvas._h;
    const st = stageOf(world.level);
    let pre = '', title, body, accent;
    if (world.state === State.READY) {
      title = st.place;
      body = st.story + '\n\n출격 · ' + courseBits();
      accent = '탭하면 이륙';
    } else if (world.state === State.LEVEL_CLEAR) {
      const next = stageOf(world.level + 1);
      pre = `${world.level} 스테이지 클리어`;
      title = st.clear;
      body = `${world.kills}기 격추 · ${world.score}점${chainLine()}\n다음: ${next.place} · ${next.tag}`;
      accent = '탭하면 다음 출격';
    } else {
      title = '격추됨';
      body = `${st.place} 상공에서 격추됐다\n${world.kills}기 격추 · ${world.score}점${chainLine()}`;
      accent = '탭하면 재출격';
    }
    // The clear lines are whole sentences, so the title wraps too -- and drops a size when it
    // has to, rather than running off the side of the panel.
    let titleSize = w * 0.068;
    let titleLines = wrapAt(title, w * 0.80, titleSize, true);
    if (titleLines.length > 1) {
      titleSize = w * 0.054;
      titleLines = wrapAt(title, w * 0.80, titleSize, true);
    }
    const lines = wrapAt(body, w * 0.78, w * 0.042, false);
    const panelH = h * 0.30 + lines.length * w * 0.052 + (titleLines.length - 1) * titleSize * 1.25;
    ctx.fillStyle = 'rgba(16,26,48,0.92)';
    ctx.beginPath(); ctx.roundRect(w * 0.07, h * 0.5 - panelH / 2, w * 0.86, panelH, w * 0.05); ctx.fill();
    ctx.strokeStyle = '#3C5A8C'; ctx.lineWidth = Math.max(2, w * 0.005); ctx.stroke();
    let y = h * 0.5 - panelH / 2 + w * 0.11;
    if (pre) { label(pre, w / 2, y, w * 0.045, '#FACC15', '#0B1020'); y += w * 0.075; }
    for (const line of titleLines) {
      label(line, w / 2, y, titleSize, '#FFFFFF', '#0B1020');
      y += titleSize * 1.25;
    }
    y += w * 0.09 - titleSize * 1.25;
    ctx.font = `400 ${w * 0.042}px "IBM Plex Sans", sans-serif`;
    ctx.textAlign = 'center'; ctx.fillStyle = '#F8FAFC';
    for (const line of lines) { ctx.fillText(line, w / 2, y); y += w * 0.052; }
    y += w * 0.03;
    label(accent, w / 2, y, w * 0.05, '#FACC15', '#0B1020');
  }

  /**
   * Breaks `body` to fit `maxWidth` at `size`, keeping the author's own line breaks. Without
   * this a long victory line runs off the side of the panel on a narrow phone.
   */
  function wrapAt(body, maxWidth, size, display) {
    ctx.font = display
      ? `400 ${size}px "Lilita One", Impact, sans-serif`
      : `400 ${size}px "IBM Plex Sans", sans-serif`;
    const out = [];
    for (const paragraph of body.split('\n')) {
      if (!paragraph) { out.push(''); continue; }
      let line = '';
      for (const word of paragraph.split(' ')) {
        const candidate = line ? line + ' ' + word : word;
        if (ctx.measureText(candidate).width <= maxWidth || !line) line = candidate;
        else { out.push(line); line = word; }
      }
      out.push(line);
    }
    return out;
  }

  /** How far the chain got, if it got anywhere worth saying. */
  function chainLine() {
    return world.bestCombo < C.COMBO_STEP ? '' : ` · 최고 연쇄 ${world.bestCombo}`;
  }

  function courseBits() {
    const p = profileOf(world.level), bits = [];
    if (p.mix.filter(k => k === 'DRONE' || k === 'WEAVER').length >= 2) bits.push('편대');
    if (p.mix.includes('GUNNER')) bits.push('대공포');
    if (p.mix.includes('DIVER')) bits.push('급강하');
    if (p.speed >= 0.36) bits.push('고속');
    return bits.join(' · ');
  }

  // ---------- Input ----------
  let dragging = false, onPad = false, lastTouch = 0, lastTouchY = 0, dragPointer = -1;
  function bombHit(px, py) {
    const w = canvas._w, h = canvas._h, r = w * 0.085;
    const bx = w - r - w * 0.05, by = h - r - w * 0.06;
    return (px - bx) ** 2 + (py - by) ** 2 < r * r * 1.4;
  }
  function canvasPoint(ev) {
    const rect = canvas.getBoundingClientRect();
    const scale = canvas._w / rect.width;
    return { x: (ev.clientX - rect.left) * scale, y: (ev.clientY - rect.top) * scale };
  }
  function onDown(ev) {
    ev.preventDefault(); canvas.focus(); ac();
    const p = canvasPoint(ev);
    // a bomb tap with the other hand must not steal the finger that is flying the plane
    if (bombHit(p.x, p.y)) { world.useBomb(); return; }
    if (dragPointer < 0) {
      layOutPad();
      dragPointer = ev.pointerId;
      dragging = true; lastTouch = p.x; lastTouchY = p.y;
      onPad = padHit(p.x, p.y);
      if (onPad) {
        moveKnob(p.x, p.y);
        if (!padUsed) { padUsed = true; try { localStorage.setItem('skystrike.padUsed', '1'); } catch (e) {} }
      }
    }
    if (world.state === State.READY) world.start();
    else if (world.state === State.LEVEL_CLEAR) world.nextLevel();
    else if (world.state === State.GAME_OVER) world.start();
  }
  function onMove(ev) {
    if (!dragging || ev.pointerId !== dragPointer) return;
    const p = canvasPoint(ev);
    // the pad multiplies your thumb; dragging the plane itself stays one-to-one
    const gain = onPad ? PAD_GAIN : 1;
    world.movePlayerBy((p.x - lastTouch) / (canvas._w * 0.5) * gain, (p.y - lastTouchY) / canvas._h * gain);
    lastTouch = p.x; lastTouchY = p.y;
    if (onPad) moveKnob(p.x, p.y);
  }
  function onUp(ev) {
    if (ev && ev.pointerId !== undefined && ev.pointerId !== dragPointer) return;
    dragging = false; onPad = false; dragPointer = -1;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  let held = 0, heldY = 0;
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') held = -1;
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') held = 1;
    else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') heldY = -1;
    else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') heldY = 1;
    else if (e.key === 'm' || e.key === 'M') toggleMute();
    else if (e.key === 'b' || e.key === 'B') world.useBomb();
    else if (e.key === ' ' || e.key === 'Enter') {
      ac();
      if (world.state === State.READY || world.state === State.GAME_OVER) world.start();
      else if (world.state === State.LEVEL_CLEAR) world.nextLevel();
    } else return;
    e.preventDefault();
  });
  window.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'a' || k === 'A' || k === 'd' || k === 'D') held = 0;
    if (k === 'ArrowUp' || k === 'ArrowDown' || k === 'w' || k === 'W' || k === 's' || k === 'S') heldY = 0;
  });

  // ---------- Loop ----------
  let last = 0, timeScale = 1;
  const HITSTOP_SCALE = 0.05, TIME_RECOVERY = 1.1;
  function frame(now) {
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    runTime += dt;
    // hitstop: the world nearly stops when the raider goes, then winds back up. The recovery
    // runs on the real clock so the slow-motion itself cannot slow down.
    timeScale = Math.min(1, timeScale + dt * TIME_RECOVERY);
    const scaled = dt * timeScale;
    if (held || heldY) world.movePlayerBy(held * 1.6 * dt, heldY * 0.85 * dt);
    updatePad(dt);
    world.update(scaled);
    for (const ev of world.events) handleEvent(ev);
    world.events.length = 0;
    if (world.state !== State.RUNNING && (world.bestLevel > best || world.score > bestScore)) {
      best = Math.max(best, world.bestLevel); bestScore = Math.max(bestScore, world.score);
      try { localStorage.setItem('skystrike.best', String(best)); localStorage.setItem('skystrike.bestScore', String(bestScore)); } catch (e) {}
    }
    updateFx(scaled);
    // the flash is a camera effect, not a world one: it fades on the real clock, or the hitstop
    // would hold a white screen over the whole moment you are meant to be watching
    fx.flash = Math.max(0, fx.flash - dt * 2.2);
    draw();
    requestAnimationFrame(frame);
  }
  fit();
  window.addEventListener('resize', fit);
  requestAnimationFrame(frame);
})();
</script>

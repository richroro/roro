<title>Sky Strike</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root {
    --ground: #070D1A; --panel: #101A30; --line: #2A3560; --text: #F8FAFC; --muted: #94A6C8;
    --gold: #FACC15;
    --display: "Lilita One", "Arial Black", Impact, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--text); font-family: var(--body);
    padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  header { width: 100%; max-width: 420px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.35rem; letter-spacing: 0.02em; white-space: nowrap; }
  .tag { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .stage { width: 100%; max-width: 420px; flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; }
  canvas {
    display: block; max-width: 100%; max-height: 100%; aspect-ratio: 9 / 16; border-radius: 18px;
    border: 1px solid var(--line); background: #0B2545; touch-action: none; user-select: none; -webkit-user-select: none; outline: none;
  }
  canvas:focus-visible { box-shadow: 0 0 0 3px var(--gold); }
  .hints { width: 100%; max-width: 420px; display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 0.8rem; color: var(--muted); justify-content: space-between; }
  #mute { margin-left: 8px; font-size: 1rem; line-height: 1; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); cursor: pointer; vertical-align: middle; }
  kbd { font-family: var(--body); font-weight: 600; font-size: 0.75rem; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--text); }
</style>

<header>
  <h1>Sky Strike</h1>
  <span class="tag">스카이 스트라이크 <button id="mute" type="button" aria-label="소리 켜기/끄기" title="소리 (M)">🔊</button></span>
</header>
<div class="stage">
  <canvas id="game" tabindex="0" aria-label="스카이 스트라이크 게임 화면. 왼쪽 아래 조종 영역을 끌어 상하좌우로 비행하고 자동으로 사격합니다."></canvas>
</div>
<div class="hints">
  <span>왼쪽 아래 <b>조종 영역</b>을 끌거나 <kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> 로 상하좌우 비행 · 탭/스페이스로 시작 · <kbd>B</kbd> 폭탄 · <kbd>I</kbd> 또는 <b>AI</b> 버튼으로 자동 비행 · <kbd>M</kbd> 소리</span>
  <span>적기 12종 · 아이템 14종 · 스테이지 클리어마다 강화 3장 중 1장 선택 · S~C 평가</span>
</div>

<script>
(function () {
  // ---------- SkyWorld: pure simulation (mirrors skystrike/SkyWorld.kt) ----------
  const C = {
    PLAYER_Y: 0.86, PLAYER_Y_MIN: 0.50, PLAYER_Y_MAX: 0.94,
    // no aircraft, however agile, may sit inside the raider's hull
    FRONT_FLOOR: 0.2 + 0.2 + 0.045 + 0.01,
    PLAYER_LIMIT: 0.88, PLAYER_HALF_X: 0.055, PLAYER_HALF_Y: 0.045,
    ENEMY_HALF: 0.062, SHIELD_ARC: 0.55, TURRET_STATION_Y: 0.30, TURRET_SECONDS: 7,
    TURRET_FIRE: 0.62, SPLIT_SPREAD: 0.075,
    MINE_GAP: 1.5, MINE_DRIFT: 0.035, CHARGE_TELL: 1.1, CHARGE_SPEED: 4.2, CHARGE_TRACK: 2.2,
    HEAL_GAP: 1.8, HEAL_RADIUS: 0.45, HEAL_FLASH: 0.35,
    SLOW_SECONDS: 6, SLOW_FACTOR: 0.42, MAX_ORBS: 3, ORBIT_R: 0.17, ORBIT_RATE: 2.4,
    ORBIT_HALF: 0.032, VAMP_SECONDS: 12, VAMP_KILLS: 8, MEDAL_SCORE: 120, RANK_S_CHAIN: 12, RANK_A_CHAIN: 8, BOSS_HALF: 0.2, SHOT_HALF: 0.012, ITEM_HALF: 0.05,
    MAX_HP: 5, START_BOMBS: 2, MAX_BOMBS: 5, MAX_SPREAD: 5,
    RAM_DAMAGE: 1, SHOT_DAMAGE: 1, MERCY_SECONDS: 1.1, FLASH_SECONDS: 0.3,
    BASE_FIRE_RATE: 9, RAPID_MULT: 1.9, RAPID_SECONDS: 7, SHOT_SPEED: 1.9, ENEMY_SHOT_SPEED: 0.72,
    WAVE_GAP: 2.1, ITEM_CHANCE: 0.13, ITEM_FALL_SPEED: 0.26, ITEM_SCORE: 30,
    COMBO_WINDOW: 2.3, COMBO_STEP: 3, MAX_COMBO_MULT: 8,
    RUSH_FORMATIONS: 3, RUSH_SPEED: 1.35, RUSH_STACK: 0.46,
    BOSS_PHASE_2: 0.62, BOSS_PHASE_3: 0.30, BOSS_RAGE_SECONDS: 0.9,
    BOSS_PHASE_SWEEP: [1, 1.45, 1.9], BOSS_PHASE_REACH: [1, 1.08, 1.15], BOSS_PHASE_GAP: [1, 0.74, 0.56],
    BOSS_AIMED_SPEED: 0.95, BOSS_SPIRAL_ARMS: 5, BOSS_SPIN_STEP: 0.7,
    BURST_SHOTS: 3, BURST_GAP: 0.17, WALL_SLOTS: 8, WALL_REACH: 0.85, COLUMN_SHOTS: 3,
    MAX_CONTINUES: 3,
    BOONS_OFFERED: 3, RAPIDFIRE_STEP: 0.15, CHAINWINDOW_STEP: 0.6, CHAINCAP_STEP: 2,
    SUPPLY_STEP: 0.5, AGILITY_STEP: 0.045, MAGNETIC_STEP: 0.22,
    MAX_WINGMEN: 4, WINGMAN_OFFSET: 0.115, WINGMAN_TRAIL: 0.035,
    PIERCE_SECONDS: 8, PIERCE_HITS: 3, HOMING_SECONDS: 7, HOMING_TURN: 5.5,
    MAGNET_SECONDS: 9, MAGNET_PULL: 0.85,
    CLEAR_BONUS: 250, BOSS_SCORE: 500,
    BOSS_KINDS: 6, BOSS_BASE_HP: 70, BOSS_STATION_Y: 0.2, BOSS_ENTRY_SPEED: 0.22,
    BOSS_SWEEP_RATE: 0.9, BOSS_SWEEP_X: 0.5, BOSS_SALVO_GAP: 1.15, BOSS_FAN: 1.5, BOMB_BOSS_RATIO: 0.16,
    BOSS_DEATH_SECONDS: 2.6, BOSS_BREAKS: 11, BOSS_BREAK_GAP: 0.16, BOSS_AFTERGLOW: 0.8,
    BOSS_SINK: 0.085, BOSS_DRIFT: 0.075, BOSS_ROLL: 0.34,
    MAX_FRAME_DT: 0.05, TAU: 6.2831855,
    GUST_RATE: 0.55, GUST_STRENGTH: 0.30,
    FLARE_GAP: 1.5, FLARE_RISE: 0.2, FLARE_LIFE: 4.6, FLARE_HALF: 0.055,
    // slowest a diver ever comes down, whatever its height
    DIVE_CRAWL: 0.35,
    // flying itself
    AI_PAUSE: 1.6, AI_REACH: 0.12, AI_SPEED: 3.6, AI_LOOKAHEAD: 0.85, AI_PRESS: 0.65, AI_SOON: 0.5,
    AI_AGILITY: 9, AI_URGENT: 200,
    AI_MERCY_TRUST: 0.25, AI_MERCY_DISCOUNT: 0.15,
    AI_SHOT_CLEAR: 0.15, AI_SHOT_WEIGHT: 900, AI_BODY_CLEAR: 0.11, AI_BODY_WEIGHT: 700,
    AI_FLARE_CLEAR: 0.23, AI_FLARE_WEIGHT: 1100, AI_EDGE_CLEAR: 0.16, AI_EDGE_WEIGHT: 120,
    AI_ITEM_WEIGHT: 1.4, AI_AIM_WEIGHT: 11, AI_AIM_REACH: 0.5, AI_LEAD_SLACK: 0.35,
    AI_REAR_WEIGHT: 2.0, AI_RANGE_WEIGHT: 5.0, AI_BOMB_AT: 300,
  };
  const KIND = ['DRONE', 'WEAVER', 'GUNNER', 'DIVER', 'SHIELDER', 'SPLITTER', 'TURRET', 'SWARM',
                'MINER', 'MINE', 'CHARGER', 'HEALER'];
  /** How big a target each kind is. A swarm bee is a much smaller thing to hit than a barge. */
  const halfOf = k => k === 'SWARM' ? C.ENEMY_HALF * 0.55
    : k === 'MINE' ? C.ENEMY_HALF * 0.7
    : (k === 'SHIELDER' || k === 'SPLITTER' || k === 'MINER') ? C.ENEMY_HALF * 1.2 : C.ENEMY_HALF;
  /**
   * One per hull, in the order the sprites load. A raider that slides fast does not also get to
   * be a wall, and the one that barely moves is paid for in health.
   */
  const BOSS_PROFILES = [
    { style: 'FAN',    sweepRate: 1.0, reach: 1.0,  gap: 1.0,  hp: 1.0,  name: '강철 갈매기' },
    { style: 'BURST',  sweepRate: 1.5, reach: 1.1,  gap: 1.3,  hp: 1.0,  name: '폭풍우를 부르는 자' },
    { style: 'WALL',   sweepRate: 0.5, reach: 0.6,  gap: 1.4,  hp: 1.1,  name: '잿불의 여왕' },
    { style: 'DAGGER', sweepRate: 1.9, reach: 1.15, gap: 0.8,  hp: 0.9,  name: '긴 그림자' },
    { style: 'COLUMN', sweepRate: 0.6, reach: 1.2,  gap: 0.75, hp: 1.25, name: '무쇠 요새' },
    { style: 'RING',   sweepRate: 0.8, reach: 0.5,  gap: 1.15, hp: 1.05, name: '외눈' },
  ];
  const bossProfileOf = k => BOSS_PROFILES[((k % BOSS_PROFILES.length) + BOSS_PROFILES.length) % BOSS_PROFILES.length];
  const PROFILES = [
    // The coast road: clean shapes, plenty of warning, nothing but the aircraft to read.
    { waves: 22, mix: ['DRONE', 'DRONE', 'WEAVER', 'SWARM', 'CHARGER'], fireRate: 0.8, speed: 0.30, bossHp: 1.0,
      formations: ['LINE', 'VEE'], hazard: 'NONE', entryY: -0.12 },
    // Thunderhead pass: flown inside the weather, which pushes you off your line.
    { waves: 26, mix: ['WEAVER', 'DRONE', 'DIVER', 'SPLITTER', 'MINER'], fireRate: 1.0, speed: 0.34, bossHp: 1.15,
      formations: ['TRAIL', 'LINE'], hazard: 'GUSTS', entryY: -0.12 },
    // The ember fields: the ground burns, and the fire reaches the altitude you are at.
    { waves: 30, mix: ['GUNNER', 'WEAVER', 'TURRET', 'SHIELDER', 'HEALER'], fireRate: 1.25, speed: 0.32, bossHp: 1.3,
      formations: ['ARC', 'SPLIT'], hazard: 'FLAK', entryY: -0.12 },
    // The long night: they are on you before you see them.
    { waves: 34, mix: ['DIVER', 'CHARGER', 'SHIELDER', 'HEALER', 'MINER', 'SWARM'], fireRate: 1.4, speed: 0.40, bossHp: 1.5,
      formations: ['SPLIT', 'TRAIL', 'VEE'], hazard: 'DARK', entryY: -0.03 },
  ];
  const STAGES = [
    { place: '해안 항로', raider: '강철 갈매기', tag: '새벽부터 저 위를 돌고 있다',
      story: '새벽 초계. 아래 수송선단이 이번 주에만\n두 번 엄호를 요청했고, 두 번 다 아무도 안 왔다.\n오늘은 당신이 왔다.',
      clear: '선단이 항구에 닿았다. 누군가 손을 흔들었다.' },
    { place: '뇌운 고개', raider: '폭풍우를 부르는 자', tag: '제 날씨를 몰고 다닌다',
      story: '밤사이 전선이 고개를 삼키고 이동했다.\n관제는 우회하라지만, 관제는 여기 없다.',
      clear: '고개가 열렸다. 나머지는 날씨가 가져가라지.' },
    { place: '잿불 평원', raider: '잿불의 여왕', tag: '가져가지 못할 것은 태운다',
      story: '발밑은 이미 전부 타고 있다.\n불을 지른 게 아직 상공에 있고,\n아직 안 끝났다.',
      clear: '불길은 이제 알아서 사그라든다.' },
    { place: '긴 밤', raider: '긴 그림자', tag: '본 사람 중에 착륙한 사람이 없다',
      story: '수평선도, 지면도, 두 번째 기회도 없다.\n계기판과, 당신 엔진 소리를 기다리는\n무언가뿐이다.',
      clear: '결국 새벽이 왔다. 당신은 아직 날고 있다.' },
  ];
  const ITEM_LABEL = { SPREAD: '확산', RAPID: '연사', SHIELD: '방어막', BOMB: '폭탄', REPAIR: '수리',
    WINGMAN: '요기', PIERCE: '관통', HOMING: '유도', MAGNET: '자석', CHARM: '부적',
    SLOW: '감속', ORBIT: '위성', VAMPIRE: '흡혈', MEDAL: '훈장' };
  /**
   * What falls, and how often. Ten kinds at the same drop rate means more variety per drop
   * rather than more power; the staples stay common and the exotics stay a treat.
   */
  const DROP_TABLE = [
    ['SPREAD', 14], ['RAPID', 13], ['SHIELD', 11], ['REPAIR', 11], ['PIERCE', 11],
    ['HOMING', 11], ['WINGMAN', 10], ['BOMB', 8], ['MAGNET', 6], ['CHARM', 5],
    ['SLOW', 7], ['ORBIT', 8], ['VAMPIRE', 6], ['MEDAL', 9],
  ];
  const DROP_WEIGHT_TOTAL = DROP_TABLE.reduce((a, d) => a + d[1], 0);
  const profileOf = l => PROFILES[(l - 1) % PROFILES.length];
  /** One aircraft, with the fields every kind needs. A charger always starts winding up. */
  const makePlane = (kind, x, y, hp, homeX, phase, speed) => ({
    x, y, kind, hp, max: hp, homeX, phase, speed,
    alive: true, cooldown: 0, bank: 0, lastX: x, anchor: 0, mended: 0,
    charge: kind === 'CHARGER' ? C.CHARGE_TELL : 0, lockX: 0,
  });
  const stageOf = l => STAGES[(l - 1) % STAGES.length];
  const State = { READY: 'READY', RUNNING: 'RUNNING', LEVEL_CLEAR: 'LEVEL_CLEAR', GAME_OVER: 'GAME_OVER' };

  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const scoreFor = k => ({ DRONE: 10, WEAVER: 15, GUNNER: 25, DIVER: 20,
    SHIELDER: 35, SPLITTER: 30, TURRET: 40, SWARM: 8,
    MINER: 45, MINE: 5, CHARGER: 30, HEALER: 50 }[k]);

  // ---------- Flying itself ----------
  // Where it might step to, in units of AI_REACH: the eight around it, then four further out.
  const AI_SAMPLES = [
    -1, 0, 1, 0, 0, -1, 0, 1,
    -0.7, -0.7, 0.7, -0.7, -0.7, 0.7, 0.7, 0.7,
    -1.8, 0, 1.8, 0, 0, -1.7, 0, 1.7,
  ];
  // What it would rather take, best first.
  const AI_BOON_ORDER = ['GUNS', 'PIERCING', 'ARMOUR', 'RAPIDFIRE', 'ESCORT', 'CHAINWINDOW',
    'CHARMED', 'CHAINCAP', 'SUPPLY', 'MAGNETIC', 'BOMBS', 'AGILITY'];
  // The things that get worse if you leave them.
  const AI_TARGET_RANK = { HEALER: 400, TURRET: 300, MINER: 250, GUNNER: 200 };

  /**
   * How badly a thing at (rx, ry) travelling at (vx, vy) relative to a standing aircraft wants
   * that square, judged at the closest it ever comes over `horizon`.
   */
  function bite(rx, ry, vx, vy, clear, weight, horizon = C.AI_LOOKAHEAD) {
    const vv = vx * vx + vy * vy;
    const t = vv > 1e-6 ? Math.max(0, Math.min(horizon, -(rx * vx + ry * vy) / vv)) : 0;
    const d = Math.hypot(rx + vx * t, ry + vy * t);
    if (d >= clear) return 0;
    const nip = 1 - d / clear;
    // a round arriving now is worth more worry than one arriving at the end of the horizon
    return nip * nip * weight * (1 - C.AI_SOON * t / horizon);
  }

  /**
   * What being `off` lanes away from what it is shooting costs. It flattens out rather than
   * clipping, so being a whole screen off still leans it the right way instead of reading as no
   * worse than half a screen off -- which is how it used to lose track of a lone aircraft.
   */
  const offAim = off => C.AI_AIM_WEIGHT * C.AI_AIM_REACH * off / (off + C.AI_AIM_REACH);

  /** How fast an aircraft is actually coming down, per kind. A bad guess here is a dead player. */
  function aiSpeedY(e) {
    switch (e.kind) {
      case 'DRONE': return e.speed;
      case 'WEAVER': return e.speed * 0.92;
      case 'GUNNER': return e.speed * 0.62;
      // a diver is already accelerating, and will be faster still by the time it arrives
      case 'DIVER': return e.speed * Math.max(C.DIVE_CRAWL, 1 + (e.y + 0.2) * 1.6) * 1.35;
      case 'SHIELDER': return e.speed * 0.55;
      case 'SPLITTER': return e.speed * 0.72;
      case 'TURRET': return e.anchor > 0 ? 0 : e.speed * 1.2;
      case 'SWARM': return e.speed * 1.35;
      case 'MINER': return e.speed * 0.5;
      case 'MINE': return C.MINE_DRIFT;
      // a charger that has committed covers ground faster than anything else in the sky
      case 'CHARGER': return e.charge > 0 ? e.speed * 0.25 : e.speed * C.CHARGE_SPEED;
      case 'HEALER': return e.speed * 0.6;
      default: return e.speed;
    }
  }

  class SkyWorld {
    constructor(seed) {
      this.seed = seed || 1; this.level = 1; this.bestLevel = 0; this.state = State.READY;
      this.score = 0; this.kills = 0; this.playerX = 0; this.playerY = C.PLAYER_Y;
      this.hp = C.MAX_HP; this.bombs = C.START_BOMBS;
      this.shield = false; this.rapidTimer = 0; this.spread = 1; this.mercy = 0; this.flash = 0;
      this.combo = 0; this.comboTimer = 0; this.bestCombo = 0; this.continues = C.MAX_CONTINUES;
      this.stageHits = 0; this.stageBestCombo = 0;
      this.boons = {}; this.offered = [];
      this.wingmen = 0; this.pierceTimer = 0; this.homingTimer = 0; this.magnetTimer = 0; this.charm = false;
      this.slowTimer = 0; this.orbs = 0; this.orbitPhase = 0; this.vampTimer = 0; this.vampCount = 0;
      this.enemies = []; this.pendingSpawns = []; this.shots = []; this.items = []; this.flares = []; this.boss = null;
      this.events = []; this.gust = 0;
      this.ai = false; this.aiDelay = 0; this.aiLastState = State.READY;
      // worked out once a frame rather than once per candidate square: aiCost runs thirteen times
      this.aiPick = null; this.aiDrift = 0;
      // it flies on a stick rather than by teleporting a step at a time
      this.aiVx = 0; this.aiVy = 0;
    }
    startLevel(level) {
      this.level = level;
      this.r = rng(this.seed * 7919 + level * 104729);
      this.sr = rng(this.seed * 31 + level * 17);
      const p = profileOf(level);
      this.enemies = []; this.pendingSpawns = []; this.shots = []; this.items = []; this.flares = []; this.events = []; this.boss = null;
      this.playerX = 0; this.playerY = C.PLAYER_Y;
      this.hp = this.maxHp(); this.bombs = this.startBombs(); this.shield = false;
      this.rapidTimer = 0; this.spread = this.startSpread(); this.mercy = 0; this.flash = 0;
      this.wingmen = this.startWingmen(); this.pierceTimer = 0; this.homingTimer = 0;
      this.magnetTimer = 0; this.charm = this.boonLevel('CHARMED') > 0;
      this.slowTimer = 0; this.orbs = 0; this.orbitPhase = 0; this.vampTimer = 0; this.vampCount = 0;
      this.combo = 0; this.comboTimer = 0;
      this.stageHits = 0; this.stageBestCombo = 0;
      this.fireAcc = 0; this.elapsed = 0; this.waveIndex = 0; this.totalWaves = p.waves; this.nextWaveAt = 0.8;
      // one scripted surge halfway through, so the stage is not a metronome all the way down
      this.rushAt = Math.floor(p.waves / 2); this.rushDone = false;
      this.offered = [];
      this.gust = 0; this.nextFlareAt = C.FLARE_GAP;
      this.state = State.RUNNING;
    }
    /**
     * A brand new run. Everything a run accumulates resets here and nowhere else, so a stage
     * change or a continue carries the score, the kill count and the best chain with it.
     */
    start() {
      this.score = 0;
      this.kills = 0;
      this.bestCombo = 0;
      this.continues = C.MAX_CONTINUES;
      this.boons = {};
      this.offered = [];
      this.startLevel(1);
    }

    boonLevel(id) { return this.boons[id] || 0; }
    // What the boons add up to. Everything that reads a starting value reads one of these.
    maxHp() { return C.MAX_HP + this.boonLevel('ARMOUR'); }
    startBombs() { return C.START_BOMBS + this.boonLevel('BOMBS'); }
    startSpread() { return Math.min(C.MAX_SPREAD, 1 + this.boonLevel('GUNS')); }
    startWingmen() { return Math.min(C.MAX_WINGMEN, this.boonLevel('ESCORT')); }
    fireRate() { return C.BASE_FIRE_RATE * (1 + C.RAPIDFIRE_STEP * this.boonLevel('RAPIDFIRE')); }
    comboWindow() { return C.COMBO_WINDOW + C.CHAINWINDOW_STEP * this.boonLevel('CHAINWINDOW'); }
    maxComboMult() { return C.MAX_COMBO_MULT + C.CHAINCAP_STEP * this.boonLevel('CHAINCAP'); }
    basePierce() { return this.boonLevel('PIERCING'); }
    itemChance() { return C.ITEM_CHANCE * (1 + C.SUPPLY_STEP * this.boonLevel('SUPPLY')); }
    /** Agility buys sky, but never past the floor: a free ram is a promise boons do not break. */
    frontLimit() { return Math.max(C.FRONT_FLOOR, C.PLAYER_Y_MIN - C.AGILITY_STEP * this.boonLevel('AGILITY')); }
    standingPull() { return C.MAGNETIC_STEP * this.boonLevel('MAGNETIC'); }

    /** Lays out three to pick between, skipping anything already at its ceiling. */
    offerBoons() {
      const pool = BOONS.filter(b => this.boonLevel(b.id) < b.cap);
      const picks = [];
      while (picks.length < C.BOONS_OFFERED && pool.length) {
        picks.push(pool.splice(Math.floor(this.r() * pool.length), 1)[0].id);
      }
      this.offered = picks;
    }

    /** Takes the boon at `index` and flies on. False when there is nothing there to take. */
    takeBoon(index) {
      if (this.state !== State.LEVEL_CLEAR || index < 0 || index >= this.offered.length) return false;
      const id = this.offered[index];
      this.boons[id] = this.boonLevel(id) + 1;
      this.events.push({ t: 'BOON_TAKEN', x: 0, y: 0, value: id });
      this.offered = [];
      this.nextLevel();
      return true;
    }

    /**
     * Picks the run back up on the stage you fell on, with a fresh aircraft. The score and the
     * kills stay -- you are continuing, not starting over -- and you only get MAX_CONTINUES of
     * them, so the run still has an end.
     */
    continueRun() {
      if (this.state !== State.GAME_OVER || this.continues <= 0) return false;
      this.continues--;
      this.startLevel(this.level);
      return true;
    }
    nextLevel() { this.startLevel(this.level + 1); }
    // ---- flying itself ------------------------------------------------------------------

    /** Hands the aircraft to the autopilot, or takes it back. */
    setAi(on) {
      this.ai = on;
      // switched on over a panel, it still reads the panel before it acts
      this.aiDelay = this.state === State.RUNNING ? 0 : C.AI_PAUSE;
      this.aiLastState = this.state;
      // it takes the stick as it finds it, not where it last left it
      this.aiVx = 0; this.aiVy = 0;
    }

    /**
     * One tick of flying itself. Called before update(), and it drives the whole run: it starts
     * a stage, flies it, picks a boon at the end of one, and picks the run back up when it falls.
     */
    aiTick(dt) {
      if (!this.ai) return;
      if (this.state !== this.aiLastState) {
        this.aiLastState = this.state;
        // a beat on each panel, so a watcher can read what just happened
        this.aiDelay = this.state === State.RUNNING ? 0 : C.AI_PAUSE;
      }
      this.aiDelay = Math.max(0, this.aiDelay - dt);
      if (this.state === State.RUNNING) { this.flyAutopilot(Math.min(0.05, Math.max(0, dt))); return; }
      this.aiVx = 0; this.aiVy = 0;
      if (this.aiDelay > 0) return;
      if (this.state === State.READY) this.start();
      else if (this.state === State.LEVEL_CLEAR) { if (!this.takeBoon(this.bestBoonIndex())) this.nextLevel(); }
      else if (this.state === State.GAME_OVER) { if (!this.continueRun()) this.start(); }
    }

    /**
     * Scores a ring of places it could be in a moment and steps towards the best one. Sampling
     * beats steering rules here: it dodges a curtain and a diver with the same code, and it never
     * argues with itself about which threat to run from.
     */
    flyAutopilot(dt) {
      this.aiPick = this.aiTarget();
      this.aiDrift = this.bossDriftX();
      // the crosswind is going to push it before the next frame, so plan from where it lands
      const drift = this.gust * dt;
      const hereCost = this.aiCost(this.playerX + drift, this.playerY);
      let bestCost = hereCost;
      let bestX = this.playerX, bestY = this.playerY;
      for (let i = 0; i < AI_SAMPLES.length; i += 2) {
        const cx = Math.max(-C.PLAYER_LIMIT, Math.min(C.PLAYER_LIMIT, this.playerX + AI_SAMPLES[i] * C.AI_REACH + drift));
        const cy = Math.max(this.frontLimit(), Math.min(C.PLAYER_Y_MAX, this.playerY + AI_SAMPLES[i + 1] * C.AI_REACH));
        const cost = this.aiCost(cx, cy);
        if (cost < bestCost) { bestCost = cost; bestX = cx; bestY = cy; }
      }
      // How hard it wants to be going, not where it wants to be next frame. Moving the whole
      // step the moment a square scores better and none of it otherwise is what made it flick
      // between frozen and flat out; a stick it has to lean on has to be eased off too, which is
      // also what gives the aircraft something to bank into. A pilot with room cruises and a
      // pilot about to be hit yanks the stick, so how sharply it may move is how badly it needs to.
      const wantVx = Math.max(-1, Math.min(1, (bestX - this.playerX) / C.AI_REACH)) * C.AI_SPEED;
      const wantVy = Math.max(-1, Math.min(1, (bestY - this.playerY) / C.AI_REACH)) * C.AI_SPEED;
      const urgency = Math.min(1, this.aiPress() / C.AI_BOMB_AT);
      const ease = Math.min(1, dt * (C.AI_AGILITY + urgency * C.AI_URGENT));
      this.aiVx += (wantVx - this.aiVx) * ease;
      this.aiVy += (wantVy - this.aiVy) * ease;
      const wasX = this.playerX, wasY = this.playerY;
      this.movePlayerBy(this.aiVx * dt, this.aiVy * dt);
      // it has run into the edge of the band: stop leaning on a stick that is doing nothing
      if (Math.abs(this.playerX - wasX) < Math.abs(this.aiVx * dt) * 0.5) this.aiVx = 0;
      if (Math.abs(this.playerY - wasY) < Math.abs(this.aiVy * dt) * 0.5) this.aiVy = 0;
      // a bomb when there is nowhere good left to stand, and sooner on the last of the hull
      const patience = this.hp <= 1 ? C.AI_BOMB_AT * 0.45 : C.AI_BOMB_AT;
      if (this.bombs > 0 && this.mercy <= 0 && bestCost > patience) this.useBomb();
    }

    /**
     * What it would cost to be at (x, y). Staying alive is worth orders of magnitude more than
     * lining up a shot, so danger is squared and heavy and everything else only breaks ties.
     */
    aiCost(x, y) {
      // while the hull is still flashing nothing can touch it, so it may cross a curtain to
      // pick something up rather than cower through the one window it has
      const exposure = this.mercy > C.AI_MERCY_TRUST ? C.AI_MERCY_DISCOUNT : 1;
      let danger = 0;
      // incoming fire, at its closest approach rather than sampled: a round moving half a screen
      // a second steps straight through any sampling coarse enough to be affordable
      for (const s of this.shots) {
        if (s.fromPlayer || !s.alive) continue;
        danger += bite(s.x - x, s.y - y, s.vx, s.vy, C.AI_SHOT_CLEAR, C.AI_SHOT_WEIGHT);
      }
      // and anything solid, each kind projected the way it actually flies
      for (const e of this.enemies) {
        if (!e.alive) continue;
        danger += bite(e.x - x, e.y - y, 0, aiSpeedY(e), C.AI_BODY_CLEAR + halfOf(e.kind), C.AI_BODY_WEIGHT);
      }
      // the fields burn upward, and a column you have not looked for is a column you fly into
      for (const f of this.flares) {
        // a spent column is dropped from the list outright, so life is the only liveness there is
        if (f.life <= C.FLARE_LIFE * 0.25) continue;
        danger += bite(f.x - x, f.y - y, 0, -C.FLARE_RISE, C.AI_FLARE_CLEAR, C.AI_FLARE_WEIGHT);
      }
      const b = this.boss;
      if (b && b.alive) {
        const clear = C.BOSS_HALF + C.AI_BODY_CLEAR;
        const gap = Math.max(Math.abs(b.x - x), Math.abs(b.y - y));
        if (gap < clear) { const nip = 1 - gap / clear; danger += nip * nip * C.AI_BODY_WEIGHT; }
      }
      // the edges are a trap: nowhere to run once you are in one
      const edge = C.PLAYER_LIMIT - Math.abs(x);
      if (edge < C.AI_EDGE_CLEAR) { const nip = 1 - edge / C.AI_EDGE_CLEAR; danger += nip * nip * C.AI_EDGE_WEIGHT; }
      danger *= exposure;

      let pull = 0;
      // pickups are worth going for, and worth more the closer they already are
      for (const item of this.items) {
        if (!item.alive) continue;
        pull -= C.AI_ITEM_WEIGHT / (0.08 + Math.hypot(item.x - x, item.y - y));
      }
      const target = this.aiPick;
      if (target) {
        // rounds take time to arrive and everything worth shooting is moving, so it stands where
        // the target is going to be, not where it is
        const flight = Math.max(0, y - target.y) / C.SHOT_SPEED;
        // a shielder's plate means lining up on its nose is the one place that does nothing
        const nose = target.kind === 'SHIELDER' ? halfOf(target.kind) * 0.8 : 0;
        pull += offAim(Math.abs(target.x + nose - x) + flight * C.AI_LEAD_SLACK);
        pull += (C.PLAYER_Y_MAX - y) * C.AI_REAR_WEIGHT;
      } else if (b && b.alive) {
        // the raider sweeps, and fast: aim off it by however far it travels while the round is
        // in the air, and close the range so that lead is a guess worth making
        const flight = Math.max(0, y - b.y) / C.SHOT_SPEED;
        pull += offAim(Math.abs(b.x + this.aiDrift * flight - x));
        pull += (y - this.frontLimit()) * C.AI_RANGE_WEIGHT;
      } else {
        pull += (C.PLAYER_Y_MAX - y) * C.AI_REAR_WEIGHT;
      }
      return danger + pull;
    }

    /**
     * What is about to be on top of it, as opposed to what it is planning around. It plans a
     * second ahead, and yanking the stick for a round that will only graze it in a second looks
     * like the aircraft bolting at nothing: from outside there is no reason for it yet. This is
     * the same sum over a horizon short enough that whatever set it off is plainly there.
     */
    aiPress() {
      if (this.mercy > C.AI_MERCY_TRUST) return 0;
      let d = 0;
      for (const s of this.shots) {
        if (s.fromPlayer || !s.alive) continue;
        d += bite(s.x - this.playerX, s.y - this.playerY, s.vx, s.vy, C.AI_SHOT_CLEAR, C.AI_SHOT_WEIGHT, C.AI_PRESS);
      }
      for (const e of this.enemies) {
        if (!e.alive) continue;
        d += bite(e.x - this.playerX, e.y - this.playerY, 0, aiSpeedY(e),
          C.AI_BODY_CLEAR + halfOf(e.kind), C.AI_BODY_WEIGHT, C.AI_PRESS);
      }
      for (const f of this.flares) {
        if (f.life <= C.FLARE_LIFE * 0.25) continue;
        d += bite(f.x - this.playerX, f.y - this.playerY, 0, -C.FLARE_RISE, C.AI_FLARE_CLEAR, C.AI_FLARE_WEIGHT, C.AI_PRESS);
      }
      return d;
    }

    /** How fast the raider is sliding sideways right now, straight off its own sweep. */
    bossDriftX() {
      const b = this.boss;
      if (!b || !b.engaged) return 0;
      const kindly = bossProfileOf(b.kind);
      const rate = C.BOSS_PHASE_SWEEP[b.phase] * kindly.sweepRate * C.BOSS_SWEEP_RATE;
      return Math.cos(b.sweep * C.BOSS_SWEEP_RATE) * C.BOSS_SWEEP_X * C.BOSS_PHASE_REACH[b.phase] * kindly.reach * rate;
    }

    /**
     * What it would rather be shooting: the things that get worse if you leave them. Once the
     * raider is on station it is the only thing on the board worth the time, and anything else
     * in the air is something to fly around rather than something to chase.
     */
    aiTarget() {
      const b = this.boss;
      if (b && b.alive && b.engaged) {
        // except a healer, which will keep putting back whatever else is in the air
        for (const e of this.enemies) if (e.alive && e.kind === 'HEALER') return e;
        return null;
      }
      let best = null, bestRank = -1e9;
      for (const e of this.enemies) {
        if (!e.alive || e.kind === 'MINE') continue;
        // and among equals, whatever is closest to the floor
        const rank = (AI_TARGET_RANK[e.kind] || 100) + Math.floor(e.y * 60);
        if (rank > bestRank) { bestRank = rank; best = e; }
      }
      return best;
    }

    /** Which of the three on offer it wants most. */
    bestBoonIndex() {
      let bestAt = 0, bestRank = -1e9;
      this.offered.forEach((id, i) => {
        const at = AI_BOON_ORDER.indexOf(id);
        const rank = at < 0 ? 0 : AI_BOON_ORDER.length - at;
        if (rank > bestRank) { bestRank = rank; bestAt = i; }
      });
      return bestAt;
    }

    movePlayerBy(dx, dy = 0) {
      this.playerX = Math.max(-C.PLAYER_LIMIT, Math.min(C.PLAYER_LIMIT, this.playerX + dx));
      this.playerY = Math.max(this.frontLimit(), Math.min(C.PLAYER_Y_MAX, this.playerY + dy));
    }

    useBomb() {
      if (this.state !== State.RUNNING || this.bombs <= 0) return false;
      this.bombs--;
      this.events.push({ t: 'BOMB', x: this.playerX, y: this.playerY });
      // iterate a copy: splitting adds to the list while we are walking it
      for (const e of this.enemies.slice()) {
        if (!e.alive) continue;
        e.alive = false;
        this.awardKill(e.kind, e.x, e.y);
        if (e.kind === 'SPLITTER') this.splitInTwo(e);
      }
      for (const s of this.shots) if (!s.fromPlayer) s.alive = false;
      if (this.boss && this.boss.alive) this.damageBoss(this.boss, Math.max(1, Math.floor(this.boss.max * C.BOMB_BOSS_RATIO)));
      return true;
    }

    update(dtSeconds) {
      if (this.state !== State.RUNNING) return;
      const dt = Math.min(C.MAX_FRAME_DT, Math.max(0, dtSeconds));
      this.elapsed += dt;
      this.flash = Math.max(0, this.flash - dt);
      this.mercy = Math.max(0, this.mercy - dt);
      this.rapidTimer = Math.max(0, this.rapidTimer - dt);
      this.pierceTimer = Math.max(0, this.pierceTimer - dt);
      this.homingTimer = Math.max(0, this.homingTimer - dt);
      this.magnetTimer = Math.max(0, this.magnetTimer - dt);
      this.slowTimer = Math.max(0, this.slowTimer - dt);
      this.vampTimer = Math.max(0, this.vampTimer - dt);
      if (this.orbs > 0) this.orbitPhase = (this.orbitPhase + C.ORBIT_RATE * dt) % C.TAU;
      this.updateHazard(dt);
      this.updateCombo(dt);
      this.spawnWaves();
      this.updateEnemies(dt);
      this.updateBoss(dt);
      this.updateFire(dt);
      this.updateShots(dt);
      this.updateItems(dt);
      this.checkEnd();
    }

    /** The place itself, acting on you: the pass blows you sideways, the fields burn upward. */
    updateHazard(dt) {
      const p = profileOf(this.level);
      this.gust = p.hazard === 'GUSTS' ? Math.sin(this.elapsed * C.GUST_RATE) * C.GUST_STRENGTH : 0;
      if (this.gust !== 0) this.movePlayerBy(this.gust * dt);

      if (p.hazard === 'FLAK') {
        this.nextFlareAt -= dt;
        if (this.nextFlareAt <= 0) {
          this.nextFlareAt = C.FLARE_GAP * (0.7 + this.r() * 0.7);
          this.flares.push({ x: -0.8 + this.r() * 1.6, y: 1.05, life: C.FLARE_LIFE,
            max: C.FLARE_LIFE, phase: this.r() * C.TAU });
        }
      }
      for (let i = this.flares.length - 1; i >= 0; i--) {
        const f = this.flares[i];
        f.life -= dt; f.y -= C.FLARE_RISE * dt;
        if (f.life <= 0 || f.y < -0.2) { this.flares.splice(i, 1); continue; }
        // only the body of the column bites, not its fading tail
        if (f.life > C.FLARE_LIFE * 0.25 && this.hitsPlayer(f.x, f.y, C.FLARE_HALF)) {
          this.hurt(C.RAM_DAMAGE, f.x, f.y);
          if (this.state !== State.RUNNING) return;
        }
      }
    }

    /** What a kill is worth right now: one more step of the chain for every COMBO_STEP kills. */
    /**
     * How the stage just flown is graded: 0 is S, 1 is A, and so on. Flying clean is what earns
     * the top of it, and holding a chain through a whole stage is what separates S from A.
     */
    stageRank() {
      if (this.stageHits === 0 && this.stageBestCombo >= C.RANK_S_CHAIN) return 0;
      if (this.stageHits <= 1 && this.stageBestCombo >= C.RANK_A_CHAIN) return 1;
      if (this.stageHits <= 3) return 2;
      return 3;
    }

    comboMultiplier() { return Math.min(this.maxComboMult(), 1 + Math.floor(this.combo / C.COMBO_STEP)); }

    /** Banks a kill, extends the chain, and pays out at the chain's rate. */
    awardKill(kind, x, y) {
      this.kills++;
      this.combo++;
      this.comboTimer = this.comboWindow();
      this.bestCombo = Math.max(this.bestCombo, this.combo);
      this.stageBestCombo = Math.max(this.stageBestCombo, this.combo);
      const mult = this.comboMultiplier();
      this.score += scoreFor(kind) * mult;
      if (this.vampTimer > 0 && this.hp < this.maxHp()) {
        this.vampCount++;
        if (this.vampCount >= C.VAMP_KILLS) {
          this.vampCount = 0;
          this.hp = Math.min(this.maxHp(), this.hp + 1);
          this.events.push({ t: 'VAMP_HEAL', x, y });
        }
      }
      this.events.push({ t: 'KILL_ENEMY', x, y, value: mult });
      // the chain announces itself only when it actually steps up
      if (this.combo % C.COMBO_STEP === 0 && mult <= this.maxComboMult()) {
        this.events.push({ t: 'COMBO_UP', x, y, value: mult });
      }
    }

    updateCombo(dt) {
      if (this.combo === 0) return;
      this.comboTimer = Math.max(0, this.comboTimer - dt);
      if (this.comboTimer > 0) return;
      const lost = this.combo;
      this.combo = 0;
      if (lost >= C.COMBO_STEP) {
        this.events.push({ t: 'COMBO_LOST', x: this.playerX, y: this.playerY, value: lost });
      }
    }

    spawnWaves() {
      if (this.waveIndex >= this.totalWaves || this.elapsed < this.nextWaveAt) return;
      const p = profileOf(this.level);
      // Halfway down the stage everything arrives at once: three formations of different kinds,
      // a third faster, stacked back to back. It is the one place a chain can really run, and
      // the one place the stage stops feeling like a metronome.
      if (!this.rushDone && this.waveIndex >= this.rushAt) {
        this.rushDone = true;
        for (let i = 0; i < C.RUSH_FORMATIONS; i++) {
          const kind = p.mix[Math.floor(this.r() * p.mix.length) % p.mix.length];
          this.spawnFormation(p, kind,
            p.formations[Math.floor(this.r() * p.formations.length) % p.formations.length],
            Math.max(2, this.flightSize(kind) - 1),
            -0.5 + this.r() * 1.0,
            p.speed * C.RUSH_SPEED,
            i * C.RUSH_STACK);
        }
        this.waveIndex++;
        this.nextWaveAt = this.elapsed + C.WAVE_GAP * 1.6;
        this.events.push({ t: 'RUSH' });
        return;
      }
      const kind = p.mix[Math.floor(this.r() * p.mix.length) % p.mix.length];
      this.spawnFormation(p, kind,
        p.formations[Math.floor(this.r() * p.formations.length) % p.formations.length],
        this.flightSize(kind),
        -0.62 + this.r() * 1.24,
        p.speed * (0.85 + this.r() * 0.3),
        0);
      this.waveIndex++;
      this.nextWaveAt = this.elapsed + C.WAVE_GAP * (0.8 + this.r() * 0.5);
    }

    /** How many of `kind` fly together: a swarm is a crowd, a shielder comes in twos. */
    flightSize(kind) {
      if (kind === 'SWARM') return 7 + Math.floor(this.r() * 4);
      if (kind === 'SHIELDER' || kind === 'SPLITTER' || kind === 'TURRET' || kind === 'CHARGER') {
        return 2 + Math.floor(this.r() * 2);
      }
      if (kind === 'MINER' || kind === 'HEALER') return 1 + Math.floor(this.r() * 2);   // one is plenty
      if (kind === 'MINE') return 1;
      return 3 + Math.floor(this.r() * 4);
    }

    /** Lays one formation of `n` aircraft out along the top of the screen. */
    spawnFormation(p, kind, formation, n, baseX, speed, extraLead) {
      // a swarm bee always goes down in one; the heavies are worth the extra rounds
      const step = Math.floor((this.level - 1) / 3);
      const hpEach = (kind === 'SWARM' || kind === 'MINE') ? 1
        : (kind === 'SHIELDER' || kind === 'MINER' || kind === 'HEALER') ? 3 + step
        : (kind === 'SPLITTER' || kind === 'TURRET' || kind === 'GUNNER' || kind === 'CHARGER') ? 2 + step
        : 1 + step;
      for (let i = 0; i < n; i++) {
        const t = n === 1 ? 0.5 : i / (n - 1);
        let spreadX, lead;
        if (formation === 'LINE') { spreadX = (t - 0.5) * 0.72; lead = 0; }
        else if (formation === 'VEE') { spreadX = (t - 0.5) * 0.8; lead = Math.abs(t - 0.5) * 0.34; }
        else if (formation === 'ARC') { spreadX = (t - 0.5) * 0.9; lead = (0.5 - Math.abs(t - 0.5)) * 0.42; }
        else if (formation === 'TRAIL') { spreadX = 0; lead = t * 0.5; }
        else { const side = t < 0.5 ? -1 : 1; spreadX = side * (0.26 + Math.abs(t - 0.5) * 0.7); lead = Math.abs(t - 0.5) * 0.3; }
        const homeX = Math.max(-0.86, Math.min(0.86, baseX + spreadX));
        this.enemies.push(makePlane(kind, homeX, p.entryY - lead - extraLead, hpEach, homeX,
          this.r() * C.TAU, speed));
      }
    }

    updateEnemies(dtRaw) {
      const dt = dtRaw * this.enemyTimeScale();
      const p = profileOf(this.level);
      for (let i = this.enemies.length - 1; i >= 0; i--) {
        const e = this.enemies[i];
        if (!e.alive) { this.enemies.splice(i, 1); continue; }
        e.lastX = e.x;
        if (e.kind === 'DRONE') e.y += e.speed * dt;
        else if (e.kind === 'WEAVER') { e.y += e.speed * 0.92 * dt; e.x = e.homeX + Math.sin(this.elapsed * 2.4 + e.phase) * 0.22; }
        else if (e.kind === 'GUNNER') { e.y += e.speed * 0.62 * dt; e.x = e.homeX + Math.sin(this.elapsed * 1.1 + e.phase) * 0.08; }
        // it accelerates as it comes down, but never backwards: one stacked high enough by a
        // rush used to climb away and leave a stage that could not end
        else if (e.kind === 'DIVER') e.y += e.speed * Math.max(C.DIVE_CRAWL, 1 + (e.y + 0.2) * 1.6) * dt;
        // heavy and slow, with a plate across its nose: you have to come at it from the side
        else if (e.kind === 'SHIELDER') {
          e.y += e.speed * 0.55 * dt;
          e.x = e.homeX + Math.sin(this.elapsed * 0.9 + e.phase) * 0.05;
        }
        // fat, and it does not die all at once
        else if (e.kind === 'SPLITTER') {
          e.y += e.speed * 0.72 * dt;
          e.x = e.homeX + Math.sin(this.elapsed * 1.6 + e.phase) * 0.12;
        }
        // comes in, stops, and makes the sky its own until you deal with it
        else if (e.kind === 'TURRET') {
          if (e.y < C.TURRET_STATION_Y && e.anchor <= 0) {
            e.y += e.speed * 1.3 * dt;
            if (e.y >= C.TURRET_STATION_Y) e.anchor = C.TURRET_SECONDS;
          } else {
            e.anchor -= dt;
            if (e.anchor <= 0) e.y += e.speed * 1.1 * dt;     // gives up and moves on
          }
        }
        // tiny, quick, and never alone
        else if (e.kind === 'SWARM') {
          e.y += e.speed * 1.35 * dt;
          e.x = e.homeX + Math.sin(this.elapsed * 5.2 + e.phase) * 0.09;
        }
        // crosses slowly and leaves things behind it
        else if (e.kind === 'MINER') {
          e.y += e.speed * 0.5 * dt;
          e.x = e.homeX + Math.sin(this.elapsed * 0.7 + e.phase) * 0.28;
          e.charge -= dt;
          if (e.charge <= 0 && e.y > 0.05 && e.y < this.playerY - 0.25) {
            e.charge = C.MINE_GAP * (0.8 + this.sr() * 0.5);
            this.dropMine(e);
          }
        }
        // it hardly moves at all, and it is still there when you come back
        else if (e.kind === 'MINE') {
          e.y += C.MINE_DRIFT * dt;
          e.x = e.homeX + Math.sin(this.elapsed * 1.1 + e.phase) * 0.012;
        }
        // picks a lane, tells you it is coming, then comes
        else if (e.kind === 'CHARGER') {
          if (e.charge > 0) {
            e.charge -= dt;
            e.y += e.speed * 0.25 * dt;
            if (e.charge <= 0) { e.lockX = this.playerX; this.events.push({ t: 'CHARGE', x: e.x, y: e.y }); }
          } else {
            e.y += e.speed * C.CHARGE_SPEED * dt;
            e.x += Math.max(-0.03, Math.min(0.03, (e.lockX - e.x) * C.CHARGE_TRACK * dt));
          }
        }
        // mends whatever you just damaged
        else {
          e.y += e.speed * 0.6 * dt;
          e.x = e.homeX + Math.sin(this.elapsed * 1.3 + e.phase) * 0.16;
          e.charge -= dt;
          if (e.charge <= 0) { e.charge = C.HEAL_GAP; this.mendSomeone(e); }
        }
        e.mended = Math.max(0, e.mended - dt);
        e.bank = Math.max(-1, Math.min(1, (e.x - e.lastX) / Math.max(1e-4, dt) * 0.9));
        if (e.kind === 'GUNNER' || e.kind === 'WEAVER' || e.kind === 'TURRET') {
          e.cooldown -= dt;
          if (e.cooldown <= 0 && e.y > 0.04 && e.y < this.playerY - 0.08) {
            const rate = e.kind === 'TURRET' ? C.TURRET_FIRE : 1;
            e.cooldown = Math.max(0.55, 1.5 - this.level * 0.04) / p.fireRate * rate * (0.7 + this.sr() * 0.7);
            // gunners and turrets lead the player; weavers just spit straight down
            const vx = (e.kind === 'GUNNER' || e.kind === 'TURRET')
              ? Math.max(-0.5, Math.min(0.5, (this.playerX - e.x) * 0.55)) : 0;
            this.shots.push({ x: e.x, y: e.y + 0.04, vx, vy: C.ENEMY_SHOT_SPEED, fromPlayer: false, alive: true, damage: 1 });
            this.events.push({ t: 'ENEMY_SHOT', x: e.x, y: e.y });
          }
        }
        if (e.y > 1.12) { this.enemies.splice(i, 1); continue; }
        if (this.hitsPlayer(e.x, e.y, halfOf(e.kind))) {
          this.enemies.splice(i, 1);
          this.hurt(C.RAM_DAMAGE, e.x, e.y);
          if (this.state !== State.RUNNING) { this.drainSpawns(); return; }
        }
      }
      this.drainSpawns();
    }

    /** A miner lets one go: it sits where it was dropped and waits for you to fly into it. */
    dropMine(e) {
      this.pendingSpawns.push(makePlane('MINE', e.x, e.y + 0.05, 1, e.x, this.r() * C.TAU, 0));
      this.events.push({ t: 'MINE_LAID', x: e.x, y: e.y + 0.05 });
    }

    /**
     * A healer puts one hit point back into the worst-off aircraft near it. It will not mend
     * itself, so a healer is always the thing to shoot first.
     */
    mendSomeone(healer) {
      let worst = null, worstGap = 0;
      for (const other of this.enemies) {
        if (other === healer || !other.alive || other.kind === 'MINE') continue;
        const gap = other.max - other.hp;
        if (gap <= 0) continue;
        const dx = other.x - healer.x, dy = other.y - healer.y;
        if (dx * dx + dy * dy > C.HEAL_RADIUS * C.HEAL_RADIUS) continue;
        if (gap > worstGap) { worstGap = gap; worst = other; }
      }
      if (!worst) return;
      worst.hp = Math.min(worst.max, worst.hp + 1);
      worst.mended = C.HEAL_FLASH;
      this.events.push({ t: 'HEAL', x: worst.x, y: worst.y });
    }

    spawnBoss() {
      const p = profileOf(this.level);
      const kind = (this.level - 1) % C.BOSS_KINDS;
      const hp = Math.max(30, Math.floor(
        C.BOSS_BASE_HP * p.bossHp * bossProfileOf(kind).hp * (1 + (this.level - 1) * 0.45)));
      this.boss = { kind, x: 0, y: -0.25, hp, max: hp, alive: true,
        engaged: false, bank: 0, salvo: 0, sweep: 0,
        dying: 0, roll: 0, driftX: 0, nextBreakAt: 0, breaks: 0, finished: false,
        phase: 0, rage: 0, spin: 0, burst: 0, wallGap: 0 };
      this.events.push({ t: 'BOSS_IN', x: 0, y: 0, value: kind });
    }

    updateBoss(dtRaw) {
      const dt = dtRaw * this.enemyTimeScale();
      const b = this.boss;
      if (!b) return;
      if (!b.alive) { this.updateWreck(b, dt); return; }
      const lastX = b.x;
      if (!b.engaged) {
        b.y = Math.min(C.BOSS_STATION_Y, b.y + C.BOSS_ENTRY_SPEED * dt);
        if (b.y >= C.BOSS_STATION_Y - 1e-4) b.engaged = true;
      } else {
        b.rage = Math.max(0, b.rage - dt);
        // each phase sweeps faster and wider, and leans on the salvo harder
        const kindly = bossProfileOf(b.kind);
        b.sweep += dt * C.BOSS_PHASE_SWEEP[b.phase] * kindly.sweepRate;
        b.x = Math.sin(b.sweep * C.BOSS_SWEEP_RATE) * C.BOSS_SWEEP_X * C.BOSS_PHASE_REACH[b.phase] * kindly.reach;
        b.salvo -= dt;
        if (b.salvo <= 0) {
          // a burst raider keeps firing until its burst is spent, then takes the long gap
          if (b.burst > 0) {
            b.burst--;
            b.salvo = C.BURST_GAP;
          } else {
            b.salvo = Math.max(0.32,
              (C.BOSS_SALVO_GAP - this.level * 0.03) * C.BOSS_PHASE_GAP[b.phase] * kindly.gap);
            if (kindly.style === 'BURST') b.burst = C.BURST_SHOTS - 1;
          }
          this.fireBossSalvo(b);
        }
      }
      b.bank = Math.max(-1, Math.min(1, (b.x - lastX) / Math.max(1e-4, dt) * 1.4));
      if (this.hitsPlayer(b.x, b.y, C.BOSS_HALF)) this.hurt(C.RAM_DAMAGE, b.x, b.y);
    }

    fireBossSalvo(b) {
      const kindly = bossProfileOf(b.kind);
      const step = b.phase;                           // every phase adds one more of everything
      const push = (vx, vy, y) => this.shots.push(
        { x: b.x, y: y === undefined ? b.y + 0.08 : y, vx, vy, fromPlayer: false, alive: true, damage: 1 });
      if (kindly.style === 'FAN') {
        // the plain wide fan: slip between the arms
        this.bossFan(b, 3 + Math.min(4, this.level - 1) + step, C.BOSS_FAN);
      } else if (kindly.style === 'BURST') {
        // three quick ones, tight, then it has to breathe
        this.bossFan(b, 3 + step, C.BOSS_FAN * 0.55);
      } else if (kindly.style === 'WALL') {
        // a curtain the width of the sky, with one gap that walks along it
        const slots = C.WALL_SLOTS + step;
        b.wallGap = (b.wallGap + 1 + step) % slots;
        for (let i = 0; i < slots; i++) {
          if (i === b.wallGap || i === (b.wallGap + 1) % slots) continue;
          const x = -C.WALL_REACH + 2 * C.WALL_REACH * (i / (slots - 1));
          this.shots.push({ x, y: b.y + 0.08, vx: 0, vy: C.ENEMY_SHOT_SPEED * 0.8,
            fromPlayer: false, alive: true, damage: 1 });
        }
      } else if (kindly.style === 'DAGGER') {
        // a narrow spike, from a hull that will not hold still
        this.bossFan(b, 2 + step, C.BOSS_FAN * 0.3);
      } else if (kindly.style === 'COLUMN') {
        // it owns the ground under it: a tight column, one shot behind the next
        for (let i = 0; i < C.COLUMN_SHOTS + step; i++) {
          push(0, C.ENEMY_SHOT_SPEED * 1.15, b.y + 0.08 + i * 0.07);
        }
      } else {
        // an even ring, turned a little further each time, so the gap keeps moving
        b.spin += C.BOSS_SPIN_STEP;
        const arms = C.BOSS_SPIRAL_ARMS + step;
        for (let i = 0; i < arms; i++) {
          const ang = b.spin + i * (C.TAU / arms);
          push(Math.sin(ang) * C.ENEMY_SHOT_SPEED, Math.abs(Math.cos(ang)) * C.ENEMY_SHOT_SPEED);
        }
      }
      // From phase 1 every raider also picks you out of its own pattern.
      if (b.phase >= 1) {
        const dx = this.playerX - b.x, dy = Math.max(0.15, this.playerY - b.y);
        const len = Math.hypot(dx, dy);
        push(dx / len * C.BOSS_AIMED_SPEED, dy / len * C.BOSS_AIMED_SPEED);
      }
      this.events.push({ t: 'ENEMY_SHOT', x: b.x, y: b.y });
    }

    /** `arms` shots spread evenly across `width` radians, aimed down the screen. */
    bossFan(b, arms, width) {
      for (let i = 0; i < arms; i++) {
        const t = arms === 1 ? 0.5 : i / (arms - 1);
        const ang = (t - 0.5) * width;
        this.shots.push({ x: b.x, y: b.y + 0.08, vx: Math.sin(ang) * C.ENEMY_SHOT_SPEED,
          vy: Math.cos(ang) * C.ENEMY_SHOT_SPEED, fromPlayer: false, alive: true, damage: 1 });
      }
    }

    damageBoss(b, amount) {
      b.hp = Math.max(0, b.hp - amount);
      if (b.hp > 0) {
        // it changes its mind twice on the way down
        const left = b.hp / Math.max(1, b.max);
        const want = left <= C.BOSS_PHASE_3 ? 2 : left <= C.BOSS_PHASE_2 ? 1 : 0;
        if (want > b.phase) {
          b.phase = want;
          b.rage = C.BOSS_RAGE_SECONDS;
          b.salvo = Math.max(b.salvo, C.BOSS_RAGE_SECONDS * 0.7);   // one beat to read the change
          this.events.push({ t: 'BOSS_PHASE', x: b.x, y: b.y, value: b.phase });
        }
        return;
      }
      b.alive = false; this.kills++; this.score += C.BOSS_SCORE * this.level;
      // it stops flying here: nose over, roll, and slide out of its own wake
      b.dying = C.BOSS_DEATH_SECONDS;
      b.driftX = b.x >= 0 ? -C.BOSS_DRIFT : C.BOSS_DRIFT;
      b.nextBreakAt = C.BOSS_DEATH_SECONDS - C.BOSS_BREAK_GAP * 0.35;
      b.breaks = 0;
      b.finished = false;
      // the sky clears with it: nothing already in the air may still kill you now
      for (const s of this.shots) if (!s.fromPlayer) s.alive = false;
      this.events.push({ t: 'BOSS_DOWN', x: b.x, y: b.y, value: b.kind });
    }

    /**
     * The wreck. It falls, rolls, and lets go of a run of explosions that walk along the hull
     * rather than piling up in one place, and only then does the stage end.
     */
    updateWreck(b, dt) {
      if (b.dying <= 0) return;
      b.dying = Math.max(0, b.dying - dt);
      b.y += C.BOSS_SINK * dt;
      b.x += b.driftX * dt;
      b.roll += C.BOSS_ROLL * dt;
      while (b.breaks < C.BOSS_BREAKS && b.dying <= b.nextBreakAt) {
        b.breaks++;
        b.nextBreakAt -= C.BOSS_BREAK_GAP;
        const ox = (this.r() - 0.5) * C.BOSS_HALF * 1.6;
        const oy = (this.r() - 0.5) * C.BOSS_HALF * 0.9;
        this.events.push({ t: 'BOSS_BREAK', x: b.x + ox, y: b.y + oy,
          value: Math.floor((b.breaks * 100) / C.BOSS_BREAKS) });
      }
      // The last blast takes the hull with it, and then the sky gets a beat to itself before
      // the clear panel comes up -- otherwise the finale is a frame long and you miss it.
      if (b.dying <= C.BOSS_AFTERGLOW && !b.finished) {
        b.finished = true;
        this.events.push({ t: 'KILL_BOSS', x: b.x, y: b.y, value: b.kind });
      }
    }

    updateFire(dt) {
      const rate = this.fireRate() * (this.rapidTimer > 0 ? C.RAPID_MULT : 1);
      this.fireAcc += rate * dt;
      while (this.fireAcc >= 1) {
        this.fireAcc -= 1;
        for (let i = 0; i < this.spread; i++) {
          const off = this.spread === 1 ? 0 : (i / (this.spread - 1) - 0.5);
          this.addPlayerShot(this.playerX + off * 0.09, this.playerY - 0.05, off * 0.35);
        }
        // the escorts fire straight ahead from where they are sitting
        for (let i = 0; i < this.wingmen; i++) {
          this.addPlayerShot(this.wingmanX(i), this.wingmanY(), 0);
        }
        this.events.push({ t: 'SHOT', x: this.playerX, y: this.playerY - 0.05 });
      }
    }

    /** How fast the world coming at you is allowed to move right now. */
    enemyTimeScale() { return this.slowTimer > 0 ? C.SLOW_FACTOR : 1; }

    /** Where orb `index` is sitting, so the view can draw it. */
    orbX(i) { return this.playerX + Math.cos(this.orbitPhase + i * (C.TAU / Math.max(1, this.orbs))) * C.ORBIT_R; }
    orbY(i) { return this.playerY + Math.sin(this.orbitPhase + i * (C.TAU / Math.max(1, this.orbs))) * C.ORBIT_R * 0.72; }

    /** Whether an incoming round has run into one of the orbs circling the aircraft. */
    blockedByOrb(s) {
      for (let i = 0; i < this.orbs; i++) {
        const dx = s.x - this.orbX(i), dy = s.y - this.orbY(i);
        if (dx * dx + dy * dy < (C.ORBIT_HALF + C.SHOT_HALF) ** 2) return true;
      }
      return false;
    }

    addPlayerShot(x, y, vx) {
      this.shots.push({ x, y, vx, vy: -C.SHOT_SPEED, fromPlayer: true, alive: true, damage: 1,
        pierce: this.pierceTimer > 0 ? C.PIERCE_HITS : this.basePierce(), lastHit: null });
    }

    /** Where the escort at `index` is sitting right now, so the view can draw it. */
    wingmanX(index) {
      return this.playerX + (index % 2 === 0 ? -1 : 1) * C.WINGMAN_OFFSET * (1 + Math.floor(index / 2));
    }
    wingmanY() { return this.playerY + C.WINGMAN_TRAIL; }

    /** Turns a player shot towards the nearest target, without letting it speed up or slow down. */
    steerHoming(s, dt) {
      let bestX = 0, bestY = 0, bestD = Infinity;
      for (const e of this.enemies) {
        if (!e.alive || e.y > s.y) continue;          // only things still ahead of it
        const d = (e.x - s.x) ** 2 + (e.y - s.y) ** 2;
        if (d < bestD) { bestD = d; bestX = e.x; bestY = e.y; }
      }
      const b = this.boss;
      if (b && b.alive && b.y <= s.y) {
        const d = (b.x - s.x) ** 2 + (b.y - s.y) ** 2;
        if (d < bestD) { bestD = d; bestX = b.x; bestY = b.y; }
      }
      if (bestD === Infinity) return;
      const speed = Math.hypot(s.vx, s.vy);
      if (speed <= 1e-5) return;
      const tx = bestX - s.x, ty = bestY - s.y;
      const tl = Math.hypot(tx, ty);
      if (tl <= 1e-5) return;
      const k = Math.max(0, Math.min(1, C.HOMING_TURN * dt));
      let nx = s.vx / speed * (1 - k) + tx / tl * k;
      let ny = s.vy / speed * (1 - k) + ty / tl * k;
      const nl = Math.hypot(nx, ny);
      if (nl <= 1e-5) return;
      s.vx = nx / nl * speed;
      s.vy = ny / nl * speed;
    }

    hitsPlayer(x, y, half) {
      return this.mercy <= 0 && Math.abs(y - this.playerY) < half + C.PLAYER_HALF_Y && Math.abs(x - this.playerX) < half + C.PLAYER_HALF_X;
    }

    hurt(amount, x, y) {
      if (this.mercy > 0) return;
      // while the raider is coming apart the stage is over; nothing left flying may take it back
      const b = this.boss;
      if (b && !b.alive && b.dying > 0) return;
      if (this.shield) {
        this.shield = false; this.mercy = C.MERCY_SECONDS;
        this.events.push({ t: 'SHIELD_USED', x, y });
        return;
      }
      // the charm eats one chain break; the hit still lands, the chain survives it
      if (this.charm) {
        this.charm = false;
        this.events.push({ t: 'CHARM_USED', x, y, value: this.combo });
      } else {
        if (this.combo >= C.COMBO_STEP) this.events.push({ t: 'COMBO_LOST', x, y, value: this.combo });
        this.combo = 0; this.comboTimer = 0;
      }
      this.stageHits++;
      this.hp -= amount; this.flash = C.FLASH_SECONDS; this.mercy = C.MERCY_SECONDS;
      // an escort is the first thing a hit takes; only once they are gone does it cost a gun
      if (this.wingmen > 0) this.wingmen--; else this.spread = Math.max(1, this.spread - 1);
      this.events.push({ t: 'HIT_PLAYER', x, y });
      if (this.hp <= 0) {
        this.hp = 0; this.state = State.GAME_OVER;
        this.bestLevel = Math.max(this.bestLevel, this.level - 1);
        this.events.push({ t: 'OVER' });
      }
    }

    updateShots(dt) {
      for (let i = this.shots.length - 1; i >= 0; i--) {
        const s = this.shots[i];
        if (!s.alive) { this.shots.splice(i, 1); continue; }
        // your own rounds keep their speed; theirs are what the clock is slowing
        const sdt = s.fromPlayer ? dt : dt * this.enemyTimeScale();
        s.x += s.vx * sdt; s.y += s.vy * sdt;
        if (s.y < -0.15 || s.y > 1.15 || Math.abs(s.x) > 1.2) { this.shots.splice(i, 1); continue; }
        if (s.fromPlayer) {
          if (this.homingTimer > 0) this.steerHoming(s, dt);
          let spent = false;
          for (const e of this.enemies) {
            if (!e.alive || e === s.lastHit) continue;
            const half = halfOf(e.kind);
            if (Math.abs(e.x - s.x) < half && Math.abs(e.y - s.y) < half) {
              // a shielder's plate throws off anything that comes straight at its nose
              if (e.kind === 'SHIELDER' && Math.abs(e.x - s.x) < half * C.SHIELD_ARC) {
                this.shots.splice(i, 1);
                this.events.push({ t: 'DEFLECT', x: s.x, y: s.y });
                break;
              }
              e.hp -= s.damage;
              // a piercing round carries on to whatever is behind it
              if (s.pierce > 0) { s.pierce--; s.lastHit = e; } else spent = true;
              if (e.hp <= 0) {
                e.alive = false;
                this.awardKill(e.kind, e.x, e.y);
                if (e.kind === 'SPLITTER') this.splitInTwo(e);
                this.maybeDrop(e.x, e.y);
              } else this.events.push({ t: 'HIT_ENEMY', x: s.x, y: s.y });
              break;
            }
          }
          const b = this.boss;
          if (!spent && b && b.alive && b !== s.lastHit &&
              Math.abs(b.x - s.x) < C.BOSS_HALF && Math.abs(b.y - s.y) < C.BOSS_HALF) {
            if (s.pierce > 0) { s.pierce--; s.lastHit = b; } else spent = true;
            this.damageBoss(b, s.damage);
            if (b.alive) this.events.push({ t: 'HIT_BOSS', x: s.x, y: s.y });
          }
          if (spent) this.shots.splice(i, 1);
        } else if (this.orbs > 0 && this.blockedByOrb(s)) {
          this.shots.splice(i, 1);
          this.events.push({ t: 'ORBIT_BLOCK', x: s.x, y: s.y });
        } else if (this.hitsPlayer(s.x, s.y, C.SHOT_HALF)) {
          this.shots.splice(i, 1);
          this.hurt(C.SHOT_DAMAGE, s.x, s.y);
          if (this.state !== State.RUNNING) return;
        }
      }
    }

    /** A splitter does not die all at once: two smaller ones peel away from where it was. */
    splitInTwo(e) {
      for (const side of [-1, 1]) {
        const x = Math.max(-0.9, Math.min(0.9, e.x + side * C.SPLIT_SPREAD));
        this.pendingSpawns.push(makePlane('DRONE', x, e.y, 1, x, this.r() * C.TAU, e.speed * 1.15));
      }
      this.events.push({ t: 'SPLIT', x: e.x, y: e.y });
      // the shot loop is not walking the enemy list with an index, so these can land now
      this.drainSpawns();
    }

    drainSpawns() {
      if (!this.pendingSpawns.length) return;
      for (const p of this.pendingSpawns) this.enemies.push(p);
      this.pendingSpawns.length = 0;
    }

    maybeDrop(x, y) {
      if (this.r() >= this.itemChance()) return;
      let roll = this.r() * DROP_WEIGHT_TOTAL;
      let kind = DROP_TABLE[DROP_TABLE.length - 1][0];
      for (const [k, weight] of DROP_TABLE) {
        roll -= weight;
        if (roll < 0) { kind = k; break; }
      }
      this.items.push({ x, y, kind, alive: true });
    }

    updateItems(dt) {
      for (let i = this.items.length - 1; i >= 0; i--) {
        const it = this.items[i];
        const pull = this.magnetTimer > 0 ? C.MAGNET_PULL : this.standingPull();
        if (pull > 0) {
          // reel it in: still falling, but now it is coming to you
          const dx = this.playerX - it.x, dy = this.playerY - it.y;
          const d = Math.hypot(dx, dy);
          if (d > 1e-4) { it.x += dx / d * pull * dt; it.y += dy / d * pull * dt; }
        }
        it.y += C.ITEM_FALL_SPEED * dt;
        if (it.y > 1.1) { this.items.splice(i, 1); continue; }
        if (Math.abs(it.y - this.playerY) < C.ITEM_HALF + C.PLAYER_HALF_Y && Math.abs(it.x - this.playerX) < C.ITEM_HALF + C.PLAYER_HALF_X) {
          this.items.splice(i, 1);
          if (it.kind === 'SPREAD') this.spread = Math.min(C.MAX_SPREAD, this.spread + 1);
          else if (it.kind === 'RAPID') this.rapidTimer = C.RAPID_SECONDS;
          else if (it.kind === 'SHIELD') this.shield = true;
          else if (it.kind === 'BOMB') this.bombs = Math.min(C.MAX_BOMBS, this.bombs + 1);
          else if (it.kind === 'REPAIR') this.hp = Math.min(this.maxHp(), this.hp + 1);
          else if (it.kind === 'WINGMAN') this.wingmen = Math.min(C.MAX_WINGMEN, this.wingmen + 1);
          else if (it.kind === 'PIERCE') this.pierceTimer = C.PIERCE_SECONDS;
          else if (it.kind === 'HOMING') this.homingTimer = C.HOMING_SECONDS;
          else if (it.kind === 'MAGNET') this.magnetTimer = C.MAGNET_SECONDS;
          else if (it.kind === 'CHARM') this.charm = true;
          else if (it.kind === 'SLOW') this.slowTimer = C.SLOW_SECONDS;
          else if (it.kind === 'ORBIT') this.orbs = Math.min(C.MAX_ORBS, this.orbs + 1);
          else if (it.kind === 'VAMPIRE') { this.vampTimer = C.VAMP_SECONDS; this.vampCount = 0; }
          // a medal is worth whatever your chain is paying, so it rewards the run you are having
          else if (it.kind === 'MEDAL') {
            const worth = C.MEDAL_SCORE * this.comboMultiplier();
            this.score += worth;
            this.events.push({ t: 'MEDAL', x: it.x, y: it.y, value: worth });
          }
          this.score += C.ITEM_SCORE;
          this.events.push({ t: 'PICKUP', x: it.x, y: it.y, kind: it.kind });
        }
      }
    }

    checkEnd() {
      const b = this.boss;
      if (!b) {
        if (this.waveIndex >= this.totalWaves && !this.enemies.some(e => e.alive)) this.spawnBoss();
        return;
      }
      if (!b.alive) {
        if (b.dying > 0) return;
        this.offerBoons();
        this.state = State.LEVEL_CLEAR;
        this.bestLevel = Math.max(this.bestLevel, this.level);
        this.score += C.CLEAR_BONUS * this.level;
        this.events.push({ t: 'CLEAR' });
      }
    }
  }

  // ---------- Audio: synthesized with Web Audio, no files ----------
  const audio = { ctx: null, muted: false, last: {}, noise: null };
  try { audio.muted = localStorage.getItem('skystrike.muted') === '1'; } catch (e) {}
  const muteBtn = document.getElementById('mute');
  function renderMute() { muteBtn.textContent = audio.muted ? '🔇' : '🔊'; muteBtn.setAttribute('aria-pressed', audio.muted ? 'true' : 'false'); }
  function toggleMute() { audio.muted = !audio.muted; try { localStorage.setItem('skystrike.muted', audio.muted ? '1' : '0'); } catch (e) {} renderMute(); }
  muteBtn.addEventListener('click', toggleMute); renderMute();
  function ac() {
    if (!audio.ctx) { try { audio.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (audio.ctx.state === 'suspended') audio.ctx.resume();
    return audio.ctx;
  }
  function noiseBuffer(c) {
    if (!audio.noise) { audio.noise = c.createBuffer(1, Math.floor(c.sampleRate * 0.2), c.sampleRate); const d = audio.noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    return audio.noise;
  }
  function tone(c, at, freq, dur, vol, type) {
    const o = c.createOscillator(); o.type = type; o.frequency.value = freq;
    const g = c.createGain(); g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
    o.connect(g).connect(c.destination); o.start(at); o.stop(at + dur + 0.02);
  }
  function play(kind, pitch) {
    if (audio.muted) return; const c = ac(); if (!c) return; const now = c.currentTime;
    const P = Math.max(0.5, Math.min(2, pitch || 1));
    const gate = (key, min) => { if (now - (audio.last[key] || 0) < min) return false; audio.last[key] = now; return true; };
    switch (kind) {
      case 'shot': {
        if (!gate('shot', 0.045)) return;
        const o = c.createOscillator(); o.type = 'square';
        o.frequency.setValueAtTime(900 + Math.random() * 200, now);
        o.frequency.exponentialRampToValueAtTime(260, now + 0.06);
        const g = c.createGain(); g.gain.setValueAtTime(0.13, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        o.connect(g).connect(c.destination); o.start(now); o.stop(now + 0.08);
        break;
      }
      case 'hit': if (gate('hit', 0.035)) tone(c, now, 1400 + Math.random() * 500, 0.03, 0.12, 'square'); break;
      case 'kill': {
        if (!gate('kill', 0.04)) return;
        const src = c.createBufferSource(); src.buffer = noiseBuffer(c);
        const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(1400 * P, now);
        f.frequency.exponentialRampToValueAtTime(300 * P, now + 0.2);
        const g = c.createGain(); g.gain.setValueAtTime(0.3, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        src.connect(f).connect(g).connect(c.destination); src.start(now); src.stop(now + 0.24);
        break;
      }
      case 'hurt': if (gate('hurt', 0.12)) { tone(c, now, 180, 0.25, 0.3, 'sawtooth'); tone(c, now, 90, 0.3, 0.25, 'square'); } break;
      case 'pickup': tone(c, now, 659.25 * P, 0.08, 0.22, 'triangle'); tone(c, now + 0.08, 987.77 * P, 0.18, 0.22, 'triangle'); break;
      case 'boom': {
        const src = c.createBufferSource(); src.buffer = noiseBuffer(c); src.loop = true;
        const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(600, now); f.frequency.exponentialRampToValueAtTime(60, now + 0.6);
        const g = c.createGain(); g.gain.setValueAtTime(0.65, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
        src.connect(f).connect(g).connect(c.destination); src.start(now); src.stop(now + 0.75);
        break;
      }
      case 'roar': {
        const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(70 * P, now); o.frequency.exponentialRampToValueAtTime(48 * P, now + 0.9);
        const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
        const g = c.createGain(); g.gain.setValueAtTime(0.001, now); g.gain.exponentialRampToValueAtTime(0.45, now + 0.08); g.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
        o.connect(f).connect(g).connect(c.destination); o.start(now); o.stop(now + 1.05);
        break;
      }
      case 'clear': [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(c, now + i * 0.13, f, i < 3 ? 0.15 : 0.5, 0.22, 'triangle')); break;
      case 'over': {
        const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(400, now); o.frequency.exponentialRampToValueAtTime(80, now + 0.8);
        const g = c.createGain(); g.gain.setValueAtTime(0.22, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
        o.connect(g).connect(c.destination); o.start(now); o.stop(now + 0.95);
        break;
      }
    }
  }

  // ---------- Effects ----------
  const fx = { particles: [], texts: [], muzzle: 0, shake: 0, flash: 0, flashColor: '#FDE68A', bomb: 0,
               comboPop: 0, banner: '', bannerTimer: 0 };
  function sparks(x, y, n, color, spread, size) {
    size = size || 0.006;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * C.TAU, v = spread * (0.3 + Math.random());
      fx.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 0.3 + Math.random() * 0.35, max: 0.65, color, size: size + Math.random() * size, drag: 2.4 });
    }
  }
  /** Chunks of hull: bigger than a spark, slower, and they keep going instead of stopping. */
  function debris(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * C.TAU, v = 0.18 + Math.random() * 0.3;
      fx.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.05,
        life: 0.8 + Math.random() * 0.7, max: 1.5, color: '#94A3B8',
        size: 0.014 + Math.random() * 0.014, drag: 0.5 });
    }
  }

  function floatText(text, x, y, color) { fx.texts.push({ text, x, y, life: 0.85, max: 0.85, color }); }
  function screenFlash(color, strength) { fx.flash = strength; fx.flashColor = color; }

  function handleEvent(ev) {
    switch (ev.t) {
      case 'SHOT': fx.muzzle = 0.055; play('shot'); break;
      case 'ENEMY_SHOT': play('hit'); break;
      case 'HIT_ENEMY': sparks(ev.x, ev.y, 3, '#FDE68A', 0.22); play('hit'); break;
      case 'KILL_ENEMY': {
        // a kill deeper into a chain throws more and rings higher
        const m = Math.max(1, Math.min(C.MAX_COMBO_MULT, ev.value || 1));
        sparks(ev.x, ev.y, 14 + m * 3, '#FDE68A', 0.5 + m * 0.04, 0.008);
        sparks(ev.x, ev.y, 8, '#94A3B8', 0.3, 0.012);
        fx.shake = Math.max(fx.shake, 0.08); play('kill', 1 + (m - 1) * 0.085); break;
      }
      case 'COMBO_UP':
        fx.comboPop = 1;
        floatText('x' + ev.value, ev.x, ev.y, '#FACC15');
        play('pickup', 1 + ev.value * 0.06); break;
      case 'COMBO_LOST':
        fx.comboPop = 0;
        floatText('연쇄 끊김', ev.x, ev.y - 0.06, '#94A3B8'); break;
      case 'MINE_LAID': play('hit', 0.6); break;
      case 'CHARGE':
        // the moment it commits: you get a beat and a bark
        sparks(ev.x, ev.y, 12, '#F87171', 0.5, 0.01);
        fx.shake = Math.max(fx.shake, 0.14);
        play('roar', 1.7); break;
      case 'HEAL':
        sparks(ev.x, ev.y, 8, '#34D399', 0.28, 0.009);
        play('pickup', 1.5); break;
      case 'ORBIT_BLOCK':
        sparks(ev.x, ev.y, 6, '#22D3EE', 0.3, 0.008);
        play('hit', 1.35); break;
      case 'VAMP_HEAL':
        sparks(ev.x, ev.y, 16, '#34D399', 0.45, 0.011);
        floatText('흡혈', ev.x, ev.y, '#34D399');
        play('pickup', 0.85); break;
      case 'BOON_TAKEN': {
        const b = boonOf(ev.value);
        fx.banner = b ? b.name : '';
        fx.bannerTimer = 1.4;
        play('clear', 1.2); break;
      }
      case 'MEDAL':
        sparks(ev.x, ev.y, 20, '#FACC15', 0.5, 0.012);
        floatText('+' + ev.value, ev.x, ev.y, '#FACC15');
        play('pickup', 1.25); break;
      case 'DEFLECT':
        // a bounce off the plate: hard, bright, and it gets you nothing
        sparks(ev.x, ev.y, 5, '#94A3B8', 0.3, 0.007);
        play('hit', 1.6); break;
      case 'SPLIT':
        sparks(ev.x, ev.y, 14, '#FDE68A', 0.5, 0.01);
        fx.shake = Math.max(fx.shake, 0.12);
        play('kill', 0.75); break;
      case 'CHARM_USED':
        sparks(ev.x, ev.y, 18, '#FACC15', 0.45, 0.01);
        floatText('연쇄 지킴', ev.x, ev.y - 0.05, '#FACC15');
        play('pickup', 0.8); break;
      case 'RUSH':
        fx.banner = '편대 돌입!'; fx.bannerTimer = 1.5;
        fx.shake = Math.max(fx.shake, 0.25); play('roar', 1.35); break;
      case 'BOSS_PHASE':
        fx.banner = '분노'; fx.bannerTimer = 1.2;
        sparks(ev.x, ev.y, 26, '#FCA5A5', 0.7, 0.012);
        fx.shake = Math.max(fx.shake, 0.45); screenFlash('#F87171', 0.3);
        play('roar', 1 + ev.value * 0.14); break;
      case 'HIT_BOSS': sparks(ev.x, ev.y, 3, '#FDE68A', 0.25); play('hit'); break;
      case 'BOSS_DOWN':
        // the moment it stops being an enemy: everything holds still for a beat
        timeScale = HITSTOP_SCALE;
        sparks(ev.x, ev.y, 34, '#FDE68A', 0.75, 0.013);
        sparks(ev.x, ev.y, 14, '#94A3B8', 0.35, 0.022);
        fx.shake = 0.55; screenFlash('#FFFFFF', 0.38);
        play('boom'); break;
      case 'BOSS_BREAK': {
        // each blast walks a little further along the hull and hits a little harder
        const t = (ev.value || 0) / 100;
        sparks(ev.x, ev.y, 10 + Math.floor(t * 14), '#FDE68A', 0.45 + t * 0.35, 0.011);
        sparks(ev.x, ev.y, 6 + Math.floor(t * 8), '#94A3B8', 0.28 + t * 0.2, 0.02);
        debris(ev.x, ev.y, 3 + Math.floor(t * 4));
        fx.shake = Math.max(fx.shake, 0.16 + t * 0.16);
        screenFlash('#FFB454', 0.1 + t * 0.14);
        play('kill'); break;
      }
      case 'KILL_BOSS':
        sparks(ev.x, ev.y, 70, '#FDE68A', 1.1, 0.015);
        sparks(ev.x, ev.y, 36, '#94A3B8', 0.7, 0.022);
        debris(ev.x, ev.y, 16);
        fx.shake = 0.7; screenFlash('#FFFFFF', 0.55);
        floatText(bossProfileOf(ev.value || 0).name + ' 격추!', ev.x, ev.y, '#FACC15');
        play('boom'); break;
      case 'HIT_PLAYER':
        sparks(ev.x, ev.y, 22, '#FCA5A5', 0.55, 0.01);
        fx.shake = Math.max(fx.shake, 0.35); screenFlash('#F87171', 0.4); play('hurt'); break;
      case 'SHIELD_USED': sparks(ev.x, ev.y, 20, '#22D3EE', 0.5); floatText('방어막', ev.x, ev.y, '#22D3EE'); play('pickup'); break;
      case 'PICKUP': floatText(ITEM_LABEL[ev.kind], ev.x, ev.y, '#FACC15'); sparks(ev.x, ev.y, 12, '#FACC15', 0.35); play('pickup'); break;
      case 'BOMB': fx.bomb = 0.45; fx.shake = 0.5; screenFlash('#FFFFFF', 0.55); play('boom'); break;
      case 'BOSS_IN': floatText(bossProfileOf(ev.value || 0).name, 0, 0.3, '#FCA5A5'); fx.shake = 0.5; play('roar'); break;
      case 'CLEAR': play('clear'); break;
      case 'OVER': play('over'); break;
    }
  }

  let smokeTimer = 0;
  function updateWreckSmoke(dt) {
    const b = world.boss;
    // a steady trail off the wreck, so the gaps between blasts are not empty
    if (!b || b.alive || b.dying <= 0) { smokeTimer = 0; return; }
    smokeTimer -= dt;
    while (smokeTimer <= 0) {
      smokeTimer += 0.035;
      const px = b.x + (Math.random() - 0.5) * C.BOSS_HALF;
      const py = b.y + (Math.random() - 0.5) * C.BOSS_HALF * 0.6;
      sparks(px, py, 1, '#94A3B8', 0.12, 0.018);
      if (Math.random() < 0.45) sparks(px, py, 1, '#FFB454', 0.2, 0.009);
    }
  }

  function updatePad(dt) {
    pad.glow = onPad ? Math.min(1, pad.glow + dt * 6) : Math.max(0, pad.glow - dt * 3);
    pad.band = dragging ? Math.min(1, pad.band + dt * 4) : Math.max(0, pad.band - dt * 1.4);
    if (!onPad && pad.placed) {
      const e = Math.min(1, dt * 9);
      pad.knobX += ((pad.left + pad.right) / 2 - pad.knobX) * e;
      pad.knobY += ((pad.top + pad.bottom) / 2 - pad.knobY) * e;
    }
  }

  function updateFx(dt) {
    fx.muzzle = Math.max(0, fx.muzzle - dt);
    fx.shake = Math.max(0, fx.shake - dt);
    fx.bomb = Math.max(0, fx.bomb - dt);
    fx.comboPop = Math.max(0, fx.comboPop - dt * 2.4);
    fx.bannerTimer = Math.max(0, fx.bannerTimer - dt);
    for (const p of fx.particles) {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      const k = Math.max(0, 1 - p.drag * dt); p.vx *= k; p.vy *= k; p.vy += 0.35 * dt;
    }
    fx.particles = fx.particles.filter(p => p.life > 0);
    for (const t of fx.texts) t.life -= dt;
    fx.texts = fx.texts.filter(t => t.life > 0);
    for (const c of clouds) { c.y += SCROLL_SPEED * dt * (c.far ? 0.45 : 1); if (c.y > 1.25) c.y -= 1.6; }
    updateAmbient(dt);
    updateWreckSmoke(dt);
  }

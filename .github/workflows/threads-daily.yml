name: Threads Daily Publish

# 매일 08:00 KST(23:00 UTC)에 큐의 맨 앞 글을 메타 스레드에 게시하고
# Slack DM으로 알린다. PC 전원과 무관하게 GitHub 클라우드에서 실행된다.
# 게시 후 queue/ 이동을 다시 커밋해 중복 게시를 막는다.
#
# 스레드 장기 토큰은 60일마다 갱신되고 갱신하면 새 토큰이 나온다. 러너에서
# 갱신된 토큰은 GH_PAT(secrets 쓰기 권한 PAT)이 있으면 THREADS_TOKEN_JSON
# secret 에 다시 저장하고, 없으면 Slack 으로 재등록을 요청한다.

on:
  schedule:
    - cron: "0 23 * * *"   # 23:00 UTC = 08:00 KST
  workflow_dispatch: {}    # 수동 실행(테스트)용

permissions:
  contents: write          # 게시 후 queue 변경을 push 하기 위함

concurrency:
  group: threads-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 스킬과 큐는 이 브랜치에만 있다. 워크플로는 main 에서
          # 실행되므로 대상 브랜치를 명시적으로 체크아웃해야 한다.
          ref: add-blogger-auto-post-skill

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet -r .claude/skills/threads-auto-post/requirements.txt

      - name: Restore credentials from secrets
        env:
          THREADS_TOKEN_JSON: ${{ secrets.THREADS_TOKEN_JSON }}
          THREADS_CONFIG_JSON: ${{ secrets.THREADS_CONFIG_JSON }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          set -e
          SKILL=.claude/skills/threads-auto-post
          mkdir -p "$SKILL/secrets" slackbot
          printf '%s' "$THREADS_TOKEN_JSON"  > "$SKILL/secrets/token.json"
          printf '%s' "$THREADS_CONFIG_JSON" > "$SKILL/secrets/config.json"
          printf 'SLACK_BOT_TOKEN=%s\n' "$SLACK_BOT_TOKEN" > slackbot/.env
          # sanity check (값은 출력하지 않음)
          python -c "import json;json.load(open('$SKILL/secrets/token.json'));json.load(open('$SKILL/secrets/config.json'));print('secrets OK')"
          # 게시 후 토큰이 갱신됐는지 비교하기 위한 지문
          sha256sum "$SKILL/secrets/token.json" | cut -d' ' -f1 > "$RUNNER_TEMP/token.before"

      - name: Publish next queued post
        run: python .claude/skills/threads-auto-post/scripts/daily_post.py

      - name: Commit queue changes
        # 게시가 성공했으면 반드시 커밋돼야 한다. 그렇지 않으면 다음 실행에서
        # 같은 글이 또 올라간다. 다른 워크플로가 같은 브랜치에 푸시할 수 있어
        # 푸시 전에 rebase 로 최신 상태를 맞춘다.
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .claude/skills/threads-auto-post/queue
          if git diff --cached --quiet; then
            echo "커밋할 queue 변경 없음."
          else
            git commit -m "chore(threads): daily publish [skip ci]"
            git pull --rebase origin add-blogger-auto-post-skill
            git push origin HEAD:add-blogger-auto-post-skill
          fi

      - name: Persist refreshed token
        # 게시 실패 여부와 무관하게 실행한다. 갱신은 게시 직전에 일어나므로
        # 게시가 실패했어도 새 토큰은 보존해야 한다.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          SKILL=.claude/skills/threads-auto-post
          [ -f "$RUNNER_TEMP/token.before" ] && [ -f "$SKILL/secrets/token.json" ] || exit 0
          AFTER=$(sha256sum "$SKILL/secrets/token.json" | cut -d' ' -f1)
          if [ "$AFTER" = "$(cat "$RUNNER_TEMP/token.before")" ]; then
            echo "토큰 변경 없음."
            exit 0
          fi
          if [ -n "$GH_TOKEN" ]; then
            gh secret set THREADS_TOKEN_JSON --repo "$GITHUB_REPOSITORY" < "$SKILL/secrets/token.json"
            echo "갱신된 토큰을 THREADS_TOKEN_JSON secret 에 저장했습니다."
          else
            echo "::warning::토큰이 갱신됐지만 GH_PAT secret 이 없어 저장하지 못했습니다."
            MSG="⚠️ 스레드 토큰이 클라우드 러너에서 갱신됐지만 GH_PAT secret 이 없어 저장하지 못했습니다. 기존 토큰이 만료되기 전에 THREADS_TOKEN_JSON secret 을 다시 등록하거나 GH_PAT 을 추가하세요. (threads_setup.md 6~7단계)" \
              python -c "import os,sys;sys.path.insert(0,'$SKILL/scripts');from common import slack_notify;slack_notify(os.environ['MSG'])"
          fi

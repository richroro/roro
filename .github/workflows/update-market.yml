name: Update market data

on:
  schedule:
    - cron: "5 * * * *" # 매시 5분에 실행 (KST 기준 시:05)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 사이트와 스크립트는 이 브랜치에만 있다. 워크플로는 main 에서
          # 실행되므로 대상 브랜치를 명시적으로 체크아웃해야 한다.
          ref: add-blogger-auto-post-skill

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch news & stock data
        run: python scripts/update_market_data.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- market/data.json; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market/data.json
          git commit -m "chore: update market data [skip ci]"
          git push

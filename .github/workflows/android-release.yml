name: Android Release

# android-game/ 의 두 앱을 **게임별로** 빌드·테스트·서명·배포한다.
#
#  - PR / main / claude/** push : 두 앱 모두 빌드 + 단위 테스트 (릴리스는 만들지 않음)
#  - skydodge-v* 태그           : Sky Dodge 만 릴리스
#  - villainrush-v* 태그        : Villain Rush 만 릴리스
#  - 수동 실행                  : app 입력으로 한 앱만 또는 둘 다 선택
#
# 앱마다 GitHub Release 와 태그가 따로 생기고 버전도 따로 올라간다.
# Play Console 에서도 두 앱은 별개의 앱이므로 등록정보·심사·versionCode 가 각각이다.
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   업로드 키스토어(.jks)를 base64 로 인코딩한 문자열
#   ANDROID_KEYSTORE_PASSWORD 키스토어 비밀번호
#   ANDROID_KEY_ALIAS         키 별칭
#   ANDROID_KEY_PASSWORD      키 비밀번호
#   PLAY_SERVICE_ACCOUNT_JSON Play Console 서비스 계정 JSON (Play 업로드 시에만)
# 키스토어 시크릿이 없으면 디버그 키로 서명한다(설치는 가능, 스토어 업로드는 불가).

on:
  push:
    branches: [main, "claude/**"]
    tags: ["skydodge-v*", "villainrush-v*"]
    paths:
      - "android-game/**"
      - ".github/workflows/android-release.yml"
  pull_request:
    paths:
      - "android-game/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
    inputs:
      app:
        description: "빌드할 게임"
        type: choice
        options: [both, skydodge, villainrush]
        default: both
      version_name:
        description: "versionName (예: 1.8.0). 비우면 1.0.0"
        required: false
        default: ""
      create_github_release:
        description: "GitHub Release 생성 후 APK/AAB 첨부"
        type: boolean
        default: false
      play_track:
        description: "Google Play 업로드 트랙 (none = 업로드 안 함)"
        type: choice
        options: [none, internal, alpha, beta, production]
        default: none

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Pick apps and version
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
      version_name: ${{ steps.pick.outputs.version_name }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - name: Decide which games to build and at what version
        id: pick
        env:
          INPUT_APP: ${{ inputs.app }}
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_RELEASE: ${{ inputs.create_github_release }}
        run: |
          set -euo pipefail
          apps='["skydodge","villainrush"]'
          version="1.0.0"
          release="false"

          case "$GITHUB_REF" in
            refs/tags/skydodge-v*)
              apps='["skydodge"]'
              version="${GITHUB_REF#refs/tags/skydodge-v}"
              release="true"
              ;;
            refs/tags/villainrush-v*)
              apps='["villainrush"]'
              version="${GITHUB_REF#refs/tags/villainrush-v}"
              release="true"
              ;;
            *)
              if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
                case "$INPUT_APP" in
                  skydodge)    apps='["skydodge"]' ;;
                  villainrush) apps='["villainrush"]' ;;
                esac
                [ -n "$INPUT_VERSION" ] && version="$INPUT_VERSION"
                release="${INPUT_RELEASE:-false}"
              fi
              ;;
          esac

          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "version_name=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "apps=$apps version=$version release=$release"

  build:
    name: ${{ matrix.app }} · build · test · sign
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-game
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      # Play Console 은 versionCode 가 앱마다 항상 증가해야 하므로 워크플로 실행 번호를 쓴다.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: ${{ needs.plan.outputs.version_name }}
    outputs:
      store_ready: ${{ steps.keystore.outputs.store_ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app settings
        id: app
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          if [ "$APP" = "skydodge" ]; then
            echo "module=app" >> "$GITHUB_OUTPUT"
            echo "gradle=:app" >> "$GITHUB_OUTPUT"
            echo "prefix=SkyDodge" >> "$GITHUB_OUTPUT"
            echo "title=Sky Dodge (스카이 닷지)" >> "$GITHUB_OUTPUT"
            echo "package=com.richroro.skydodge" >> "$GITHUB_OUTPUT"
          else
            echo "module=crowdrush" >> "$GITHUB_OUTPUT"
            echo "gradle=:crowdrush" >> "$GITHUB_OUTPUT"
            echo "prefix=VillainRush" >> "$GITHUB_OUTPUT"
            echo "title=Villain Rush (빌런 러시)" >> "$GITHUB_OUTPUT"
            echo "package=com.richroro.crowdrush" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          # Let feature-branch builds populate the cache too, so fewer Maven Central
          # downloads are needed per run (the registry rate-limits at times).
          cache-read-only: false

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Restore release keystore from secrets
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "store_ready=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore restored."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set. Artifacts are signed with the debug key: installable, but NOT uploadable to Google Play."
            echo "store_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests + release APK + release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_PREFIX: ${{ steps.app.outputs.gradle }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            "${GRADLE_PREFIX}:testReleaseUnitTest" \
            "${GRADLE_PREFIX}:assembleRelease" \
            "${GRADLE_PREFIX}:bundleRelease"

      - name: Collect artifacts
        env:
          MODULE: ${{ steps.app.outputs.module }}
          PREFIX: ${{ steps.app.outputs.prefix }}
          VERSION_NAME: ${{ needs.plan.outputs.version_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${MODULE}/build/outputs/apk/release/${MODULE}-release.apk" "dist/${PREFIX}-${VERSION_NAME}.apk"
          cp "${MODULE}/build/outputs/bundle/release/${MODULE}-release.aab" "dist/${PREFIX}-${VERSION_NAME}.aab"
          cp "${MODULE}/build/outputs/mapping/release/mapping.txt" "dist/${PREFIX}-${VERSION_NAME}-mapping.txt"
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ needs.plan.outputs.version_name }}-build${{ github.run_number }}
          path: android-game/dist/*
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-test-reports-${{ github.run_number }}
          path: android-game/${{ steps.app.outputs.module }}/build/reports/tests/
          if-no-files-found: ignore

  github-release:
    name: ${{ matrix.app }} · GitHub Release
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - name: Resolve app settings
        id: app
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          if [ "$APP" = "skydodge" ]; then
            echo "prefix=SkyDodge" >> "$GITHUB_OUTPUT"
            echo "title=Sky Dodge (스카이 닷지)" >> "$GITHUB_OUTPUT"
            echo "blurb=떨어지는 블록을 좌우 드래그로 피하고 별을 모으는 한 손 캐주얼 게임." >> "$GITHUB_OUTPUT"
          else
            echo "prefix=VillainRush" >> "$GITHUB_OUTPUT"
            echo "title=Villain Rush (빌런 러시)" >> "$GITHUB_OUTPUT"
            echo "blurb=동료를 모아 달리며 게이트를 쏴 인원을 불리고, 스테이지마다 현실 빌런을 물리치는 사격 러너." >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ needs.plan.outputs.version_name }}-build${{ github.run_number }}
          path: dist

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.app }}-v${{ needs.plan.outputs.version_name }}
          name: ${{ steps.app.outputs.title }} ${{ needs.plan.outputs.version_name }}
          prerelease: ${{ needs.build.outputs.store_ready != 'true' }}
          files: |
            dist/*.apk
            dist/*.aab
          body: |
            **${{ steps.app.outputs.title }}** ${{ needs.plan.outputs.version_name }} (versionCode ${{ github.run_number }})

            ${{ steps.app.outputs.blurb }}

            - `${{ steps.app.outputs.prefix }}-*.apk` : 휴대폰에서 직접 설치(사이드로드)용
            - `${{ steps.app.outputs.prefix }}-*.aab` : Google Play Console 업로드용 App Bundle

            ${{ needs.build.outputs.store_ready == 'true' && '릴리스 키로 서명됨 (Play Console 업로드 가능).' || '⚠️ 디버그 키로 서명됨. Play 업로드용 서명은 저장소 Secrets 에 키스토어를 등록한 뒤 다시 빌드하세요 (android-game/README.md 참고).' }}

  google-play:
    name: ${{ matrix.app }} · Upload to Google Play
    needs: [plan, build]
    if: github.event_name == 'workflow_dispatch' && inputs.play_track != 'none' && needs.build.outputs.store_ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - name: Resolve app settings
        id: app
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          if [ "$APP" = "skydodge" ]; then
            echo "prefix=SkyDodge" >> "$GITHUB_OUTPUT"
            echo "package=com.richroro.skydodge" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=VillainRush" >> "$GITHUB_OUTPUT"
            echo "package=com.richroro.crowdrush" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ needs.plan.outputs.version_name }}-build${{ github.run_number }}
          path: dist

      - name: Check Play service account secret
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is not set. See android-game/store/PLAY_STORE.md."
            exit 1
          fi

      - name: Upload AAB to Play track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.app.outputs.package }}
          releaseFiles: dist/${{ steps.app.outputs.prefix }}-${{ needs.plan.outputs.version_name }}.aab
          mappingFile: dist/${{ steps.app.outputs.prefix }}-${{ needs.plan.outputs.version_name }}-mapping.txt
          track: ${{ inputs.play_track }}
          status: completed

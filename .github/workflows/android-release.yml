name: Android Release

# android-game/ 의 두 앱(Sky Dodge :app, Goblin Hunters :crowdrush) 빌드·테스트·서명 파이프라인.
#  - PR / main push : 빌드 + 단위 테스트 + 서명된 APK/AAB 아티팩트 업로드
#  - android-v* 태그 : 위 작업 + GitHub Release 생성(APK/AAB 첨부)
#  - 수동 실행       : 옵션으로 GitHub Release 생성, Google Play 트랙 업로드
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   업로드 키스토어(.jks)를 base64 로 인코딩한 문자열
#   ANDROID_KEYSTORE_PASSWORD 키스토어 비밀번호
#   ANDROID_KEY_ALIAS         키 별칭
#   ANDROID_KEY_PASSWORD      키 비밀번호
#   PLAY_SERVICE_ACCOUNT_JSON Play Console 서비스 계정 JSON (Play 업로드 시에만)
# 키스토어 시크릿이 없으면 디버그 키로 서명한다(설치는 가능, 스토어 업로드는 불가).

on:
  push:
    branches: [main, "claude/**"]
    tags: ["android-v*"]
    paths:
      - "android-game/**"
      - ".github/workflows/android-release.yml"
  pull_request:
    paths:
      - "android-game/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName (예: 1.0.0). 비우면 태그 또는 기본값 사용"
        required: false
        default: ""
      create_github_release:
        description: "GitHub Release 생성 후 APK/AAB 첨부"
        type: boolean
        default: false
      play_track:
        description: "Google Play 업로드 트랙 (none = 업로드 안 함)"
        type: choice
        options: [none, internal, alpha, beta, production]
        default: none
      play_app:
        description: "Google Play 에 올릴 앱"
        type: choice
        options: [skydodge, crowdrush]
        default: skydodge

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Play Console 은 versionCode 가 항상 증가해야 하므로 워크플로 실행 번호를 그대로 쓴다.
  ANDROID_VERSION_CODE: ${{ github.run_number }}

jobs:
  build:
    name: Build · test · sign
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-game
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      store_ready: ${{ steps.keystore.outputs.store_ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          # Let feature-branch builds populate the cache too, so fewer Maven Central
          # downloads are needed per run (the registry rate-limits at times).
          cache-read-only: false

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Resolve version name
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            v="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            v="${GITHUB_REF#refs/tags/android-v}"
          else
            v="1.0.0"
          fi
          echo "version_name=$v" >> "$GITHUB_OUTPUT"
          echo "versionName=$v versionCode=$ANDROID_VERSION_CODE"

      - name: Restore release keystore from secrets
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "store_ready=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore restored."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set. Artifacts are signed with the debug key: installable, but NOT uploadable to Google Play."
            echo "store_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests + release APK + release AAB
        env:
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease bundleRelease

      - name: Collect artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SkyDodge-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/SkyDodge-${VERSION_NAME}.aab"
          cp app/build/outputs/mapping/release/mapping.txt "dist/SkyDodge-${VERSION_NAME}-mapping.txt"
          cp crowdrush/build/outputs/apk/release/crowdrush-release.apk "dist/GoblinHunters-${VERSION_NAME}.apk"
          cp crowdrush/build/outputs/bundle/release/crowdrush-release.aab "dist/GoblinHunters-${VERSION_NAME}.aab"
          cp crowdrush/build/outputs/mapping/release/mapping.txt "dist/GoblinHunters-${VERSION_NAME}-mapping.txt"
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apps-${{ steps.version.outputs.version_name }}-build${{ github.run_number }}
          path: android-game/dist/*
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: android-game/app/build/reports/tests/
          if-no-files-found: ignore

  github-release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && inputs.create_github_release)
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apps-${{ needs.build.outputs.version_name }}-build${{ github.run_number }}
          path: dist

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ needs.build.outputs.version_name }}
          name: Android games ${{ needs.build.outputs.version_name }}
          prerelease: ${{ needs.build.outputs.store_ready != 'true' }}
          files: |
            dist/*.apk
            dist/*.aab
          body: |
            **Sky Dodge · Goblin Hunters** ${{ needs.build.outputs.version_name }} (versionCode ${{ github.run_number }})

            | 앱 | 설치용 APK | Play 업로드용 AAB |
            | --- | --- | --- |
            | Sky Dodge (스카이 닷지) | `SkyDodge-*.apk` | `SkyDodge-*.aab` |
            | Goblin Hunters (고블린 헌터) | `GoblinHunters-*.apk` | `GoblinHunters-*.aab` |

            ${{ needs.build.outputs.store_ready == 'true' && '릴리스 키로 서명됨 (Play Console 업로드 가능).' || '⚠️ 디버그 키로 서명됨. Play 업로드용 서명은 저장소 Secrets 에 키스토어를 등록한 뒤 다시 빌드하세요 (android-game/README.md 참고).' }}

  google-play:
    name: Upload to Google Play
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.play_track != 'none' && needs.build.outputs.store_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apps-${{ needs.build.outputs.version_name }}-build${{ github.run_number }}
          path: dist

      - name: Check Play service account secret
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is not set. See android-game/README.md."
            exit 1
          fi

      - name: Pick app
        id: pick
        env:
          PLAY_APP: ${{ inputs.play_app }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
        run: |
          if [ "$PLAY_APP" = "crowdrush" ]; then
            echo "package=com.richroro.crowdrush" >> "$GITHUB_OUTPUT"
            echo "prefix=GoblinHunters" >> "$GITHUB_OUTPUT"
          else
            echo "package=com.richroro.skydodge" >> "$GITHUB_OUTPUT"
            echo "prefix=SkyDodge" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload AAB to Play track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.pick.outputs.package }}
          releaseFiles: dist/${{ steps.pick.outputs.prefix }}-${{ needs.build.outputs.version_name }}.aab
          mappingFile: dist/${{ steps.pick.outputs.prefix }}-${{ needs.build.outputs.version_name }}-mapping.txt
          track: ${{ inputs.play_track }}
          status: completed

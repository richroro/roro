<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>정확히 멈춰! · 타이밍 게임</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Pretendard',system-ui,sans-serif;
    background:radial-gradient(120% 80% at 50% -10%,#1c2b52,#0a0f1e 70%);
    color:#eaf0ff;display:flex;flex-direction:column;align-items:center;
    justify-content:space-between;user-select:none;touch-action:manipulation}
  header{width:100%;max-width:520px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
  .brand{font-weight:800;font-size:18px;letter-spacing:-.02em}
  .brand span{color:#5b8cff}
  .best{font-size:13px;color:#93a1c0}
  /* 광고 슬롯 (애드센스 승인 후 코드 삽입) */
  .ad-slot{width:100%;max-width:520px;min-height:60px;margin:0 auto;
    display:flex;align-items:center;justify-content:center;
    color:#3d496b;font-size:12px;border:1px dashed #26314d;border-radius:10px}
  main{flex:1;width:100%;max-width:520px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;padding:10px 20px}
  .scoreline{display:flex;gap:34px;text-align:center}
  .scoreline .lab{font-size:12px;color:#93a1c0;letter-spacing:.05em}
  .scoreline .val{font-size:34px;font-weight:800;line-height:1.1}
  #round .val{color:#37d9a8}
  /* 게임판 */
  .bar-wrap{position:relative;width:100%;height:26px;border-radius:999px;
    background:#141c31;border:1px solid #26314d;overflow:hidden}
  .zone{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#37d9a8,#2fbf93);
    box-shadow:0 0 18px rgba(55,217,168,.5)}
  .needle{position:absolute;top:-6px;bottom:-6px;width:5px;border-radius:3px;
    background:#fff;box-shadow:0 0 12px #fff;left:0}
  .msg{font-size:18px;font-weight:700;min-height:26px;text-align:center}
  .msg.good{color:#37d9a8}.msg.perfect{color:#ffd54a}.msg.bad{color:#ff6b6b}
  .btn{width:100%;padding:20px;border:0;border-radius:16px;font-size:20px;font-weight:800;
    color:#fff;background:linear-gradient(90deg,#5b8cff,#4f7dff);
    box-shadow:0 14px 30px -12px #5b8cff;cursor:pointer;transition:transform .08s}
  .btn:active{transform:scale(.97)}
  .btn.stop{background:linear-gradient(90deg,#ff8a4c,#ff6b6b);box-shadow:0 14px 30px -12px #ff6b6b}
  .hint{font-size:13px;color:#93a1c0;text-align:center}
  .over{text-align:center;display:none}
  .over h2{font-size:26px;margin-bottom:6px}
  .over p{color:#93a1c0;margin-bottom:18px}
  .share{margin-top:12px;background:transparent;border:1px solid #26314d;color:#eaf0ff}
  footer{width:100%;max-width:520px;padding:14px 20px;text-align:center;color:#3d496b;font-size:12px}
</style>
</head>
<body>
  <header>
    <div class="brand">정확히 <span>멈춰!</span></div>
    <div class="best">최고 라운드: <b id="best">0</b></div>
  </header>

  <!-- 상단 광고 슬롯 -->
  <div class="ad-slot">광고 영역 (애드센스 승인 후 코드 삽입)</div>

  <main>
    <div id="play">
      <div class="scoreline">
        <div id="round"><div class="lab">라운드</div><div class="val" id="roundVal">1</div></div>
        <div><div class="lab">점수</div><div class="val" id="scoreVal">0</div></div>
      </div>
      <div style="height:20px"></div>
      <div class="bar-wrap">
        <div class="zone" id="zone"></div>
        <div class="needle" id="needle"></div>
      </div>
      <div class="msg" id="msg">초록 구간에서 멈추세요</div>
      <button class="btn" id="action">시작</button>
      <div class="hint">움직이는 흰 바늘을 초록 구간에 정확히 멈출수록 고득점 · 라운드마다 빨라지고 좁아집니다</div>
    </div>

    <div class="over" id="over">
      <h2>게임 오버 😵</h2>
      <p id="overText"></p>
      <button class="btn" id="retry">다시 도전</button>
      <button class="btn share" id="shareBtn">🔗 결과 공유하기</button>
    </div>
  </main>

  <!-- 하단 광고 슬롯 -->
  <div class="ad-slot">광고 영역 (애드센스 승인 후 코드 삽입)</div>
  <footer>© 2026 · 만든이 richgogo · 친구에게 도전장을 보내보세요</footer>

<script>
(function(){
  var zone=document.getElementById('zone'),needle=document.getElementById('needle'),
      msg=document.getElementById('msg'),action=document.getElementById('action'),
      roundVal=document.getElementById('roundVal'),scoreVal=document.getElementById('scoreVal'),
      bestEl=document.getElementById('best'),play=document.getElementById('play'),
      over=document.getElementById('over'),overText=document.getElementById('overText'),
      retry=document.getElementById('retry'),shareBtn=document.getElementById('shareBtn');

  var best=+(localStorage.getItem('tap_best')||0); bestEl.textContent=best;

  var round=1,score=0,pos=0,dir=1,speed=1.1,zoneW=34,zoneX=33,running=false,raf=null;

  function setupRound(){
    zoneW=Math.max(9,34-(round-1)*2.2);      // 구간 폭 점점 좁게
    speed=1.1+(round-1)*0.22;                 // 속도 점점 빠르게
    zoneX=Math.random()*(100-zoneW);          // 구간 위치 랜덤
    zone.style.left=zoneX+'%'; zone.style.width=zoneW+'%';
    pos=0; dir=1;
    roundVal.textContent=round; scoreVal.textContent=score;
    msg.className='msg'; msg.textContent='라운드 '+round;
  }
  function loop(){
    pos+=dir*speed;
    if(pos>=100){pos=100;dir=-1;} else if(pos<=0){pos=0;dir=1;}
    needle.style.left='calc('+pos+'% - 2px)';
    raf=requestAnimationFrame(loop);
  }
  function start(){
    running=true; action.textContent='멈춰!'; action.classList.add('stop');
    loop();
  }
  function stop(){
    running=false; cancelAnimationFrame(raf);
    action.textContent='다음 라운드'; action.classList.remove('stop');
    var center=zoneX+zoneW/2, dist=Math.abs(pos-center);
    if(pos>=zoneX && pos<=zoneX+zoneW){
      var perfect=dist<zoneW*0.18;
      var gained=perfect?200+round*20:100+round*10;
      score+=gained;
      msg.className='msg '+(perfect?'perfect':'good');
      msg.textContent=perfect?'⭐ 퍼펙트! +'+gained:'좋아요! +'+gained;
      scoreVal.textContent=score;
      round++;
      action.onclick=nextRound;
    }else{
      gameOver();
    }
  }
  function nextRound(){ setupRound(); action.textContent='시작'; action.onclick=beginRound; }
  function beginRound(){ start(); action.onclick=stop; }
  function gameOver(){
    msg.className='msg bad'; msg.textContent='빗나갔어요!';
    if(round-1>best){best=round-1;localStorage.setItem('tap_best',best);bestEl.textContent=best;}
    play.style.display='none'; over.style.display='block';
    overText.textContent='라운드 '+(round)+' 도달 · 점수 '+score;
  }
  function reset(){
    round=1;score=0; over.style.display='none'; play.style.display='block';
    setupRound(); action.textContent='시작'; action.onclick=beginRound;
  }

  action.onclick=beginRound;
  retry.onclick=reset;
  shareBtn.onclick=function(){
    var text='정확히 멈춰! 라운드 '+(round)+', '+score+'점 달성 🎯 도전해봐!';
    if(navigator.share){navigator.share({title:'정확히 멈춰!',text:text,url:location.href}).catch(function(){});}
    else{navigator.clipboard&&navigator.clipboard.writeText(text+' '+location.href);shareBtn.textContent='✅ 복사됨! 붙여넣기 하세요';}
  };

  setupRound();
})();
</script>
</body>
</html>

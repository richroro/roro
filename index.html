<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미니 축구 게임</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <h1>⚽ 미니 축구</h1>
    <div id="hud">
      <div class="score-box">
        <span class="team-label blue">나</span>
        <span id="scoreBlue">0</span>
        <span class="dash">:</span>
        <span id="scoreRed">0</span>
        <span class="team-label red">CPU</span>
      </div>
      <div id="timer">02:00</div>
    </div>
    <div id="field-wrap">
      <canvas id="field" width="900" height="560"></canvas>
      <div id="overlay" class="hidden">
        <div id="overlay-text"></div>
        <button id="restartBtn">다시 시작</button>
      </div>
      <div id="touch-controls">
        <div id="dpad">
          <button class="dpad-btn" id="btn-up" data-key="arrowup">▲</button>
          <button class="dpad-btn" id="btn-left" data-key="arrowleft">◀</button>
          <button class="dpad-btn" id="btn-right" data-key="arrowright">▶</button>
          <button class="dpad-btn" id="btn-down" data-key="arrowdown">▼</button>
        </div>
        <div id="action-buttons">
          <button class="action-btn" id="btn-sprint">스프린트</button>
          <button class="action-btn shoot" id="btn-shoot">슛</button>
        </div>
      </div>
    </div>
    <div id="controls">
      방향키/WASD: 이동 &nbsp;|&nbsp; Shift: 스프린트 &nbsp;|&nbsp; Space: 누르고 있다가 떼면 슛(길게 누를수록 강함, 공 없을 땐 근접 태클) &nbsp;|&nbsp; P: 일시정지<br>
      <span class="mobile-hint">모바일: 왼쪽 방향 버튼으로 이동, 오른쪽 버튼으로 스프린트/슛</span>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>

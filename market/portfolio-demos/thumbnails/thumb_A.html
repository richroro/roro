<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:900px; overflow:hidden; }
  body {
    font-family:"Malgun Gothic","맑은 고딕",sans-serif;
    background:linear-gradient(135deg,#0f2d5c 0%,#1e5799 55%,#2989d8 100%);
    color:#fff; position:relative;
  }
  .wrap { position:absolute; inset:0; padding:70px 72px; display:flex; flex-direction:column; }
  .badge {
    display:inline-block; align-self:flex-start; background:#ffd21f; color:#0f2d5c;
    font-weight:900; font-size:34px; padding:12px 26px; border-radius:12px; letter-spacing:-1px;
  }
  h1 { font-size:74px; font-weight:900; line-height:1.18; margin-top:34px; letter-spacing:-2px; text-shadow:0 4px 18px rgba(0,0,0,.25); }
  h1 .hl { color:#ffd21f; }
  .flow { margin-top:auto; display:flex; align-items:center; gap:26px; }
  .card {
    background:rgba(255,255,255,.13); border:2px solid rgba(255,255,255,.35);
    border-radius:18px; padding:24px 22px; text-align:center; backdrop-filter:blur(2px);
  }
  .card .ico { font-size:60px; line-height:1; }
  .card .t { margin-top:10px; font-size:26px; font-weight:800; }
  .card .s { font-size:19px; opacity:.85; margin-top:2px; }
  .before .files { font-size:40px; letter-spacing:-6px; }
  .arrow { font-size:76px; font-weight:900; color:#ffd21f; }
  .after { background:#ffd21f; color:#0f2d5c; border-color:#ffd21f; }
  .after .s { opacity:.7; }
  .foot {
    margin-top:34px; display:flex; align-items:center; justify-content:space-between;
    border-top:2px solid rgba(255,255,255,.25); padding-top:22px;
  }
  .foot .l { font-size:30px; font-weight:800; }
  .foot .r { font-size:34px; font-weight:900; color:#ffd21f; }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">엑셀 자동화</span>
    <h1>매일 반복되는 엑셀 노가다,<br><span class="hl">자동화</span>로 끝내드립니다</h1>

    <div class="flow">
      <div class="card before">
        <div class="files">📄📄📄📄📄</div>
        <div class="t">흩어진 파일들</div>
        <div class="s">매번 손으로 정리</div>
      </div>
      <div class="arrow">➜</div>
      <div class="card after">
        <div class="ico">📊</div>
        <div class="t">통합 리포트</div>
        <div class="s">차트까지 자동 생성</div>
      </div>
    </div>

    <div class="foot">
      <div class="l">파이썬 기반 · 실제 작동하는 결과물</div>
      <div class="r">5만원부터</div>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:900px; overflow:hidden; }
  body {
    font-family:"Malgun Gothic","맑은 고딕",sans-serif;
    background:#0e1626; color:#fff; position:relative;
  }
  .glow { position:absolute; width:700px; height:700px; border-radius:50%;
    background:radial-gradient(circle,#2989d8aa,transparent 65%); top:-160px; right:-160px; }
  .wrap { position:absolute; inset:0; padding:78px 76px; display:flex; flex-direction:column; }
  .badge { align-self:flex-start; background:#39d98a; color:#06301d; font-weight:900;
    font-size:32px; padding:11px 24px; border-radius:999px; }
  h1 { font-size:70px; font-weight:900; line-height:1.2; margin-top:40px; letter-spacing:-2px; }
  .big { display:flex; align-items:baseline; gap:24px; margin-top:20px; }
  .big .num { font-size:150px; font-weight:900; color:#39d98a; line-height:.9; letter-spacing:-6px; }
  .big .txt { font-size:52px; font-weight:800; }
  .strike { position:relative; color:#8aa0c0; }
  .strike::after { content:""; position:absolute; left:-6px; right:-6px; top:52%; height:8px;
    background:#ff5a5a; transform:rotate(-6deg); border-radius:4px; }
  .foot { margin-top:auto; display:flex; align-items:center; justify-content:space-between;
    border-top:2px solid rgba(255,255,255,.18); padding-top:24px; }
  .tags { font-size:30px; font-weight:800; color:#cfe0f5; }
  .price { font-size:36px; font-weight:900; color:#39d98a; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <span class="badge">업무 자동화</span>
    <h1>손으로 하던 <span class="strike">하루 2시간</span> 엑셀 정리</h1>
    <div class="big">
      <span class="num">0분</span>
      <span class="txt">클릭 한 번이면<br>끝납니다</span>
    </div>
    <div class="foot">
      <div class="tags">웹 크롤링 · 엑셀 자동화 · 데이터 수집</div>
      <div class="price">5만원부터</div>
    </div>
  </div>
</body>
</html>

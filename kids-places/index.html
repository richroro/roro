<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#F4F7F2;
  --surface:#FFFFFF;
  --surface-2:#EAF0E6;
  --ink:#1E2A22;
  --ink-soft:#56645A;
  --line:#D5DED0;
  --green:#2C8A55;
  --green-ink:#FFFFFF;
  --yellow:#FFC83D;
  --yellow-ink:#3A2C00;
  --stamp:#D23F36;
  --focus:#1F6FD1;
  --t-sci:#2F78C4;
  --t-hist:#A0662A;
  --t-nat:#2C8A55;
  --t-ani:#138A8A;
  --t-play:#C9468E;
  --t-art:#7457C2;

  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#131915;
    --surface:#1B231E;
    --surface-2:#232E27;
    --ink:#E6EEE7;
    --ink-soft:#9DAEA2;
    --line:#2F3C33;
    --green:#4DB57A;
    --green-ink:#0C1A11;
    --yellow:#F2BE3A;
    --yellow-ink:#2A1F00;
    --stamp:#F0675D;
    --focus:#7FB2FF;
    --t-sci:#6FA8E8;
    --t-hist:#D39A5C;
    --t-nat:#5CC48A;
    --t-ani:#4CC2C2;
    --t-play:#EA7DB6;
    --t-art:#A58BEA;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#131915;
  --surface:#1B231E;
  --surface-2:#232E27;
  --ink:#E6EEE7;
  --ink-soft:#9DAEA2;
  --line:#2F3C33;
  --green:#4DB57A;
  --green-ink:#0C1A11;
  --yellow:#F2BE3A;
  --yellow-ink:#2A1F00;
  --stamp:#F0675D;
  --focus:#7FB2FF;
  --t-sci:#6FA8E8;
  --t-hist:#D39A5C;
  --t-nat:#5CC48A;
  --t-ani:#4CC2C2;
  --t-play:#EA7DB6;
  --t-art:#A58BEA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.25}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-size:30px;letter-spacing:-.01em}
.brand p{margin:0;color:var(--ink-soft);font-size:14px}
.stamp-count{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:6px 14px 6px 6px;font-size:14px;
}
.stamp-count .dot{
  width:34px;height:34px;border-radius:50%;
  border:2px solid var(--stamp);color:var(--stamp);
  display:grid;place-items:center;font-family:var(--display);font-size:13px;transform:rotate(-12deg);
}
.stamp-count b{font-variant-numeric:tabular-nums}

/* pick panel */
.pick{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:18px;
  background:var(--yellow);color:var(--yellow-ink);
  border-radius:20px;padding:20px;
}
.pick-intro{display:flex;flex-direction:column;gap:12px;justify-content:center}
.pick-intro h2{font-size:28px}
.pick-intro p{margin:0;font-size:14px;opacity:.85}
.pick-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pick-row label{font-size:13px;font-weight:700}
.pick select{
  background:rgba(255,255,255,.75);border:1px solid rgba(58,44,0,.25);border-radius:10px;
  padding:8px 10px;color:#3A2C00;
}
.btn-draw{
  border:0;border-radius:12px;padding:10px 18px;cursor:pointer;
  background:#1E2A22;color:#FFF7DD;font-family:var(--display);font-size:18px;
  transition:transform .12s ease;
}
.btn-draw:hover{transform:translateY(-1px)}
.btn-draw:active{transform:translateY(1px)}
.pick-card{
  background:var(--surface);color:var(--ink);border-radius:16px;padding:18px;
  display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-height:180px;
}
.pick-card .eyebrow{font-size:12px;letter-spacing:.06em;color:var(--ink-soft);font-weight:700}
.pick-card h3{font-size:24px}
.pick-card p{margin:0}
.pick-card.flash{animation:pop .35s ease}
@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}

/* filters */
.filters{display:flex;flex-direction:column;gap:12px}
.search{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);font-size:15px;
}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip-label{flex:none;font-size:12px;font-weight:700;color:var(--ink-soft);align-self:center;min-width:34px;letter-spacing:.04em}
.chip{
  flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:6px 13px;font-size:14px;cursor:pointer;white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink);font-weight:700}
.chip .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.opts{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--green)}
.opts select{padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}

/* tabs + result bar */
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px}
.tab{
  border:0;background:none;padding:10px 12px;cursor:pointer;font-size:15px;color:var(--ink-soft);
  border-bottom:3px solid transparent;margin-bottom:-1px;
}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--green)}
.tab small{font-variant-numeric:tabular-nums;margin-left:3px}
.result-note{font-size:13px;color:var(--ink-soft);padding-block:6px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:16px;display:flex;flex-direction:column;gap:10px;
}
.card-head{display:flex;flex-direction:column;gap:3px;padding-right:64px}
.type{font-size:12px;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.type::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.card h3{font-size:21px}
.where{font-size:13px;color:var(--ink-soft)}
.where b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink)}
.badge.free{background:var(--green);color:var(--green-ink);font-weight:700}
.desc{margin:0;font-size:14.5px}
details{font-size:14px;border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--ink-soft);font-weight:500}
details dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px}
details dt{font-weight:700;font-size:13px;color:var(--ink-soft)}
details dd{margin:0}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.act{
  border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;
  font-size:13.5px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:5px;
}
.act:hover{background:var(--surface-2)}
.act.fav[aria-pressed="true"]{border-color:var(--stamp);color:var(--stamp);font-weight:700}
.act.visit[aria-pressed="true"]{background:var(--stamp);border-color:var(--stamp);color:#fff;font-weight:700}
.act svg{width:15px;height:15px}
.seal{
  position:absolute;top:14px;right:14px;width:62px;height:62px;border-radius:50%;
  border:2.5px solid var(--stamp);color:var(--stamp);
  display:grid;place-items:center;text-align:center;
  font-family:var(--display);font-size:15px;line-height:1.05;
  transform:rotate(-14deg);opacity:.9;
  box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4.5px var(--stamp);
}
.seal.new{animation:thump .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes thump{from{transform:rotate(-14deg) scale(1.6);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:.9}}

.empty{
  grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--ink-soft);
  border:2px dashed var(--line);border-radius:16px;
}
.empty button{margin-top:10px}
.foot{font-size:13px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px}
.foot p{margin:0}

@media (max-width:760px){
  .pick{grid-template-columns:1fr;padding:16px}
  .brand h1{font-size:26px}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>아이랑 나들이 수첩</h1>
      <p>초등학생과 함께 가기 좋은 전국 <span id="total-count">0</span>곳, 골라 보고 다녀오면 도장 꾹</p>
    </div>
    <div class="stamp-count" aria-live="polite">
      <span class="dot">도장</span>

  </header>

  <section class="pick" aria-labelledby="pick-title">
    <div class="pick-intro">
      <h2 id="pick-title">이번 주말, 어디 갈까?</h2>
      <p>아래에서 고른 조건 안에서 한 곳을 뽑아 드려요. 출발지를 정하면 가까운 순으로도 볼 수 있어요.</p>
      <div class="pick-row">
        <label for="origin">출발지</label>
        <select id="origin"></select>
        <button class="btn-draw" id="draw" type="button">한 곳 뽑기</button>
      </div>
    </div>
    <article class="pick-card" id="pick-card" aria-live="polite"></article>
  </section>

  <section class="filters" aria-label="검색과 필터">
    <input class="search" id="q" type="search" placeholder="장소 이름, 도시, 키워드로 찾기 (예: 공룡, 과학, 경주)" autocomplete="off">
    <div class="chip-row" id="region-chips" role="group" aria-label="지역"></div>
    <div class="chip-row" id="type-chips" role="group" aria-label="종류"></div>
    <div class="opts">
      <label class="toggle"><input type="checkbox" id="rain"> 비 와도 OK (실내)</label>
      <label class="toggle"><input type="checkbox" id="free"> 무료만</label>
      <label class="toggle">학년

          <option value="low">저학년 (1~3학년)</option>
          <option value="high">고학년 (4~6학년)</option>

      <label class="toggle">정렬
        <select id="sort">
          <option value="near">출발지에서 가까운 순</option>
          <option value="name">이름 순</option>
        </select>
      </label>
    </div>
  </section>

  <section aria-label="장소 목록" style="display:flex;flex-direction:column;gap:14px">
    <div class="bar">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="all" aria-selected="true" id="tab-all">전체<small id="c-all"></small></button>
        <button class="tab" role="tab" data-tab="fav" aria-selected="false" id="tab-fav">찜한 곳<small id="c-fav"></small></button>
        <button class="tab" role="tab" data-tab="visit" aria-selected="false" id="tab-visit">다녀온 곳<small id="c-visit"></small></button>
      </div>
      <div class="result-note" id="result-note"></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <footer class="foot">
    <p>운영 시간, 요금, 예약 방식, 휴관일은 자주 바뀌어요. 출발 전에 꼭 공식 홈페이지나 지도 앱에서 확인해 주세요.</p>
    <p>거리는 출발 도시 중심에서 잰 직선거리라 실제 이동 거리와 달라요. 찜과 도장은 이 기기의 브라우저에만 저장돼요.</p>
  </footer>
</div>

function km(lat1, lng1, lat2, lng2){
  const R = 6371, rad = Math.PI/180;
  const dLat = (lat2-lat1)*rad, dLng = (lng2-lng1)*rad;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function distOf(p){
  const o = ORIGINS.find(x => x[0] === state.origin) || ORIGINS[0];
  return km(o[1], o[2], p.lat, p.lng);
}
function fmtKm(d){ return "약 " + (d < 20 ? Math.max(1, Math.round(d)) : Math.round(d/5)*5) + "km"; }

function matches(p){
  if (state.region && p.region !== state.region) return false;
  if (state.type && p.type !== state.type) return false;
  if (state.rain && p.io === "out") return false;
  if (state.free && p.fee !== "free") return false;
  if (state.grade && !(p.grade === "all" || p.grade === state.grade)) return false;
  if (state.q){
    const hay = [p.name, p.city, REGIONS[p.region], TYPES[p.type].label, p.desc, p.learn].join(" ").toLowerCase();
    if (!state.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w))) return false;
  }
  return true;
}
function filtered(){
  let list = PLACES.filter(matches);
  if (state.sort === "near") list.sort((a,b) => distOf(a) - distOf(b));
  else list.sort((a,b) => a.name.localeCompare(b.name, "ko"));
  return list;
}

const ICON_MAP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const ICON_HEART = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg>';
const ICON_HEART_O = ICON_HEART.replace('fill="currentColor"', 'fill="none"');

function badges(p){
  return `<div class="badges">
    <span class="badge">${IO[p.io]}</span>
    <span class="badge${p.fee === "free" ? " free" : ""}">${FEE[p.fee]}</span>
    <span class="badge">${GRADE[p.grade]}</span>
    <span class="badge">${p.time}</span>
  </div>`;
}
function mapLinks(p){
  const q = encodeURIComponent(p.name.replace(/\s*\(.*\)/, "").split("·")[0]);
  return `<a class="act" href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">${ICON_MAP}네이버</a>
          <a class="act" href="https://map.kakao.com/?q=${q}" target="_blank" rel="noopener">${ICON_MAP}카카오</a>`;
}

function cardHTML(p){
  const t = TYPES[p.type], fav = state.fav.has(p.id), vis = state.visit.has(p.id);
  return `<article class="card" data-id="${p.id}">
    ${vis ? `<div class="seal${state.justStamped === p.id ? " new" : ""}" aria-label="다녀온 곳">다녀<br>왔어요</div>` : ""}
    <div class="card-head">
      <span class="type" style="color:${t.color}">${t.label}</span>
      <h3>${esc(p.name)}</h3>
      <span class="where">${esc(p.city)} · ${state.origin}에서 <b>${fmtKm(distOf(p))}</b></span>
    </div>
    ${badges(p)}
    <p class="desc">${esc(p.desc)}</p>
    <details>
      <summary>가기 전에 알아 둘 것</summary>
      <dl>
        <dt>꿀팁</dt><dd>${esc(p.tip)}</dd>
        <dt>배움</dt><dd>${esc(p.learn)}</dd>
      </dl>
    </details>
    <div class="actions">
      <button class="act fav" type="button" data-act="fav" aria-pressed="${fav}">${fav ? ICON_HEART : ICON_HEART_O}${fav ? "찜했어요" : "찜"}</button>
      <button class="act visit" type="button" data-act="visit" aria-pressed="${vis}">${vis ? "도장 취소" : "다녀왔어요 도장"}</button>
      ${mapLinks(p)}
    </div>
  </article>`;
}

function renderList(){
  let list = filtered();
  const counts = {
    all: list.length,
    fav: list.filter(p => state.fav.has(p.id)).length,
    visit: list.filter(p => state.visit.has(p.id)).length
  };
  if (state.tab === "fav") list = list.filter(p => state.fav.has(p.id));
  if (state.tab === "visit") list = list.filter(p => state.visit.has(p.id));
  $("#c-all").textContent = counts.all;
  $("#c-fav").textContent = counts.fav;
  $("#c-visit").textContent = counts.visit;

  const note = [];
  if (state.region) note.push(REGIONS[state.region]);
  if (state.type) note.push(TYPES[state.type].label);
  if (state.rain) note.push("실내");
  if (state.free) note.push("무료");
  if (state.grade) note.push(state.grade === "low" ? "저학년" : "고학년");
  $("#result-note").textContent = note.length ? note.join(" · ") + ` 조건 ${list.length}곳` : `${list.length}곳`;

  const grid = $("#grid");
  if (!list.length){
    const msg = state.tab === "fav" ? "아직 찜한 곳이 없어요. 마음에 드는 곳에서 ‘찜’을 눌러 보세요."
              : state.tab === "visit" ? "아직 도장이 없어요. 다녀온 곳에서 ‘다녀왔어요 도장’을 눌러 보세요."
              : "조건에 맞는 곳이 없어요. 필터를 조금 풀어 보세요.";
    grid.innerHTML = `<div class="empty"><p>${msg}</p>${state.tab === "all" ? '<button class="act" type="button" id="reset">필터 모두 풀기</button>' : ""}</div>`;
  } else {
    grid.innerHTML = list.map(cardHTML).join("");
  }
  $("#stamp-num").textContent = state.visit.size;
  state.justStamped = null;
}

function renderPick(p, flash){
  const el = $("#pick-card");
  if (!p){
    el.innerHTML = `<span class="eyebrow">추천할 곳이 없어요</span><p>지금 고른 조건에 맞는 곳이 없어요. 필터를 조금 풀고 다시 뽑아 보세요.</p>`;
    return;
  }
  const t = TYPES[p.type];
  el.innerHTML = `
    <span class="eyebrow">${state.origin}에서 ${fmtKm(distOf(p))} · <span style="color:${t.color}">${t.label}</span></span>
    <h3>${esc(p.name)}</h3>
    ${badges(p)}
    <p>${esc(p.desc)}</p>
    <p style="font-size:13.5px;color:var(--ink-soft)">꿀팁: ${esc(p.tip)}</p>
    <div class="actions">${mapLinks(p)}</div>`;
  if (flash){ el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
}
let lastPick = null;
function draw(flash){
  const list = PLACES.filter(matches);
  if (!list.length){ renderPick(null); return; }
  // Prefer places within a day trip (under 150km) and not yet visited
  let pool = list.filter(p => distOf(p) < 150 && !state.visit.has(p.id));
  if (!pool.length) pool = list.filter(p => !state.visit.has(p.id));
  if (!pool.length) pool = list;
  if (pool.length > 1) pool = pool.filter(p => p !== lastPick);
  lastPick = pool[Math.floor(Math.random()*pool.length)];
  renderPick(lastPick, flash);
}

function chips(el, entries, key, colorOf){
  const label = el.getAttribute("aria-label");
  el.innerHTML = `<span class="chip-label">${label}</span>` +
    [["", "전체"], ...entries].map(([v, l]) =>
      `<button type="button" class="chip" data-v="${v}" aria-pressed="${state[key] === v}">${colorOf && v ? `<span class="sw" style="background:${colorOf(v)}"></span>` : ""}${l}</button>`
    ).join("");
  el.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    state[key] = b.dataset.v;
    el.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.v === state[key]));
    renderList();
  });
}

function init(){
  $("#total-count").textContent = PLACES.length;
  $("#stamp-total").textContent = PLACES.length;

  const origin = $("#origin");
  origin.innerHTML = ORIGINS.map(o => `<option${o[0] === state.origin ? " selected" : ""}>${o[0]}</option>`).join("");
  if (!ORIGINS.some(o => o[0] === state.origin)) state.origin = "서울";
  origin.addEventListener("change", () => {
    state.origin = origin.value; store.set("kp-origin", state.origin);
    renderList(); draw(true);
  });

  chips($("#region-chips"), Object.entries(REGIONS), "region");
  chips($("#type-chips"), Object.entries(TYPES).map(([k, v]) => [k, v.label]), "type", k => TYPES[k].color);

  $("#q").addEventListener("input", e => { state.q = e.target.value.trim(); renderList(); });
  $("#rain").addEventListener("change", e => { state.rain = e.target.checked; renderList(); });
  $("#free").addEventListener("change", e => { state.free = e.target.checked; renderList(); });
  $("#grade").addEventListener("change", e => { state.grade = e.target.value; renderList(); });
  $("#sort").addEventListener("change", e => { state.sort = e.target.value; renderList(); });
  $("#draw").addEventListener("click", () => draw(true));

  document.querySelector(".tabs").addEventListener("click", e => {
    const b = e.target.closest(".tab"); if (!b) return;
    state.tab = b.dataset.tab;
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t === b));
    renderList();
  });

  $("#grid").addEventListener("click", e => {
    if (e.target.id === "reset"){
      Object.assign(state, {q:"", region:"", type:"", rain:false, free:false, grade:""});
      $("#q").value = ""; $("#rain").checked = false; $("#free").checked = false; $("#grade").value = "";
      document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.v === ""));
      renderList(); return;
    }
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const id = b.closest(".card").dataset.id;
    const set = b.dataset.act === "fav" ? state.fav : state.visit;
    if (set.has(id)) set.delete(id);
    else { set.add(id); if (b.dataset.act === "visit") state.justStamped = id; }
    store.set("kp-fav", [...state.fav]);
    store.set("kp-visit", [...state.visit]);
    renderList();
  });

  renderList();
  draw(false);
}
init();
</script>
